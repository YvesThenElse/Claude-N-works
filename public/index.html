<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orange Black Box — sessions ouvertes</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<script>
  /* Avant le premier affichage : une page choisie en clair ne doit jamais paraître
     sombre le temps d'une image. */
  try {
    const r = JSON.parse((localStorage.getItem('orange-black-box.reglages.v1')
      || localStorage.getItem('claude-n-works.reglages.v1'))) || {};
    if (r.theme === 'clair') document.documentElement.dataset.theme = 'clair';
  } catch { /* stockage refusé : on reste au thème sombre */ }
</script>
<style>
  /*
   * La palette. Les mêmes rôles et les mêmes valeurs que `session.html` — le thème clair
   * est celui qui a été validé là-bas, et les deux écrans doivent être du même monde.
   */
  :root {
    --fond: #11131a;
    --fond-carte: #1a1d27;
    --fond-carte-active: #222634;
    --trait: #2b3040;
    --trait-survol: #39405a;
    --texte: #e4e6ee;
    --texte-faible: #8d93a8;
    --accent: #7aa2f7; --accent-vif: #8fb3ff; --sur-accent: #11131a;
    --occupe: #e0af68;
    --attente: #9ece6a;
    --mort: #565f89;
    --halo-occupe: #e0af6820;
    --halo-attente: #9ece6a20; --halo-accent: #7aa2f733;
    --voile: #080a0ecc; --ombre-forte: #000a;
  }

  :root[data-theme="clair"] {
    --fond: #eceef3;
    --fond-carte: #ffffff;
    --fond-carte-active: #f3f5fa;
    --trait: #c9cedb;
    --trait-survol: #9aa3bb;
    --texte: #1b1f2e;
    --texte-faible: #5c6479;
    --accent: #2563c9; --accent-vif: #1d4ed8; --sur-accent: #ffffff;
    --occupe: #b45309;
    --attente: #15803d;
    --mort: #7c8396;
    --halo-occupe: #b4530922;
    --halo-attente: #15803d22; --halo-accent: #2563c940;
    --voile: #3a425699; --ombre-forte: #2a3a5526;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fond);
    color: var(--texte);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    padding: 2rem 1.5rem 4rem;
  }
  .page { max-width: 68rem; margin: 0 auto; }
  h1 { font-size: 1.3rem; font-weight: 600; margin: 0 0 .25rem; }
  .tete { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
  /* La marque : le logo et le nom se lisent comme un seul objet, donc ils sont alignés
     sur leur milieu et non sur le haut du bloc. */
  .marque { display: flex; align-items: center; gap: .7rem; }
  .marque img { display: block; flex: none; }

  /* La bascule dit où l'on va, pas où l'on est : en sombre, elle propose le clair. */
  .bascule-theme {
    display: inline-flex; align-items: center; gap: .4rem;
    background: var(--fond-carte); color: var(--texte-faible);
    border: 1px solid var(--trait); border-radius: 999px;
    padding: .35rem .8rem .35rem .6rem; cursor: pointer;
    font: inherit; font-size: .8rem; white-space: nowrap;
    transition: color .12s, border-color .12s, background .12s;
  }
  .bascule-theme:hover { color: var(--texte); border-color: var(--accent); }
  .bascule-theme:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bascule-theme .astre { font-size: .95rem; line-height: 1; }
  .sous-titre { color: var(--texte-faible); font-size: .85rem; margin: 0 0 2rem; }
  .sous-titre b { color: var(--texte); font-weight: 600; }

  .liste { display: grid; gap: .75rem; }
  .carte {
    background: var(--fond-carte);
    border: 1px solid var(--trait);
    border-radius: 10px;
    padding: .9rem 1.1rem;
    cursor: pointer;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: .25rem 1rem;
    align-items: center;
    transition: background .12s, border-color .12s;
  }
  .carte:hover { background: var(--fond-carte-active); border-color: var(--trait-survol); }
  .carte[aria-selected="true"] { border-color: var(--accent); background: var(--fond-carte-active); }

  .pastille { width: .6rem; height: .6rem; border-radius: 50%; grid-row: span 2; }
  .pastille.busy { background: var(--occupe); box-shadow: 0 0 0 4px var(--halo-occupe); }
  .pastille.waiting { background: var(--attente); box-shadow: 0 0 0 4px var(--halo-attente); }
  .pastille.autre { background: var(--mort); }

  .nom { font-weight: 600; }
  .nom .devine { color: var(--texte-faible); font-weight: 400; font-size: .8rem; }
  .chemin {
    grid-column: 2; color: var(--texte-faible); font-size: .8rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow-wrap: anywhere;
  }
  .droite { grid-row: span 2; text-align: right; color: var(--texte-faible); font-size: .8rem; }
  .droite .etat { display: block; color: var(--texte); font-size: .85rem; }
  .droite .etat.busy { color: var(--occupe); }
  .droite .etat.waiting { color: var(--attente); }

  /*
   * La fiche d'une session s'ouvre en modale, comme les cartes de l'écran de session :
   * les deux écrans doivent parler la même langue. Posée sous la liste, elle obligeait à
   * défiler pour lire ce qu'on venait de demander, et le bouton tombait hors de l'écran.
   */
  .panneau {
    position: fixed; inset: 0; z-index: 40; background: var(--voile);
    display: none; align-items: center; justify-content: center; padding: 2.5vh 2vw;
  }
  .panneau.ouvert { display: flex; }
  .detail {
    background: var(--fond-carte); border: 1px solid var(--trait);
    border-radius: 12px; box-shadow: 0 22px 60px var(--ombre-forte);
    width: min(48rem, 96vw); max-height: 92vh; overflow-y: auto;
    padding: 1.3rem 1.5rem 1.6rem;
  }
  .detail .fermer {
    float: right; background: none; border: 0; color: var(--texte-faible);
    font-size: 1.5rem; cursor: pointer; line-height: 1; padding: 0 .2rem;
  }
  .detail .fermer:hover { color: var(--texte); }
  .detail .fermer:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .detail .finie {
    margin: .9rem 0 0; color: var(--occupe); font-size: .83rem;
  }
  .detail h2 { font-size: 1rem; margin: 0 0 .9rem; font-weight: 600; }
  .detail dl { display: grid; grid-template-columns: max-content 1fr; gap: .4rem 1.2rem; margin: 0; }
  .detail dt { color: var(--texte-faible); font-size: .82rem; }
  .detail dd {
    margin: 0; font-size: .85rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow-wrap: anywhere;
  }
  .detail .suite {
    margin: 1.1rem 0 0; padding-top: .9rem; border-top: 1px solid var(--trait);
    color: var(--texte-faible); font-size: .83rem; font-style: italic;
  }
  /*
   * Le bouton qui mène à la ligne du temps. C'est la seule action de cette page, et
   * l'unique raison d'avoir sélectionné une session : il doit se voir comme un bouton et
   * non comme un lien de plus au milieu d'une fiche d'identité.
   */
  .detail .bouton {
    display: inline-flex; align-items: center; gap: .5rem;
    background: var(--accent); color: var(--sur-accent);
    text-decoration: none; font-style: normal;
    font-size: .92rem; font-weight: 600; letter-spacing: .01em;
    padding: .62rem 1.15rem; border-radius: 8px; border: 1px solid transparent;
    transition: background .12s, transform .08s, box-shadow .12s;
  }
  .detail .bouton:hover {
    background: var(--accent-vif);
    box-shadow: 0 2px 10px var(--halo-accent);
  }
  .detail .bouton:active { transform: translateY(1px); }
  .detail .bouton:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  /* La flèche avance au survol : le bouton dit où il mène. */
  .detail .bouton .fleche { transition: transform .12s; }
  .detail .bouton:hover .fleche { transform: translateX(3px); }
  .vide { color: var(--texte-faible); padding: 2rem 0; }
  .alerte { color: var(--occupe); font-size: .83rem; margin-top: 1rem; }

  /* La barre des machines. Elle ne paraît que s'il y en a à suivre : tant qu'on ne
     regarde que ce poste, l'écran doit rester exactement celui d'avant. */
  .machines {
    display: flex; gap: .4rem; align-items: center; flex-wrap: wrap;
    margin: 0 0 .9rem; font-size: .83rem;
  }
  .machines button.onglet {
    background: none; border: 1px solid var(--trait); border-radius: 999px;
    color: var(--texte-faible); font: inherit; font-size: .8rem;
    padding: .15rem .7rem; cursor: pointer;
  }
  .machines button.onglet:hover { color: var(--texte); }
  .machines button.onglet[aria-pressed="true"] {
    color: var(--sur-accent); background: var(--accent); border-color: var(--accent);
  }
  .machines .panne {
    color: var(--occupe); border-color: var(--occupe);
  }
  .machines .ajouter {
    margin-left: auto; background: none; border: 1px dashed var(--trait);
    border-radius: 999px; color: var(--texte-faible); font: inherit; font-size: .8rem;
    padding: .15rem .7rem; cursor: pointer;
  }
  .machines .ajouter:hover { color: var(--texte); border-color: var(--texte-faible); }
  .machines .retirer {
    background: none; border: 0; color: var(--texte-faible); cursor: pointer;
    font-size: .95rem; line-height: 1; padding: 0 .1rem;
  }
  .machines .retirer:hover { color: var(--occupe); }
  .carte .machine {
    font-size: .72rem; color: var(--texte-faible); border: 1px solid var(--trait);
    border-radius: 999px; padding: 0 .4rem; margin-left: .5rem; vertical-align: 1px;
    font-weight: 400;
  }
</style>
</head>
<body>
<div class="page">
  <div class="tete">
    <div class="marque">
      <img src="/logo.svg" width="34" height="34" alt="">
      <h1>Orange Black Box</h1>
    </div>
    <button type="button" class="bascule-theme" id="bascule">
      <svg class="astre" id="basculeAstre" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="8" cy="8" r="3.4" fill="currentColor"/><g stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 .8v2M8 13.2v2M.8 8h2M13.2 8h2M2.9 2.9l1.4 1.4M11.7 11.7l1.4 1.4M13.1 2.9l-1.4 1.4M4.3 11.7l-1.4 1.4"/></g></svg><span id="basculeTexte">thème clair</span>
    </button>
  </div>
  <p class="sous-titre">
    <span id="portee">Sessions Claude Code ouvertes sur cette machine</span> — <b id="compte">…</b>,
    <span id="releve">en attente du premier relevé</span>.
  </p>

  <div class="machines" id="machines" hidden></div>
  <div class="liste" id="liste"></div>
  <div class="panneau" id="panneau"><div class="detail" id="detail"></div></div>
  <div class="alerte" id="alerte"></div>
</div>

<script>
'use strict';

let etatCourant = { sessions: [] };
// La session ouverte, désignée par MACHINE et identifiant. L'identifiant seul ne suffit
// pas : il n'est unique que sur une machine, et chercher la session par lui seul retrouvait
// l'homonyme local au lieu de la distante — mesuré.
let choisie = null;
const cleDe = (s) => (s.machine || 'local') + '|' + s.sessionId;
// Quelle machine on regarde : `null` = toutes, 'local' = ce poste, sinon le nom d'une
// sonde. Un filtre, pas un sélecteur : par défaut on voit tout, d'un coup.
let machineVue = null;

const elListe = document.getElementById('liste');
const elDetail = document.getElementById('detail');
const elPanneau = document.getElementById('panneau');

// ⚠️ L'ouverture est un état à part de la sélection. Le relevé rafraîchit la page toutes
// les 500 ms : si l'affichage de la fiche se déduisait de `choisie`, une modale fermée se
// rouvrirait d'elle-même au relevé suivant.
let modaleOuverte = false;
// La fiche d'ajout d'une machine occupe le même panneau que la fiche d'une session. Sans
// ce drapeau, le relevé — toutes les 500 ms — la refermerait sous les doigts pendant
// qu'on y tape l'adresse.
let ficheDeMachine = false;
// La dernière session connue, gardée telle quelle : un processus peut mourir pendant
// qu'on lit sa fiche, et une modale qui se vide sous les yeux est plus déroutante qu'une
// fiche figée qui dit que la session s'est terminée.
let derniereConnue = null;

function fermerPanneau() {
  // Échap et le clic au large ferment aussi la fiche d'ajout : c'est le même panneau, et
  // deux façons de fermer selon ce qu'il contient se paieraient en surprises.
  if (ficheDeMachine) { fermerLaFiche(); return; }
  modaleOuverte = false;
  elPanneau.classList.remove('ouvert');
}

elPanneau.addEventListener('click', (e) => { if (e.target === elPanneau) fermerPanneau(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fermerPanneau(); });
const elMachines = document.getElementById('machines');
const elPortee = document.getElementById('portee');
const elCompte = document.getElementById('compte');
const elReleve = document.getElementById('releve');
const elAlerte = document.getElementById('alerte');

/*
 * Le thème. La même clé de stockage que l'écran de session : le choix vaut pour toute
 * l'application, et passer d'un écran à l'autre ne doit pas changer l'éclairage. Cet
 * écran-ci n'a rien à redessiner — tout son dessin est du CSS, qui suit les variables
 * de lui-même.
 */
// Le projet s'appelait « Claude N Works » : on lit l'ancienne clé une dernière fois pour
// ne pas perdre le thème et les voies de ceux qui l'employaient, puis on n'écrit plus que
// la nouvelle.
const CLE_MEMOIRE = 'orange-black-box.reglages.v1';
const CLE_ANCIENNE = 'claude-n-works.reglages.v1';
let themeCourant = document.documentElement.dataset.theme === 'clair' ? 'clair' : 'sombre';

/**
 * Les deux pictogrammes de la bascule, tracés plutôt que tapés : mesuré sur un Chromium
 * sans police de symboles, le croissant « ☾ » sort en carré vide. Un bouton dont l'icône
 * manque est un bouton qu'on ne comprend plus.
 */
function dessinerAstre(svg, soleil) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  const NS = 'http://www.w3.org/2000/svg';
  const mettre = (nom, attrs) => {
    const n = document.createElementNS(NS, nom);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    svg.append(n);
    return n;
  };
  if (soleil) {
    mettre('circle', { cx: 8, cy: 8, r: 3.4, fill: 'currentColor' });
    mettre('path', {
      d: 'M8 .8v2M8 13.2v2M.8 8h2M13.2 8h2M2.9 2.9l1.4 1.4M11.7 11.7l1.4 1.4'
         + 'M13.1 2.9l-1.4 1.4M4.3 11.7l-1.4 1.4',
      stroke: 'currentColor', 'stroke-width': 1.4, 'stroke-linecap': 'round', fill: 'none',
    });
  } else {
    // un croissant : un disque dont on retire un second, décalé
    mettre('path', {
      d: 'M11.2 1.9a6.6 6.6 0 1 0 3 9.6A5.3 5.3 0 0 1 11.2 1.9Z',
      fill: 'currentColor',
    });
  }
}

function appliquerTheme(theme) {
  themeCourant = theme === 'clair' ? 'clair' : 'sombre';
  if (themeCourant === 'clair') document.documentElement.dataset.theme = 'clair';
  else delete document.documentElement.dataset.theme;
  const versLeClair = themeCourant === 'sombre';
  dessinerAstre(document.getElementById('basculeAstre'), versLeClair);
  const bouton = document.getElementById('bascule');
  document.getElementById('basculeTexte').textContent = versLeClair ? 'thème clair' : 'thème sombre';
  bouton.title = versLeClair
    ? 'Passer au thème clair — le choix est retenu pour les deux écrans'
    : 'Revenir au thème sombre — le choix est retenu pour les deux écrans';
  bouton.setAttribute('aria-pressed', themeCourant === 'clair' ? 'true' : 'false');
}

function retenirTheme() {
  let r = {};
  try {
    r = JSON.parse(localStorage.getItem(CLE_MEMOIRE)
      || localStorage.getItem(CLE_ANCIENNE)) || {};
  } catch { r = {}; }
  r.theme = themeCourant;
  // Navigation privée ou stockage plein : on se passe de mémoire et l'écran continue.
  try { localStorage.setItem(CLE_MEMOIRE, JSON.stringify(r)); } catch { /* tant pis */ }
}

appliquerTheme(themeCourant);
document.getElementById('bascule').addEventListener('click', () => {
  appliquerTheme(themeCourant === 'clair' ? 'sombre' : 'clair');
  retenirTheme();
});

function duree(ms) {
  if (!ms || ms < 0) return '—';
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + ' s';
  const m = Math.floor(s / 60);
  if (m < 60) return m + ' min';
  const h = Math.floor(m / 60);
  if (h < 48) return h + ' h ' + (m % 60) + ' min';
  return Math.floor(h / 24) + ' j';
}

function heure(ms) {
  if (!ms) return '—';
  return new Date(ms).toLocaleString('fr-FR');
}

function classeStatut(statut) {
  return statut === 'busy' || statut === 'waiting' ? statut : 'autre';
}

function libelleStatut(s) {
  if (s.statut === 'busy') return 'au travail';
  if (s.statut === 'waiting') return 'attend' + (s.attendQuoi ? ' — ' + s.attendQuoi : '');
  return s.statut || 'statut inconnu';
}

/**
 * La barre des machines — §7.
 *
 * Elle ne paraît que s'il y a des machines à suivre : tant qu'on ne regarde que ce poste,
 * l'écran reste exactement celui d'avant. Chaque onglet filtre la liste ; une machine
 * injoignable se montre quand même, en rouge et avec sa raison, parce que la faire
 * disparaître laisserait croire qu'elle est au repos.
 */
function dessinerLesMachines(toutes) {
  const machines = etatCourant.machines || [];
  const pannes = etatCourant.machinesEnPanne || [];
  // ⚠️ La barre est TOUJOURS montrée, même sans aucune machine. Elle ne l'était pas, et
  // le bouton « + une machine » vivait dedans : on ne pouvait donc jamais ajouter la
  // PREMIÈRE — la fonctionnalité était inatteignable depuis une installation neuve.
  // Sans machine, la barre ne porte que ce bouton : il n'y a rien à filtrer.
  elMachines.hidden = false;
  if (!machines.length) {
    elMachines.replaceChildren(boutonAjouter());
    elPortee.textContent = 'Sessions Claude Code ouvertes sur cette machine';
    return;
  }
  elPortee.textContent = machineVue === null
    ? 'Sessions Claude Code ouvertes sur ' + (machines.length + 1) + ' machines'
    : 'Sessions Claude Code ouvertes sur ' + (machineVue === 'local' ? 'ce poste' : machineVue);
  elMachines.hidden = false;

  const compter = (cle) => toutes.filter((s) => (s.machine || 'local') === cle).length;
  const onglet = (cle, mot, titre, enPanne) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'onglet' + (enPanne ? ' panne' : '');
    b.textContent = mot;
    b.title = titre;
    b.setAttribute('aria-pressed', String(machineVue === cle));
    b.addEventListener('click', () => { machineVue = machineVue === cle ? null : cle; dessiner(); });
    return b;
  };

  const elements = [onglet(null, 'toutes', 'toutes les machines', false)];
  elements.push(onglet('local', 'ce poste  ' + compter('local'), 'les sessions de cette machine', false));
  for (const m of machines) {
    const panne = pannes.find((p) => p.machine === m.nom);
    const groupe = document.createElement('span');
    groupe.style.cssText = 'display:inline-flex;align-items:center;gap:.1rem';
    groupe.append(onglet(m.nom, m.nom + (panne ? '  —' : '  ' + compter(m.nom)),
      panne ? m.url + '\n' + panne.raison : m.url, Boolean(panne)));
    const x = document.createElement('button');
    x.type = 'button';
    x.className = 'retirer';
    x.textContent = '×';
    x.title = 'ne plus suivre « ' + m.nom + ' »';
    x.addEventListener('click', async (e) => {
      e.stopPropagation();
      await fetch('/api/machines', {
        method: 'DELETE', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ nom: m.nom }),
      });
      if (machineVue === m.nom) machineVue = null;
    });
    groupe.append(x);
    elements.push(groupe);
  }

  elements.push(boutonAjouter());
  elMachines.replaceChildren(...elements);
}

function boutonAjouter() {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'ajouter';
  b.textContent = '+ une machine';
  b.title = 'suivre une sonde posée sur une autre machine';
  b.addEventListener('click', ouvrirLaFicheDeMachine);
  return b;
}

/**
 * La fiche d'ajout d'une machine — §7.
 *
 * ⚠️ Un vrai formulaire, et non `prompt()`. Mesuré : dans la coquille Electron,
 * `window.prompt` LÈVE — « prompt() is not supported » — et le bouton ne faisait donc
 * rien du tout dans l'application empaquetée, celle que presque tout le monde emploie.
 * La version navigateur, elle, marchait : vérifier dans le navigateur seul ne pouvait pas
 * le voir.
 *
 * La fiche réutilise le panneau des sessions : même voile, même fiche, même Échap.
 */
function ouvrirLaFicheDeMachine() {
  const champ = (id, etiquette, exemple, type) => {
    const l = document.createElement('label');
    l.style.cssText = 'display:block;margin:.8rem 0 0;font-size:.86rem;color:var(--texte-faible)';
    l.textContent = etiquette;
    const i = document.createElement('input');
    i.id = id;
    i.type = type || 'text';
    i.placeholder = exemple;
    i.autocomplete = 'off';
    i.spellcheck = false;
    i.style.cssText = 'display:block;width:100%;margin-top:.3rem;padding:.45rem .6rem;'
      + 'background:var(--fond);border:1px solid var(--trait);border-radius:7px;'
      + 'color:var(--texte);font:inherit;font-size:.9rem';
    l.append(i);
    return l;
  };

  elDetail.replaceChildren();
  const fermer = document.createElement('button');
  fermer.className = 'fermer';
  fermer.textContent = '×';
  fermer.addEventListener('click', fermerLaFiche);
  const titre = document.createElement('h2');
  titre.textContent = 'Suivre une autre machine';
  const aide = document.createElement('p');
  aide.style.cssText = 'color:var(--texte-faible);font-size:.86rem;margin:.2rem 0 0';
  aide.textContent = 'Sur la machine à observer, lancez la sonde : elle affiche son '
    + 'adresse et son jeton. Reportez-les ici.';
  const commande = document.createElement('pre');
  commande.style.cssText = 'background:var(--fond);border:1px solid var(--trait);'
    + 'border-radius:7px;padding:.5rem .7rem;margin:.6rem 0 0;font-size:.8rem;'
    + 'overflow:auto;font-family:ui-monospace,Menlo,Consolas,monospace';
  commande.textContent = 'curl -LO https://github.com/YvesThenElse/OBB/'
    + 'releases/latest/download/obb-sonde.js\nHOTES=127.0.0.1,tailscale node obb-sonde.js';

  const cUrl = champ('m-url', 'Adresse de la sonde', 'http://build-01:7420', 'url');
  const cNom = champ('m-nom', 'Nom à l’écran', 'build-01');
  const cJeton = champ('m-jeton', 'Jeton', '32 caractères, affiché par la sonde');

  const erreur = document.createElement('p');
  erreur.style.cssText = 'color:var(--occupe);font-size:.86rem;margin:.8rem 0 0;min-height:1.2em';

  const barre = document.createElement('div');
  barre.style.cssText = 'display:flex;gap:.5rem;justify-content:flex-end;margin-top:1rem';
  const annuler = document.createElement('button');
  annuler.type = 'button';
  annuler.className = 'ajouter';
  annuler.textContent = 'annuler';
  annuler.addEventListener('click', fermerLaFiche);
  const valider = document.createElement('button');
  valider.type = 'button';
  valider.className = 'onglet';
  valider.setAttribute('aria-pressed', 'true');
  valider.textContent = 'suivre cette machine';
  barre.append(annuler, valider);

  // Le nom se devine de l'adresse tant qu'on ne l'a pas touché : une friction de moins.
  let nomTouche = false;
  cNom.querySelector('input').addEventListener('input', () => { nomTouche = true; });
  cUrl.querySelector('input').addEventListener('input', (e) => {
    if (nomTouche) return;
    try {
      const h = new URL(e.target.value).hostname;
      // On ne devine que d'un vrai nom d'hôte : d'une adresse IP, « 127 » serait un nom
      // pire que pas de nom du tout.
      cNom.querySelector('input').value = /^[\d.:[\]]+$/.test(h) ? '' : h.split('.')[0];
    } catch { /* adresse encore incomplète */ }
  });

  const envoyer = async () => {
    const nom = cNom.querySelector('input').value.trim();
    const url = cUrl.querySelector('input').value.trim();
    const jeton = cJeton.querySelector('input').value.trim();
    if (!url || !nom) { erreur.textContent = 'Il faut au moins une adresse et un nom.'; return; }
    valider.disabled = true;
    erreur.textContent = 'on éprouve la sonde…';
    try {
      const r = await fetch('/api/machines', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ nom, url, jeton }),
      });
      const d = await r.json();
      if (d.erreur) { erreur.textContent = d.erreur; valider.disabled = false; return; }
      fermerLaFiche();
    } catch (e) {
      erreur.textContent = 'le serveur local n’a pas répondu : ' + e.message;
      valider.disabled = false;
    }
  };
  valider.addEventListener('click', envoyer);
  for (const c of [cUrl, cNom, cJeton]) {
    c.querySelector('input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); envoyer(); }
    });
  }

  elDetail.append(fermer, titre, aide, commande, cUrl, cNom, cJeton, erreur, barre);
  ficheDeMachine = true;
  elPanneau.classList.add('ouvert');
  cUrl.querySelector('input').focus();
}

function fermerLaFiche() {
  ficheDeMachine = false;
  elPanneau.classList.remove('ouvert');
  elDetail.replaceChildren();
  dessiner();
}

function dessinerListe() {
  const toutes = etatCourant.sessions || [];
  const sessions = machineVue === null ? toutes
    : toutes.filter((s) => (s.machine || 'local') === machineVue);
  dessinerLesMachines(toutes);
  elCompte.textContent = sessions.length === 0 ? 'aucune'
    : sessions.length === 1 ? '1 session' : sessions.length + ' sessions';

  if (sessions.length === 0) {
    elListe.innerHTML = '<p class="vide">Aucune session Claude Code ouverte en ce moment.</p>';
    return;
  }

  elListe.replaceChildren(...sessions.map((s) => {
    const carte = document.createElement('div');
    carte.className = 'carte';
    carte.setAttribute('role', 'button');
    carte.setAttribute('tabindex', '0');
    carte.setAttribute('aria-selected', String(cleDe(s) === choisie));

    const cl = classeStatut(s.statut);
    const pastille = document.createElement('span');
    pastille.className = 'pastille ' + cl;
    pastille.title = libelleStatut(s);

    const nom = document.createElement('div');
    nom.className = 'nom';
    nom.textContent = s.nom;
    // D'où vient cette session. `machine: null` veut dire « ce poste » — on ne l'écrit
    // pas : tant qu'aucune machine distante n'est suivie, rien ne doit changer à l'écran.
    if (s.machine) {
      const ou = document.createElement('span');
      ou.className = 'machine';
      ou.textContent = s.machine;
      ou.title = 'cette session tourne sur la machine « ' + s.machine + ' »';
      nom.append(ou);
    }
    if (!s.nomDonne) {
      const devine = document.createElement('span');
      devine.className = 'devine';
      devine.textContent = ' (sans nom — dossier de travail)';
      nom.append(devine);
    }

    const chemin = document.createElement('div');
    chemin.className = 'chemin';
    chemin.textContent = s.cwd || '(dossier inconnu)';

    const droite = document.createElement('div');
    droite.className = 'droite';
    const etat = document.createElement('span');
    etat.className = 'etat ' + cl;
    etat.textContent = libelleStatut(s);
    droite.append(etat, document.createTextNode(
      'ouverte depuis ' + duree(Date.now() - s.demarreeA)
      + (s.sousAgents ? ' · ' + s.sousAgents + ' sous-agent' + (s.sousAgents > 1 ? 's' : '') : '')
    ));

    carte.append(pastille, nom, droite, chemin);
    const choisir = () => {
      choisie = cleDe(s);
      modaleOuverte = true;
      dessiner();
    };
    carte.addEventListener('click', choisir);
    carte.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choisir(); }
    });
    return carte;
  }));
}

function dessinerDetail() {
  if (ficheDeMachine) return;   // on y saisit une machine : on ne touche à rien
  if (!modaleOuverte) { elPanneau.classList.remove('ouvert'); return; }
  const vivante = (etatCourant.sessions || []).find((x) => cleDe(x) === choisie);
  if (vivante) derniereConnue = vivante;
  const s = vivante || derniereConnue;
  if (!s) { fermerPanneau(); return; }

  const champs = [
    ['Identifiant de session', s.sessionId],
    ['Processus', String(s.pid)],
    ['Dossier de travail', s.cwd || '—'],
    ['État', libelleStatut(s)],
    ['Ouverte depuis', duree(Date.now() - s.demarreeA) + '  (' + heure(s.demarreeA) + ')'],
    ['Vue pour la dernière fois', heure(s.vueA)],
    ['Version de Claude Code', s.version || '—'],
    ['Genre', [s.genre, s.pointEntree].filter(Boolean).join(' / ') || '—'],
    ['Fenêtre tmux', s.tmux || '—'],
    ['Transcript', s.transcript || 'introuvable'],
    ['Sous-agents sur disque', s.sousAgents === null ? '—' : String(s.sousAgents)],
  ];

  const dl = document.createElement('dl');
  for (const [cle, valeur] of champs) {
    const dt = document.createElement('dt'); dt.textContent = cle;
    const dd = document.createElement('dd'); dd.textContent = valeur;
    dl.append(dt, dd);
  }

  const fermer = document.createElement('button');
  fermer.type = 'button';
  fermer.className = 'fermer';
  fermer.textContent = '×';
  fermer.title = 'fermer (Échap)';
  fermer.setAttribute('aria-label', 'fermer');
  fermer.addEventListener('click', fermerPanneau);

  const titre = document.createElement('h2');
  titre.textContent = s.nom;
  const suite = document.createElement('p');
  suite.className = 'suite';
  if (s.transcript) {
    const lien = document.createElement('a');
    lien.className = 'bouton';
    // La machine voyage avec l'identifiant : une session distante ne se lit pas ici.
    lien.href = '/session.html?id=' + encodeURIComponent(s.sessionId)
      + (s.machine ? '&machine=' + encodeURIComponent(s.machine) : '');
    lien.append(document.createTextNode('Voir la ligne du temps de ses agents'));
    const fleche = document.createElement('span');
    fleche.className = 'fleche';
    fleche.textContent = '→';
    fleche.setAttribute('aria-hidden', 'true');
    lien.append(fleche);
    suite.append(lien);
  } else {
    suite.textContent = "Le transcript de cette session n'a pas été trouvé sur disque — la ligne du temps ne pourra rien montrer.";
  }
  const morceaux = [fermer, titre, dl, suite];
  if (!vivante) {
    const finie = document.createElement('p');
    finie.className = 'finie';
    finie.textContent = 'Cette session s’est terminée pendant que vous la regardiez. '
      + 'Les champs ci-dessus sont ceux du dernier relevé ; son transcript, lui, reste '
      + 'lisible en entier.';
    morceaux.push(finie);
  }
  elDetail.replaceChildren(...morceaux);
  elPanneau.classList.add('ouvert');
  elDetail.scrollTop = 0;
}

function dessiner() { dessinerListe(); dessinerDetail(); }

function appliquer(etat) {
  etatCourant = etat;
  elReleve.textContent = 'relevé à ' + new Date(etat.releveA || Date.now())
    .toLocaleTimeString('fr-FR');
  elAlerte.textContent = etat.erreur
    ? etat.erreur
    : (etat.ignorees ? etat.ignorees + ' fichier(s) de session ignoré(s) : illisible, mal formé, ou processus déjà mort.' : '');
  dessiner();
}

const flux = new EventSource('/flux');
flux.addEventListener('message', (e) => {
  try { appliquer(JSON.parse(e.data)); } catch (err) { console.error(err); }
});
flux.addEventListener('error', () => {
  elReleve.textContent = 'flux interrompu — reconnexion…';
});

// Les durées « ouverte depuis » vieillissent même quand rien ne bouge côté serveur.
setInterval(dessiner, 10000);
</script>
</body>
</html>
