<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude N Works — ligne du temps</title>
<style>
  :root {
    --fond: #11131a; --fond-carte: #1a1d27; --trait: #2b3040;
    --texte: #e4e6ee; --texte-faible: #8d93a8;
    --accent: #7aa2f7;
    --en-cours: #7aa2f7; --termine: #4a5170; --interrompu: #f7768e; --inconnu: #e0af68;
    --outil: #9ece6a; --outil-echec: #f7768e; --outil-agent: #bb9af7;
    --requete: #e0af68;
    --boucle: #2ac3de;
    --compact: #bb9af7;
    --panne: #f7768e;
    --attente: #565f89;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fond); color: var(--texte);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  header { padding: 1.2rem 1.5rem .9rem; border-bottom: 1px solid var(--trait); }
  header a { color: var(--texte-faible); text-decoration: none; font-size: .82rem; }
  header a:hover { color: var(--accent); }
  h1 { font-size: 1.15rem; margin: .4rem 0 .35rem; font-weight: 600; }
  .resume { color: var(--texte-faible); font-size: .83rem; }
  .resume b { color: var(--texte); font-weight: 600; }

  .reglages {
    display: flex; gap: 1.2rem; align-items: center; flex-wrap: wrap;
    padding: .7rem 1.5rem; border-bottom: 1px solid var(--trait);
    font-size: .8rem; color: var(--texte-faible);
  }
  .reglages label { display: flex; gap: .45rem; align-items: center; }
  input[type=range] { width: 11rem; accent-color: var(--accent); }
  .legende { display: flex; gap: .9rem; flex-wrap: wrap; margin-left: auto; }
  .legende span { display: flex; gap: .3rem; align-items: center; }
  .puce { width: .7rem; height: .7rem; border-radius: 2px; display: inline-block; }

  .cadre { display: grid; grid-template-columns: 19rem 1fr; height: calc(100vh - 11rem); }
  .arbre { border-right: 1px solid var(--trait); overflow: hidden; padding-top: 3.4rem; }
  .noeud {
    height: 2.2rem; display: flex; align-items: center; gap: .4rem;
    padding: 0 .7rem; cursor: pointer; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; font-size: .82rem;
  }
  .noeud:hover, .noeud.vise { background: var(--fond-carte); }
  .noeud .tiret { color: var(--trait); font-family: monospace; }
  .noeud .etiq { overflow: hidden; text-overflow: ellipsis; }
  .noeud .etat { margin-left: auto; font-size: .72rem; color: var(--texte-faible); }

  .piste { overflow: auto; position: relative; cursor: grab; overscroll-behavior-x: contain; }
  .piste:active { cursor: grabbing; }
  svg { display: block; }
  .vise-barre { outline: 1px solid var(--accent); }
  .message { padding: 3rem 1.5rem; color: var(--texte-faible); }

  /* Le panneau des cartes : il recouvre la droite de la piste sans la faire bouger. */
  .panneau {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(31rem, 94vw);
    background: var(--fond-carte); border-left: 1px solid var(--trait);
    box-shadow: -14px 0 34px #0008; overflow-y: auto; padding: 1.2rem 1.3rem 3rem;
    display: none;
  }
  .panneau.ouvert { display: block; }
  .panneau .fermer {
    float: right; background: none; border: 0; color: var(--texte-faible);
    font-size: 1.3rem; cursor: pointer; line-height: 1; padding: 0 .2rem;
  }
  .panneau .fermer:hover { color: var(--texte); }
  .panneau .genre {
    font-size: .7rem; text-transform: uppercase; letter-spacing: .09em;
    color: var(--texte-faible);
  }
  .panneau h2 { font-size: 1.05rem; margin: .25rem 0 .9rem; font-weight: 600; }
  .panneau dl {
    display: grid; grid-template-columns: max-content 1fr; gap: .35rem 1rem;
    margin: 0 0 1rem; font-size: .82rem;
  }
  .panneau dt { color: var(--texte-faible); }
  .panneau dd { margin: 0; overflow-wrap: anywhere; }
  .panneau dd code { font-family: ui-monospace, Menlo, monospace; font-size: .95em; }
  .bloc { margin-top: 1rem; }
  .bloc > summary {
    cursor: pointer; font-size: .78rem; color: var(--texte-faible);
    text-transform: uppercase; letter-spacing: .07em; padding: .25rem 0;
  }
  .bloc > summary:hover { color: var(--texte); }
  .bloc pre {
    margin: .45rem 0 0; padding: .7rem .8rem; background: var(--fond);
    border: 1px solid var(--trait); border-radius: 6px;
    font: 12px/1.5 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; overflow-wrap: anywhere; max-height: 24rem; overflow: auto;
  }
  /* La jauge du cache : rouge quand tout est relu au prix fort, vert quand presque tout
     vient du cache. Le curseur se place sur la part réellement servie par le cache. */
  .jauge { margin: .5rem 0 .2rem; }
  .jauge .piste-jauge {
    position: relative; height: 10px; border-radius: 5px;
    background: linear-gradient(to right, #f7768e 0%, #e0af68 55%, #9ece6a 85%, #73d393 100%);
  }
  .jauge .curseur {
    position: absolute; top: -3px; width: 3px; height: 16px; border-radius: 2px;
    background: var(--texte); box-shadow: 0 0 0 1.5px var(--fond-carte);
    transform: translateX(-50%);
  }
  .jauge .graduations {
    display: flex; justify-content: space-between; margin-top: .2rem;
    font-size: .68rem; color: var(--texte-faible);
  }
  .jauge .valeur { font-size: .82rem; margin-bottom: .1rem; }
  .jauge .valeur b { font-size: 1rem; }

  /* La lecture du contexte : une liste d'éléments dépliables, dans l'ordre. */
  .ctx-liste { margin-top: .8rem; }
  .ctx-element { border-top: 1px solid var(--trait); }
  .ctx-element > summary {
    cursor: pointer; padding: .3rem .1rem; font-size: .78rem; display: flex;
    gap: .5rem; align-items: baseline;
  }
  .ctx-element > summary:hover { background: var(--fond); }
  .ctx-element .marque { width: .5rem; height: .5rem; border-radius: 2px; flex: none; }
  .ctx-element .quoi { color: var(--texte); }
  .ctx-element .quand { color: var(--texte-faible); font-size: .72rem; }
  .ctx-element .taille { margin-left: auto; color: var(--texte-faible); font-size: .72rem; }
  .ctx-element pre {
    margin: .2rem 0 .5rem; padding: .55rem .7rem; background: var(--fond);
    border: 1px solid var(--trait); border-radius: 6px;
    font: 12px/1.5 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; overflow-wrap: anywhere; max-height: 22rem; overflow: auto;
  }
  .ctx-filtres { display: flex; flex-wrap: wrap; gap: .3rem; margin: .6rem 0 .2rem; }
  .ctx-filtres button {
    background: var(--fond); border: 1px solid var(--trait); color: var(--texte);
    border-radius: 999px; padding: .1rem .55rem; font-size: .74rem; cursor: pointer;
    font-family: inherit;
  }
  .ctx-filtres button[aria-pressed="false"] { opacity: .4; }

  .avert {
    margin-top: .6rem; font-size: .76rem; color: var(--inconnu); font-style: italic;
  }
  .bande { display: flex; flex-wrap: wrap; gap: 3px; margin: .5rem 0 .2rem; }
  .bande i {
    width: 15px; height: 22px; border-radius: 2px; cursor: pointer;
    background: var(--outil); position: relative;
  }
  .bande i.rien { background: var(--trait); }
  .bande i.arret { background: var(--boucle); }
  .bande i.vise { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* Une pastille en haut à droite : cette itération a lancé des agents. */
  .bande i.enfante::after {
    content: ''; position: absolute; top: -3px; right: -3px;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--outil-agent); border: 1px solid var(--fond);
  }
  .nes { margin-top: .45rem; display: flex; flex-wrap: wrap; gap: .3rem; }
  .nes button {
    background: var(--fond-carte); border: 1px solid var(--outil-agent); color: var(--texte);
    border-radius: 999px; padding: .1rem .55rem; font-size: .74rem; cursor: pointer;
    font-family: inherit;
  }
  .nes button:hover { background: var(--outil-agent); color: #11131a; }
  .lien-boucle {
    background: none; border: 0; padding: 0; color: var(--boucle); cursor: pointer;
    font: inherit; text-align: left; text-decoration: underline;
  }
  .bande i:hover { filter: brightness(1.4); }
  .iteration {
    margin-top: .7rem; padding: .6rem .75rem; background: var(--fond);
    border: 1px solid var(--trait); border-radius: 6px; font-size: .82rem;
  }
  .iteration .quand { color: var(--texte-faible); font-size: .76rem; }
  .boutons-boucles { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .3rem; }
  .boutons-boucles button {
    background: var(--fond); border: 1px solid var(--trait); color: var(--texte);
    border-radius: 999px; padding: .12rem .6rem; font-size: .74rem; cursor: pointer;
    font-family: inherit;
  }
  .boutons-boucles button:hover { border-color: var(--accent); color: var(--accent); }
  #choixBoucle {
    background: var(--fond-carte); color: var(--texte); border: 1px solid var(--trait);
    border-radius: 6px; padding: .15rem .4rem; font: inherit; font-size: .78rem;
    max-width: 24rem;
  }
  #choixBoucle:hover { border-color: var(--boucle); }

  /* Le choix des voies à montrer : une liste déroulante de cases à cocher. */
  .menu-voies { position: relative; }
  .menu-voies > summary {
    cursor: pointer; list-style: none; user-select: none;
    background: var(--fond-carte); border: 1px solid var(--trait); border-radius: 6px;
    padding: .15rem .55rem; font-size: .78rem; color: var(--texte);
  }
  .menu-voies > summary::-webkit-details-marker { display: none; }
  .menu-voies > summary::after { content: ' \25BE'; color: var(--texte-faible); }
  .menu-voies > summary:hover,
  .menu-voies[open] > summary { border-color: var(--accent); }
  .menu-voies .menu {
    position: absolute; z-index: 20; top: calc(100% + .3rem); left: 0;
    background: var(--fond-carte); border: 1px solid var(--trait); border-radius: 8px;
    padding: .45rem .5rem; box-shadow: 0 10px 26px #0009; min-width: 13rem;
  }
  .menu-voies .menu label {
    display: flex; gap: .45rem; align-items: center; padding: .18rem .2rem;
    border-radius: 5px; cursor: pointer; font-size: .8rem; color: var(--texte);
  }
  .menu-voies .menu label:hover { background: var(--fond); }
  .menu-voies .menu .compte { margin-left: auto; color: var(--texte-faible); font-size: .74rem; }
  .menu-voies .menu .puce { width: .6rem; height: .6rem; border-radius: 2px; }
  .puces-outils { display: flex; flex-wrap: wrap; gap: .3rem; margin: .2rem 0 0; }
  .puces-outils span {
    background: var(--fond); border: 1px solid var(--trait); border-radius: 999px;
    padding: .1rem .55rem; font-size: .74rem;
  }
</style>
</head>
<body>
<header>
  <a href="/">← toutes les sessions</a>
  <h1 id="titre">…</h1>
  <div class="resume" id="resume"></div>
  <div class="resume"><span id="vivante" style="color:var(--en-cours)"></span></div>
</header>

<div class="reglages">
  <label>échelle
    <input type="range" id="zoom" min="0" max="100" value="0">
    <span id="zoomTexte"></span>
  </label>
  <label><input type="checkbox" id="replier" checked> replier les temps morts</label>
  <details class="menu-voies" id="menuVoies">
    <summary id="resumeVoies">voies</summary>
    <div class="menu" id="listeVoies"></div>
  </details>
  <span id="replis"></span>
  <label id="boucles" style="display:none;gap:.45rem;align-items:center">
    <span id="bouclesTitre"></span>
    <select id="choixBoucle"></select>
  </label>
  <div class="legende">
    <span><i class="puce" style="background:var(--en-cours)"></i>en cours</span>
    <span><i class="puce" style="background:var(--termine)"></i>terminé</span>
    <span><i class="puce" style="background:var(--interrompu)"></i>interrompu</span>
    <span><i class="puce" style="background:var(--inconnu)"></i>fin inconnue</span>
    <span><i class="puce" style="background:var(--outil)"></i>outil</span>
    <span><i class="puce" style="background:var(--outil-agent)"></i>appel d'agent</span>
    <span><i class="puce" style="background:var(--requete)"></i>requête</span>
    <span><i class="puce" style="background:var(--boucle);border-radius:50%"></i>boucle</span>
    <span><i class="puce" style="background:var(--compact)"></i>compactage</span>
    <span><i class="puce" style="background:var(--panne);border-radius:50%"></i>panne</span>
    <span><i class="puce" style="background:var(--requete)"></i>question posée</span>
    <span><i class="puce" style="background:var(--attente)"></i>inoccupée</span>
  </div>
</div>

<div class="cadre">
  <div class="arbre" id="arbre"></div>
  <div class="piste" id="piste"><p class="message">Lecture du transcript…</p></div>
</div>

<aside class="panneau" id="panneau" aria-live="polite"></aside>

<script>
'use strict';

const SVGNS = 'http://www.w3.org/2000/svg';
const HAUTEUR_VOIE = 35.2;   // doit valoir la hauteur d'un nœud de l'arbre (2.2rem)
const MARGE_HAUT = 54.4;    // doit valoir le padding-top de l'arbre (3.4rem)
const REGLE_BAS = 24;      // la ligne de base de la règle du temps
const HAUTEUR_BARRE = 15;     // la barre de l'agent
const HAUTEUR_DUREE = 10;     // la bande de durée d'un appel d'outil, sous la barre
const LARGEUR_PRISE_MIN = 10; // un appel bref doit rester visable à la souris
const LARGEUR_VIDE = 22;     // largeur donnée à un temps mort replié
const LARGEUR_MAX = 16000000; // largeur maximale du dessin, bien sous l'écrêtage à 33,5 M
// À fond de zoom, une règle dessinée sur toute la largeur produit 140 000 traits et
// 70 000 étiquettes, soit deux secondes par redessin — inutilisable à la molette. On ne
// dessine donc que la fenêtre visible, élargie d'une marge pour que le défilement doux ne
// révèle pas de vide, et on redessine quand on s'est assez éloigné.
const MARGE_RENDU = 2500;
const SEUIL_VIDE_MIN_MS = 60000; // on ne replie jamais un trou de moins d'une minute
const PART_VIDE = 400;      // ni un trou de moins d'un quatre-centième de la session

let deroule = null;
let vise = null;
let axeCourant = null;
let rendu = null;   // ce qui a été dessiné, pour savoir quand il faut recommencer

const elTitre = document.getElementById('titre');
const elResume = document.getElementById('resume');
const elArbre = document.getElementById('arbre');
const elPiste = document.getElementById('piste');
const elZoom = document.getElementById('zoom');
const elZoomTexte = document.getElementById('zoomTexte');
const elReplier = document.getElementById('replier');
const elVivante = document.getElementById('vivante');
const elMenuVoies = document.getElementById('menuVoies');
const elResumeVoies = document.getElementById('resumeVoies');
const elListeVoies = document.getElementById('listeVoies');

// Quelles voies annexes sont montrées. Les agents, eux, sont toujours là : ce sont eux
// qu'on vient voir.
const VOIES_ANNEXES = [
  { cle: 'contexte', nom: 'Taille CTX', teinte: 'linear-gradient(to top, #9ece6a, #f7768e)' },
  { cle: 'contenu', nom: 'Contenu CTX', teinte: 'linear-gradient(to right, #7aa2f7, #9ece6a)' },
  { cle: 'attente', nom: 'attente', teinte: 'var(--requete)' },
  { cle: 'boucles', nom: 'boucles', teinte: 'var(--boucle)' },
  { cle: 'modele', nom: 'appels au modèle', teinte: '#d6a4ff' },
];
const voiesVisibles = {
  contexte: true, contenu: true, attente: true, boucles: true, modele: true,
};

// De quoi le contexte est fait. L'ordre est celui de l'empilement, du bas vers le haut.
const PARTS_CONTENU = [
  { cle: 'systeme', nom: 'invite système, rappels, skills', teinte: '#565f89' },
  { cle: 'outilSortie', nom: 'résultats d’outils', teinte: '#9ece6a' },
  { cle: 'outilEntree', nom: 'appels d’outils', teinte: '#7aa2f7' },
  { cle: 'modele', nom: 'paroles du modèle', teinte: '#d6a4ff' },
  { cle: 'humain', nom: 'requêtes d’Yves', teinte: '#e0af68' },
];
const totalComposition = (c) => PARTS_CONTENU.reduce((n, p) => n + (c?.[p.cle] || 0), 0);

// Une teinte par modèle. Volontairement distincte des couleurs déjà employées ailleurs :
// la voie d'un modèle ne doit pas se confondre avec un état d'agent ou une attente.
const TEINTES_MODELE = {
  'claude-opus-5': '#d6a4ff',
  'claude-sonnet-5': '#6ee7d5',
  'claude-haiku-4-5': '#ffd479',
};
const TEINTE_MODELE_AUTRE = '#9aa5ce';
const teinteModele = (m) => TEINTES_MODELE[m] || TEINTE_MODELE_AUTRE;

/** Les modèles qu'un agent a réellement appelés, dans l'ordre de première apparition. */
function modelesDe(agent) {
  const vus = [];
  for (const r of agent.requetesModele || []) if (!vus.includes(r.modele)) vus.push(r.modele);
  return vus;
}
const elReplis = document.getElementById('replis');
const elBoucles = document.getElementById('boucles');
const elBouclesTitre = document.getElementById('bouclesTitre');
const elChoixBoucle = document.getElementById('choixBoucle');
let boucleVisee = null;      // la boucle mise en évidence sur la ligne du temps
let iterationVisee = null;   // et, dans cette boucle, le tour choisi : {boucle, rang}

function duree(ms) {
  if (ms === null || ms === undefined) return '—';
  if (ms < 1000) return ms + ' ms';
  const s = ms / 1000;
  if (s < 90) return s.toFixed(1) + ' s';
  const m = s / 60;
  if (m < 90) return m.toFixed(0) + ' min';
  const h = m / 60;
  if (h < 48) return h.toFixed(1) + ' h';
  return (h / 24).toFixed(1) + ' j';
}
const heure = (ms) => new Date(ms).toLocaleString('fr-FR');

/**
 * L'axe du temps. Une session peut s'étaler sur onze jours tout en ne travaillant que par
 * courtes bouffées : à l'échelle linéaire, tout se tasse en traits invisibles. On découpe
 * donc le temps en segments actifs, à l'échelle, séparés par des temps morts repliés à
 * largeur fixe — et marqués comme tels, pour que rien ne disparaisse en silence.
 */
function seuilVide(debut, fin) {
  // Replier un trou d'une minute a du sens sur une session d'un quart d'heure, aucun sur
  // une session de onze jours : le seuil suit la durée totale.
  return Math.max(SEUIL_VIDE_MIN_MS, (fin - debut) / PART_VIDE);
}

function construireAxe(instants, debut, fin, pxParMs, replier) {
  if (!replier) {
    const total = Math.max(1, (fin - debut) * pxParMs);
    return {
      largeur: total,
      segments: [{ t0: debut, t1: fin, x0: 0, x1: total, vide: false }],
      x: (t) => (t - debut) * pxParMs,
      // L'inverse doit exister ici aussi : le zoom à la molette s'en sert pour retenir
      // l'instant sous le curseur, et son absence faisait échouer tout le geste.
      t: (px) => debut + px / pxParMs,
      replies: 0,
      elide: 0,
    };
  }
  const seuil = seuilVide(debut, fin);
  const tries = [...new Set(instants)].sort((a, b) => a - b);
  const segments = [];
  let x = 0;
  let t0 = debut;
  let precedent = debut;
  let replies = 0;
  let elide = 0;
  for (const t of tries) {
    if (t - precedent > seuil) {
      replies += 1;
      elide += t - precedent;
      const largeur = (precedent - t0) * pxParMs;
      segments.push({ t0, t1: precedent, x0: x, x1: x + largeur, vide: false });
      x += largeur;
      segments.push({ t0: precedent, t1: t, x0: x, x1: x + LARGEUR_VIDE, vide: true });
      x += LARGEUR_VIDE;
      t0 = t;
    }
    precedent = Math.max(precedent, t);
  }
  const largeur = Math.max(1, (Math.max(precedent, fin) - t0) * pxParMs);
  segments.push({ t0, t1: Math.max(precedent, fin), x0: x, x1: x + largeur, vide: false });
  x += largeur;

  function projeter(t) {
    for (const s of segments) {
      if (t <= s.t1) {
        if (t < s.t0) return s.x0;
        if (s.vide) return s.x0 + LARGEUR_VIDE / 2;
        const p = s.t1 === s.t0 ? 0 : (t - s.t0) / (s.t1 - s.t0);
        return s.x0 + p * (s.x1 - s.x0);
      }
    }
    return x;
  }
  /** L'inverse de `projeter` : quel instant se trouve à cette abscisse. */
  function instantA(px) {
    for (const s of segments) {
      if (px > s.x1) continue;
      if (s.vide) return s.t0; // dans un temps mort replié, on rend son bord gauche
      const p = s.x1 === s.x0 ? 0 : (px - s.x0) / (s.x1 - s.x0);
      return s.t0 + p * (s.t1 - s.t0);
    }
    const fin = segments[segments.length - 1];
    return fin ? fin.t1 : debut;
  }

  return { largeur: x, segments, x: projeter, t: instantA, replies, elide };
}

/** Le temps réellement occupé, trous repliés exclus : sert à calculer l'échelle juste. */
function tempsActif(instants, debut, fin) {
  const seuil = seuilVide(debut, fin);
  const tries = [...new Set(instants)].sort((a, b) => a - b);
  let actif = fin - debut;
  let n = 0;
  let precedent = debut;
  for (const t of tries) {
    if (t - precedent > seuil) { actif -= t - precedent; n += 1; }
    precedent = Math.max(precedent, t);
  }
  return { actif: Math.max(1, actif), n };
}

function tousLesInstants(d) {
  const ts = [];
  for (const a of d.agents) {
    if (a.debut !== null) ts.push(a.debut);
    if (a.fin !== null) ts.push(a.fin);
    for (const o of a.outils) {
      if (o.debut !== null) ts.push(o.debut);
      if (o.fin !== null) ts.push(o.fin);
    }
  }
  for (const r of d.requetes) if (r.instant !== null) ts.push(r.instant);
  return ts;
}

function couleurEtat(etat) {
  return etat === 'en cours' ? 'var(--en-cours)'
    : etat === 'interrompu' ? 'var(--interrompu)'
    : etat === 'fin inconnue' ? 'var(--inconnu)'
    : 'var(--termine)';
}

function el(nom, attrs, ...enfants) {
  const n = document.createElementNS(SVGNS, nom);
  for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
  for (const e of enfants) n.append(e);
  return n;
}

/**
 * Les voies de la piste : une par agent, et sous chaque agent qui en mène, une voie à part
 * pour ses boucles. Une boucle n'est pas un agent — elle n'a ni modèle ni outils — mais
 * elle occupe du temps, et c'est à ce titre qu'elle mérite sa propre ligne.
 */
/**
 * La référence de la voie de contexte, et ce qu'elle vaut.
 *
 * On ne connaît la fenêtre réelle que si la session a compacté : le niveau atteint juste
 * avant un compactage **est** la fenêtre, puisque c'est lui qui l'a déclenché. Sans
 * compactage, on ignore tout du plafond — une session qui plafonne à 47 k jetons sur une
 * fenêtre d'un million n'est pas pleine du tout. Dans ce cas on ne prétend pas mesurer un
 * remplissage : l'échelle reste relative et la couleur neutre.
 */
function refContexte() {
  let pic = 1;
  let compacte = false;
  for (const a of deroule.agents) {
    for (const c of a.contexte || []) if (c.jetons > pic) pic = c.jetons;
    if ((a.compactages || []).length) compacte = true;
  }
  return { pic, fenetreConnue: compacte };
}

function construireVoies() {
  const voies = [];
  for (const a of deroule.agents) {
    voies.push({ genre: 'agent', agent: a });
    if (voiesVisibles.contexte && (a.contexte || []).length > 1) {
      voies.push({ genre: 'contexte', agent: a });
    }
    if (voiesVisibles.contenu && (a.requetesModele || []).length > 1) {
      voies.push({ genre: 'contenu', agent: a });
    }
    if (voiesVisibles.attente && (a.attentes || []).length) {
      voies.push({ genre: 'attente', agent: a });
    }
    if (voiesVisibles.boucles && (a.boucles || []).length) {
      voies.push({ genre: 'boucles', agent: a });
    }
    // Une voie par modèle réellement appelé : un agent peut en employer plusieurs, et les
    // mélanger sur une seule ligne masquerait lequel répond vite.
    if (voiesVisibles.modele) {
      for (const m of modelesDe(a)) voies.push({ genre: 'modele', agent: a, modele: m });
    }
  }
  return voies;
}

// La légende de chaque voie, donnée au survol de sa ligne dans l'arbre. Les couleurs de
// la barre d'outils en haut valent pour toute la piste ; ici on dit ce que chacune signifie

  ].join('\n'),
  boucles: [
    'Chaque boucle est un rail, du début à l’arrêt :',
    '   montant plein   le début, et la fin',
