<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude N Works — ligne du temps</title>
<script>
  /*
   * Le thème est appliqué AVANT le premier affichage, et c'est pour cela que ce script
   * est ici, en tête de document, plutôt qu'avec le reste : une page choisie en clair ne
   * doit jamais paraître sombre le temps d'une image.
   */
  try {
    const r = JSON.parse(localStorage.getItem('claude-n-works.reglages.v1')) || {};
    if (r.theme === 'clair') document.documentElement.dataset.theme = 'clair';
  } catch { /* stockage refusé : on reste au thème sombre, et l'écran fonctionne */ }
</script>
<style>
  /*
   * La palette, en entier et en un seul endroit.
   *
   * Tout ce que l'écran dessine passe par ces variables — y compris le SVG, dont les
   * attributs de présentation acceptent `var(…)`. C'est ce qui permet au thème de
   * basculer **sans redessiner** : seules les échelles calculées en JS (le Buffer CTX,
   * la jauge de cache) doivent être relues, et `appliquerTheme` s'en charge.
   *
   * Le thème clair n'est pas une inversion du sombre : ce sont les **mêmes familles de
   * teintes**, re-marchées pour un fond clair puis validées. Sur les paires adjacentes,
   * fond #eceef3 : clarté, chroma, vision normale (pire paire ΔE 16,7) et contraste
   * passent tous ; la séparation en déficience de vision est à ΔE 6,8 pour vert↔ambre,
   * dans la bande tolérée parce que la couleur ne porte **jamais** seule l'identité ici
   * — chaque voie est nommée dans l'arbre et chaque marque a son infobulle.
   *
   * ⚠️ Mesuré au passage : la palette **sombre** est moins bonne que ça. Vert et ambre
   * y sont à ΔE 0,8 en deutéranopie et à 11,7 en vision normale, sous le plancher de 15.
   * Elle n'a pas été touchée — c'eût été changer l'identité de l'application sans qu'on
   * l'ait demandé — mais le fait est consigné.
   */
  :root {
    --fond: #11131a; --fond-carte: #1a1d27; --fond-carte-active: #222634;
    --trait: #2b3040;
    --texte: #e4e6ee; --texte-faible: #8d93a8;
    --sur-accent: #11131a;
    --voile: #080a0ecc; --ombre-forte: #000a; --ombre-douce: #0009;
    --surligne: #e0af6855;
    --accent: #7aa2f7;
    --en-cours: #7aa2f7; --termine: #4a5170; --interrompu: #f7768e; --inconnu: #e0af68;
    --outil: #9ece6a; --outil-echec: #f7768e; --outil-agent: #bb9af7;
    --requete: #e0af68;
    --boucle: #2ac3de;
    --compact: #bb9af7;
    --panne: #f7768e;
    --attente: #565f89;
    --tours: #7aa2f7;
    --reflexion: #c4a7ff;
    --outillage: #ffd479;
    --hook: #7dcfff;
    --modele: #d6a4ff;
    --modele-opus: #d6a4ff; --modele-sonnet: #6ee7d5;
    --modele-haiku: #ffd479; --modele-autre: #9aa5ce;
    --ctx-systeme: #565f89; --ctx-outil-sortie: #9ece6a; --ctx-outil-entree: #7aa2f7;
    --ctx-modele: #d6a4ff; --ctx-humain: #e0af68; --ctx-reflexion: #9a7fd0;
    --ctx-resume: #bb9af7;
    --ramp-mauvais: #f7768e; --ramp-moyen: #e0af68; --ramp-bon: #9ece6a;
    --jauge-haut: #73d393;
    /* La console. Volontairement identique dans les deux thèmes : un terminal est sombre,
       et c'est ce qui le fait reconnaître d'un coup d'œil au milieu d'une fiche. */
    --console-fond: #0c0e14; --console-trait: #232838;
    --console-texte: #d7dae3; --console-sortie: #a6adc0;
    --console-invite: #9ece6a; --console-echec: #f7768e;
    /* ⚠️ La bordure, et elle seule, dépend du thème. Mesuré : sur une fiche sombre, la
       console ne rend que 1,15 : 1 contre son fond, et descendre jusqu'au noir pur ne la
       porte qu'à 1,25 — on ne sépare pas deux surfaces sombres par le ton. C'est la
       bordure qui fait la séparation, à 2,05 : 1. */
    --console-bord: #454f66;
  }

  :root[data-theme="clair"] {
    --fond: #eceef3; --fond-carte: #ffffff; --fond-carte-active: #f3f5fa;
    --trait: #c9cedb;
    --texte: #1b1f2e; --texte-faible: #5c6479;
    --sur-accent: #ffffff;
    --voile: #3a425699; --ombre-forte: #2a3a5526; --ombre-douce: #2a3a551f;
    --surligne: #fde68a;
    --accent: #2563c9;
    /* #2563c9 et non #3b82f6 : mesuré, une barre d'agent en cours est peinte à 85 %
       d'opacité, et le bleu plus clair n'y rendait que 2,64:1 contre le fond. Celui-ci
       donne 3,75:1 — et la palette repasse tous les contrôles avec lui. */
    --en-cours: #2563c9; --termine: #7c8396; --interrompu: #db2777; --inconnu: #b45309;
    --outil: #15803d; --outil-echec: #db2777; --outil-agent: #6b21a8;
    --requete: #b45309;
    --boucle: #0891b2;
    --compact: #6b21a8;
    --panne: #db2777;
    /* 3,32:1 contre le fond, là où #8b93a7 ne donnait que 2,65 — le sombre est à 3,00 */
    --attente: #7a8294;
    --tours: #2563c9;
    --reflexion: #8b5cf6;
    --outillage: #a16207;
    --hook: #0369a1;
    --modele: #7c3aed;
    --modele-opus: #7c3aed; --modele-sonnet: #0d9488;
    --modele-haiku: #a16207; --modele-autre: #64748b;
    --ctx-systeme: #7c8396; --ctx-outil-sortie: #15803d; --ctx-outil-entree: #2563c9;
    --ctx-modele: #7c3aed; --ctx-humain: #b45309; --ctx-reflexion: #8b5cf6;
    --ctx-resume: #6b21a8;
    --ramp-mauvais: #db2777; --ramp-moyen: #b45309; --ramp-bon: #15803d;
    --jauge-haut: #16a34a;
    /* inchangées : voir ci-dessus */
    --console-fond: #0c0e14; --console-trait: #232838;
    --console-texte: #d7dae3; --console-sortie: #a6adc0;
    --console-invite: #9ece6a; --console-echec: #f7768e;
    /* sur fond clair la console tranche d'elle-même — 19,3 : 1 contre une fiche blanche */
    --console-bord: #232838;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fond); color: var(--texte);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  header {
    padding: 1.2rem 1.5rem .9rem; border-bottom: 1px solid var(--trait);
    display: grid; grid-template-columns: 1fr auto; align-items: start;
    column-gap: 1rem;
  }
  header > :not(.bascule-theme) { grid-column: 1; }

  /*
   * La bascule de thème. Elle dit **où l'on va**, pas où l'on est : en thème sombre on
   * propose le clair. Un interrupteur qui annonce son état actuel se lit à contresens
   * une fois sur deux.
   */
  .bascule-theme {
    grid-column: 2; grid-row: 1 / span 4; align-self: center;
    display: inline-flex; align-items: center; gap: .4rem;
    background: var(--fond-carte); color: var(--texte-faible);
    border: 1px solid var(--trait); border-radius: 999px;
    padding: .35rem .8rem .35rem .6rem; cursor: pointer;
    font: inherit; font-size: .8rem; white-space: nowrap;
    transition: color .12s, border-color .12s, background .12s;
  }
  .bascule-theme:hover { color: var(--texte); border-color: var(--accent); }
  .bascule-theme:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bascule-theme .astre { font-size: .95rem; line-height: 1; }
  header a { color: var(--texte-faible); text-decoration: none; font-size: .82rem; }
  header a:hover { color: var(--accent); }
  h1 { font-size: 1.15rem; margin: .4rem 0 .35rem; font-weight: 600; }
  .resume { color: var(--texte-faible); font-size: .83rem; }
  .resume b { color: var(--texte); font-weight: 600; }

  .reglages {
    display: flex; gap: 1.2rem; align-items: center; flex-wrap: wrap;
    padding: .7rem 1.5rem; border-bottom: 1px solid var(--trait);
    font-size: .8rem; color: var(--texte-faible);
  }
  .reglages label { display: flex; gap: .45rem; align-items: center; }
  input[type=range] { width: 11rem; accent-color: var(--accent); }
  .legende { display: flex; gap: .9rem; flex-wrap: wrap; margin-left: auto; }
  .legende span { display: flex; gap: .3rem; align-items: center; }
  .puce { width: .7rem; height: .7rem; border-radius: 2px; display: inline-block; }

  .cadre { display: grid; grid-template-columns: 19rem 1fr; height: calc(100vh - 11rem); }
  .arbre { border-right: 1px solid var(--trait); overflow: hidden; padding-top: 3.4rem; }
  .noeud {
    height: 2.2rem; display: flex; align-items: center; gap: .35rem;
    padding: 0 .7rem 0 .35rem; cursor: pointer; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; font-size: .82rem;
  }
  /* L'indentation : un simple espace, avec un filet vertical par niveau. Plus propre
     qu'une suite de caractères monospace, et aligné au pixel. */
  .noeud .indent {
    flex: none; align-self: stretch;
    background-image: repeating-linear-gradient(to right,
      var(--trait) 0, var(--trait) 1px, transparent 1px, transparent 1.15rem);
    background-position: .5rem 0;
  }
  .noeud .chevron {
    flex: none; width: 1.1rem; background: none; border: 0; cursor: pointer;
    color: var(--texte-faible); font-size: .72rem; line-height: 1; padding: 0;
    font-family: inherit;
  }
  .noeud .chevron:hover { color: var(--accent); }
  .noeud .chevron.creux { visibility: hidden; }
  .noeud .caches {
    color: var(--texte-faible); font-size: .72rem; font-style: italic;
  }
  .noeud:hover, .noeud.vise { background: var(--fond-carte); }

  /* Le pictogramme de la voie. Il était dessiné dans la couleur des traits d'arbre, si
     sombre qu'on ne le voyait pas : il porte maintenant la couleur de sa voie. */
  .noeud .icone {
    font-size: 1rem; line-height: 1; flex: none; width: 1.25rem; text-align: center;
  }
  /* Les flèches de rangement, en tête de ligne. Discrètes tant qu'on ne survole pas. */
  .noeud .rangement { display: flex; flex-direction: column; flex: none; }
  /* Chaque flèche doit rester visable : à sept pixels de haut, on la rate une fois sur
     deux. Deux boutons de quatorze tiennent dans la hauteur d'une ligne. */
  .noeud .rangement button {
    background: none; border: 0; color: var(--texte); cursor: pointer;
    height: 14px; line-height: 14px; font-size: .68rem; padding: 0 3px; opacity: .5;
    font-family: inherit; display: flex; align-items: center; justify-content: center;
  }
  .noeud:hover .rangement button { opacity: .9; }
  .noeud .rangement button:hover:not(:disabled) { color: var(--accent); opacity: 1; }
  .noeud .rangement button:disabled { visibility: hidden; }
  .menu .remise {
    margin-top: .3rem; width: 100%; background: none; border: 0;
    border-top: 1px solid var(--trait); color: var(--texte-faible); cursor: pointer;
    font: inherit; font-size: .74rem; text-align: left; padding: .4rem .2rem 0;
  }
  .menu .remise:hover { color: var(--accent); }
  .noeud .etiq { overflow: hidden; text-overflow: ellipsis; }
  .noeud .etat { margin-left: auto; font-size: .72rem; color: var(--texte-faible); }

  .piste { overflow: auto; position: relative; cursor: grab; overscroll-behavior-x: contain; }
  .piste:active { cursor: grabbing; }
  svg { display: block; }
  .vise-barre { outline: 1px solid var(--accent); }
  .message { padding: 3rem 1.5rem; color: var(--texte-faible); }

  /* Les cartes s'ouvrent en modale au milieu de l'écran : la lecture d'un contexte ou
     d'un long résultat demande de la largeur, qu'un tiroir latéral ne donne pas. */
  .panneau {
    position: fixed; inset: 0; z-index: 40;
    background: var(--voile);
    display: none; align-items: center; justify-content: center;
    padding: 2.5vh 2vw;
  }
  .panneau.ouvert { display: flex; }
  .panneau .boite {
    background: var(--fond-carte); border: 1px solid var(--trait); border-radius: 12px;
    box-shadow: 0 22px 60px var(--ombre-forte);
    width: min(62rem, 96vw); max-height: 95vh; overflow-y: auto;
    padding: 1.3rem 1.5rem 2.2rem;
  }
  .panneau .fermer {
    float: right; background: none; border: 0; color: var(--texte-faible);
    font-size: 1.5rem; cursor: pointer; line-height: 1; padding: 0 .2rem;
  }
  .panneau .fermer:hover { color: var(--texte); }
  .panneau .genre {
    font-size: .7rem; text-transform: uppercase; letter-spacing: .09em;
    color: var(--texte-faible);
  }
  .panneau h2 { font-size: 1.05rem; margin: .25rem 0 .9rem; font-weight: 600; }
  .panneau dl {
    display: grid; grid-template-columns: max-content 1fr; gap: .35rem 1.4rem;
    margin: 0 0 1rem; font-size: .84rem;
  }
  .panneau dt { color: var(--texte-faible); }
  .panneau dd { margin: 0; overflow-wrap: anywhere; }
  .panneau dd code { font-family: ui-monospace, Menlo, monospace; font-size: .95em; }
  .bloc { margin-top: 1rem; }
  .bloc > summary {
    cursor: pointer; font-size: .78rem; color: var(--texte-faible);
    text-transform: uppercase; letter-spacing: .07em; padding: .25rem 0;
  }
  .bloc > summary:hover { color: var(--texte); }
  .bloc pre {
    margin: .45rem 0 0; padding: .7rem .8rem; background: var(--fond);
    border: 1px solid var(--trait); border-radius: 6px;
    font: 12px/1.5 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; overflow-wrap: anywhere; max-height: 24rem; overflow: auto;
  }

  /*
   * La console : ce qu'on a tapé et ce que la machine a répondu, rendus comme un
   * terminal. Lire une commande shell et sa sortie dans la couleur d'une fiche demande
   * un effort que la forme peut épargner.
   *
   * ⚠️ Le `<pre>` garde le contenu EXACT — aucune invite n'est insérée dans le texte.
   * L'invite est posée par le cadre, pas par la chaîne : on copie la commande telle
   * qu'elle a été lancée, et le compte de caractères reste vrai.
   */
  .console { border-radius: 8px; overflow: hidden; border: 1px solid var(--console-bord); }
  .console > .bandeau {
    display: flex; align-items: center; gap: .45rem;
    background: var(--console-trait); color: var(--console-sortie);
    padding: .3rem .7rem; font: 11px/1.4 ui-monospace, Menlo, monospace;
    letter-spacing: .04em;
  }
  .console > .bandeau .invite { color: var(--console-invite); font-weight: 700; }
  .console > .bandeau .compte { margin-left: auto; opacity: .75; }
  .console pre {
    margin: 0; border: 0; border-radius: 0;
    background: var(--console-fond); color: var(--console-texte);
    padding: .75rem .85rem;
  }
  .console.sortie pre { color: var(--console-sortie); }
  .console.echec pre { color: var(--console-echec); }
  .console .recherche { background: var(--console-fond); padding: .45rem .5rem 0; margin: 0; }
  .console .recherche input {
    background: var(--console-trait); color: var(--console-texte);
    border-color: var(--console-trait);
  }
  /* La jauge du cache : rouge quand tout est relu au prix fort, vert quand presque tout
     vient du cache. Le curseur se place sur la part réellement servie par le cache. */
  .jauge { margin: .5rem 0 .2rem; }
  .jauge .piste-jauge {
    position: relative; height: 10px; border-radius: 5px;
    background: linear-gradient(to right, var(--ramp-mauvais) 0%, var(--ramp-moyen) 55%, var(--ramp-bon) 85%, var(--jauge-haut) 100%);
  }
  .jauge .curseur {
    position: absolute; top: -3px; width: 3px; height: 16px; border-radius: 2px;
    background: var(--texte); box-shadow: 0 0 0 1.5px var(--fond-carte);
    transform: translateX(-50%);
  }
  .jauge .graduations {
    display: flex; justify-content: space-between; margin-top: .2rem;
    font-size: .68rem; color: var(--texte-faible);
  }
  .jauge .valeur { font-size: .82rem; margin-bottom: .1rem; }
  .jauge .valeur b { font-size: 1rem; }

  /* La lecture du contexte : une liste d'éléments dépliables, dans l'ordre. */
  .ctx-liste { margin-top: .8rem; }
  .ctx-element { border-top: 1px solid var(--trait); }
  .ctx-element > summary {
    cursor: pointer; padding: .3rem .1rem; font-size: .78rem; display: flex;
    gap: .5rem; align-items: baseline;
  }
  .ctx-element > summary:hover { background: var(--fond); }
  .ctx-element .marque { width: .5rem; height: .5rem; border-radius: 2px; flex: none; }
  .ctx-element .quoi { color: var(--texte); }
  .ctx-element .quand { color: var(--texte-faible); font-size: .72rem; }
  .ctx-element .taille { margin-left: auto; color: var(--texte-faible); font-size: .72rem; }
  .ctx-element pre {
    margin: .2rem 0 .5rem; padding: .55rem .7rem; background: var(--fond);
    border: 1px solid var(--trait); border-radius: 6px;
    font: 12px/1.5 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; overflow-wrap: anywhere; max-height: 22rem; overflow: auto;
  }
  .ctx-filtres { display: flex; flex-wrap: wrap; gap: .3rem; margin: .6rem 0 .2rem; }
  .ctx-filtres button {
    background: var(--fond); border: 1px solid var(--trait); color: var(--texte);
    border-radius: 999px; padding: .1rem .55rem; font-size: .74rem; cursor: pointer;
    font-family: inherit;
  }
  .ctx-filtres button[aria-pressed="false"] { opacity: .4; }

  /* La recherche dans un bloc de texte. */
  .recherche { display: flex; gap: .4rem; align-items: center; margin: .45rem 0 .1rem; }
  .recherche input {
    flex: 1; min-width: 6rem; background: var(--fond); color: var(--texte);
    border: 1px solid var(--trait); border-radius: 6px; padding: .2rem .5rem;
    font: inherit; font-size: .8rem;
  }
  .recherche input:focus { outline: none; border-color: var(--accent); }
  .recherche button {
    background: var(--fond); border: 1px solid var(--trait); color: var(--texte);
    border-radius: 6px; padding: .15rem .5rem; font: inherit; font-size: .78rem;
    cursor: pointer;
  }
  .recherche button:hover:not(:disabled) { border-color: var(--accent); }
  .recherche button:disabled { opacity: .35; cursor: default; }
  .recherche .compte { font-size: .75rem; color: var(--texte-faible); min-width: 6rem; }
  mark { background: var(--surligne); color: var(--texte); border-radius: 2px; padding: 0 1px; }
  mark.vise { background: var(--requete); color: var(--sur-accent); }

  /* La pastille d'une requête grossit au survol : une cible qui se montre est une cible
     qu'on vise. L'anneau pâle la détache d'une piste chargée. */
  .pastille-requete { transition: r .09s ease-out; }
  .repere-requete:hover .pastille-requete { r: 7.5; }
  .repere-requete:hover line:first-of-type { opacity: .9; }

  .avert {
    margin-top: .6rem; font-size: .76rem; color: var(--inconnu); font-style: italic;
  }
  .bande { display: flex; flex-wrap: wrap; gap: 3px; margin: .5rem 0 .2rem; }
  .bande i {
    width: 15px; height: 22px; border-radius: 2px; cursor: pointer;
    background: var(--outil); position: relative;
  }
  .bande i.rien { background: var(--trait); }
  .bande i.arret { background: var(--boucle); }
  .bande i.vise { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* Une pastille en haut à droite : cette itération a lancé des agents. */
  .bande i.enfante::after {
    content: ''; position: absolute; top: -3px; right: -3px;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--outil-agent); border: 1px solid var(--fond);
  }
  .nes { margin-top: .45rem; display: flex; flex-wrap: wrap; gap: .3rem; }
  .nes button {
    background: var(--fond-carte); border: 1px solid var(--outil-agent); color: var(--texte);
    border-radius: 999px; padding: .1rem .55rem; font-size: .74rem; cursor: pointer;
    font-family: inherit;
  }
  .nes button:hover { background: var(--outil-agent); color: var(--sur-accent); }
  .lien-boucle {
    background: none; border: 0; padding: 0; color: var(--boucle); cursor: pointer;
    font: inherit; text-align: left; text-decoration: underline;
  }
  .bande i:hover { filter: brightness(1.4); }
  .iteration {
    margin-top: .7rem; padding: .6rem .75rem; background: var(--fond);
    border: 1px solid var(--trait); border-radius: 6px; font-size: .82rem;
  }
  .iteration .quand { color: var(--texte-faible); font-size: .76rem; }
  .boutons-boucles { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .3rem; }
  .boutons-boucles button {
    background: var(--fond); border: 1px solid var(--trait); color: var(--texte);
    border-radius: 999px; padding: .12rem .6rem; font-size: .74rem; cursor: pointer;
    font-family: inherit;
  }
  .boutons-boucles button:hover { border-color: var(--accent); color: var(--accent); }
  #choixBoucle {
    background: var(--fond-carte); color: var(--texte); border: 1px solid var(--trait);
    border-radius: 6px; padding: .15rem .4rem; font: inherit; font-size: .78rem;
    max-width: 24rem;
  }
  #choixBoucle:hover { border-color: var(--boucle); }

  /* Le choix des voies à montrer : une liste déroulante de cases à cocher. */
  .menu-voies { position: relative; }
  .menu-voies > summary {
    cursor: pointer; list-style: none; user-select: none;
    background: var(--fond-carte); border: 1px solid var(--trait); border-radius: 6px;
    padding: .15rem .55rem; font-size: .78rem; color: var(--texte);
  }
  .menu-voies > summary::-webkit-details-marker { display: none; }
  .menu-voies > summary::after { content: ' \25BE'; color: var(--texte-faible); }
  .menu-voies > summary:hover,
  .menu-voies[open] > summary { border-color: var(--accent); }
  .menu-voies .menu {
    position: absolute; z-index: 20; top: calc(100% + .3rem); left: 0;
    background: var(--fond-carte); border: 1px solid var(--trait); border-radius: 8px;
    padding: .45rem .5rem; box-shadow: 0 10px 26px var(--ombre-douce); min-width: 13rem;
  }
  .menu-voies .menu label {
    display: flex; gap: .45rem; align-items: center; padding: .18rem .2rem;
    border-radius: 5px; cursor: pointer; font-size: .8rem; color: var(--texte);
  }
  .menu-voies .menu label:hover { background: var(--fond); }
  .menu-voies .menu .compte { margin-left: auto; color: var(--texte-faible); font-size: .74rem; }
  .menu-voies .menu .puce { width: .6rem; height: .6rem; border-radius: 2px; }
  .puces-outils { display: flex; flex-wrap: wrap; gap: .3rem; margin: .2rem 0 0; }
  .puces-outils span {
    background: var(--fond); border: 1px solid var(--trait); border-radius: 999px;
    padding: .1rem .55rem; font-size: .74rem;
  }
</style>

<body>

<script>
'use strict';

const SVGNS = 'http://www.w3.org/2000/svg';
const HAUTEUR_VOIE = 35.2;   // doit valoir la hauteur d'un nœud de l'arbre (2.2rem)
const MARGE_HAUT = 54.4;    // doit valoir le padding-top de l'arbre (3.4rem)
const REGLE_BAS = 24;      // la ligne de base de la règle du temps
const HAUTEUR_BARRE = 15;     // la barre de l'agent
const HAUTEUR_DUREE = 10;     // la bande de durée d'un appel d'outil, sous la barre
const LARGEUR_PRISE_MIN = 10; // un appel bref doit rester visable à la souris
const LARGEUR_VIDE = 22;     // largeur donnée à un temps mort replié
const LARGEUR_MAX = 16000000; // largeur maximale du dessin, bien sous l'écrêtage à 33,5 M
// À fond de zoom, une règle dessinée sur toute la largeur produit 140 000 traits et
// 70 000 étiquettes, soit deux secondes par redessin — inutilisable à la molette. On ne
// dessine donc que la fenêtre visible, élargie d'une marge pour que le défilement doux ne
// révèle pas de vide, et on redessine quand on s'est assez éloigné.
const MARGE_RENDU = 2500;
const SEUIL_VIDE_MIN_MS = 60000; // on ne replie jamais un trou de moins d'une minute
const PART_VIDE = 400;      // ni un trou de moins d'un quatre-centième de la session

let deroule = null;
let vise = null;
let axeCourant = null;
// L'ordre des voies, quand Yves l'a changé. Tant qu'il n'y touche pas, c'est l'ordre
// naturel qui s'applique — et les voies d'un agent qui apparaît en cours de route se
// placent d'elles-mêmes au bon endroit.
let ordreVoies = [];
let ordrePersonnalise = false;
// Ce qu'Yves a disposé lui-même survit au rechargement : sans quoi chaque retour sur une
// session lui redemanderait le même travail. Deux portées, parce que ce ne sont pas les
// mêmes choses. Les voies affichées valent pour toutes les sessions — c'est un goût, pas
// un détail de telle trace. L'ordre des lignes et les agents repliés, eux, tiennent aux
// agents de CETTE session, dont les identifiants ne veulent rien dire ailleurs.
const CLE_MEMOIRE = 'claude-n-works.reglages.v1';
const SESSIONS_RETENUES = 40;

/**
 * Le thème. Deux valeurs seulement, `sombre` et `clair` ; le sombre est celui d'origine
 * et reste le défaut, donc il ne pose aucun attribut sur la racine.
 *
 * Presque tout suit sans qu'on redessine : les attributs SVG lisent `var(…)` et le
 * navigateur les recalcule seul. Les exceptions sont les couleurs **interpolées** en JS
 * — l'échelle du Buffer CTX — d'où le `dessiner()` final.
 */
let themeCourant = document.documentElement.dataset.theme === 'clair' ? 'clair' : 'sombre';

/**
 * Les deux pictogrammes de la bascule, tracés plutôt que tapés : mesuré sur un Chromium
 * sans police de symboles, le croissant « ☾ » sort en carré vide. Un bouton dont l'icône
 * manque est un bouton qu'on ne comprend plus.
 */
function dessinerAstre(svg, soleil) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  const NS = 'http://www.w3.org/2000/svg';
  const mettre = (nom, attrs) => {
    const n = document.createElementNS(NS, nom);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    svg.append(n);
    return n;
  };
  if (soleil) {
    mettre('circle', { cx: 8, cy: 8, r: 3.4, fill: 'currentColor' });
    mettre('path', {
      d: 'M8 .8v2M8 13.2v2M.8 8h2M13.2 8h2M2.9 2.9l1.4 1.4M11.7 11.7l1.4 1.4'
         + 'M13.1 2.9l-1.4 1.4M4.3 11.7l-1.4 1.4',
      stroke: 'currentColor', 'stroke-width': 1.4, 'stroke-linecap': 'round', fill: 'none',
    });
  } else {
    // un croissant : un disque dont on retire un second, décalé
    mettre('path', {
      d: 'M11.2 1.9a6.6 6.6 0 1 0 3 9.6A5.3 5.3 0 0 1 11.2 1.9Z',
      fill: 'currentColor',
    });
  }
}

function appliquerTheme(theme, redessiner) {
  themeCourant = theme === 'clair' ? 'clair' : 'sombre';
  if (themeCourant === 'clair') document.documentElement.dataset.theme = 'clair';
  else delete document.documentElement.dataset.theme;
  const versLeClair = themeCourant === 'sombre';
  const astre = document.getElementById('basculeAstre');
  const texte = document.getElementById('basculeTexte');
  const bouton = document.getElementById('bascule');
  if (astre) dessinerAstre(astre, versLeClair);
  // Le bouton annonce où l'on va, pas où l'on est.
  if (texte) texte.textContent = versLeClair ? 'thème clair' : 'thème sombre';
  if (bouton) {
    bouton.title = versLeClair
      ? 'Passer au thème clair — le choix est retenu pour les deux écrans'
      : 'Revenir au thème sombre — le choix est retenu pour les deux écrans';
    bouton.setAttribute('aria-pressed', themeCourant === 'clair' ? 'true' : 'false');
  }
  oublierPalette();
  if (redessiner) dessiner();
}

function lireReglages() {
  try { return JSON.parse(localStorage.getItem(CLE_MEMOIRE)) || {}; } catch { return {}; }
}

function retenir() {
  const r = lireReglages();
  r.voies = { ...voiesVisibles };
  // Le thème vaut pour toutes les sessions et pour les deux écrans : c'est un goût, au
  // même titre que les voies affichées, et non un détail de telle trace.
  r.theme = themeCourant;
  r.sessions = r.sessions || {};
  const s = r.sessions[idSession] || (r.sessions[idSession] = {});
  s.ordre = ordrePersonnalise ? ordreVoies : null;
  s.replies = [...agentsReplies];
  s.vu = Date.now();
  // On ne retient pas toutes les sessions de la machine : les plus anciennement vues
  // s'effacent, sans quoi le stockage grossirait sans fin et finirait par déborder.
  const ids = Object.keys(r.sessions)
    .sort((a, b) => (r.sessions[b].vu || 0) - (r.sessions[a].vu || 0));
  for (const trop of ids.slice(SESSIONS_RETENUES)) delete r.sessions[trop];
  // Un navigateur en navigation privée, ou un stockage plein, refuse d'écrire. Ce n'est
  // pas une raison pour casser l'écran : on se passe de mémoire et on continue.
  try { localStorage.setItem(CLE_MEMOIRE, JSON.stringify(r)); } catch { /* tant pis */ }
}

function seSouvenir() {
  const r = lireReglages();
  themeCourant = r.theme === 'clair' ? 'clair' : 'sombre';
  if (r.voies) {
    for (const cle of Object.keys(voiesVisibles)) {
      if (typeof r.voies[cle] === 'boolean') voiesVisibles[cle] = r.voies[cle];
    }
  }
  const s = (r.sessions || {})[idSession];
  if (!s) return;
  if (Array.isArray(s.ordre) && s.ordre.length) {
    ordreVoies = s.ordre;
    ordrePersonnalise = true;
  }
  for (const agentId of s.replies || []) agentsReplies.add(agentId);
}

/** Tout réafficher, tout déplier, et rendre l'ordre naturel. */
function oublier() {
  for (const cle of Object.keys(voiesVisibles)) voiesVisibles[cle] = true;
  ordreVoies = [];
  ordrePersonnalise = false;
  agentsReplies.clear();
  retenir();
  remplirMenuVoies();
  dessiner();
}

// Les agents repliés. Replier ferme tout ce qui est sous la ligne de l'agent : ses propres
// voies annexes comme ses sous-agents et les leurs. Un agent replié tient donc en une
// seule ligne, ce qui est le seul moyen de rendre un arbre fourni lisible.
const agentsReplies = new Set();
let rendu = null;   // ce qui a été dessiné, pour savoir quand il faut recommencer

const elTitre = document.getElementById('titre');
const elResume = document.getElementById('resume');
const elArbre = document.getElementById('arbre');
const elPiste = document.getElementById('piste');
const elZoom = document.getElementById('zoom');
const elZoomTexte = document.getElementById('zoomTexte');
const elReplier = document.getElementById('replier');
const elVivante = document.getElementById('vivante');
const elMenuVoies = document.getElementById('menuVoies');
const elResumeVoies = document.getElementById('resumeVoies');
const elListeVoies = document.getElementById('listeVoies');

// Quelles voies annexes sont montrées. Les agents, eux, sont toujours là : ce sont eux
// qu'on vient voir.
const VOIES_ANNEXES = [
  { cle: 'tours', nom: 'tours', teinte: 'var(--tours)' },
  { cle: 'outils', nom: 'outils', teinte: 'var(--outil)' },
  { cle: 'reflexion', nom: 'réflexion', teinte: 'var(--reflexion)' },
  { cle: 'fichiers', nom: 'fichiers', teinte: 'linear-gradient(to bottom, var(--outil), var(--outil-echec))' },
  { cle: 'outillage', nom: 'outillage', teinte: 'var(--outillage)' },
  { cle: 'hooks', nom: 'hooks', teinte: 'var(--hook)' },
  { cle: 'contexte', nom: 'Taille CTX', teinte: 'linear-gradient(to top, var(--ramp-bon), var(--ramp-mauvais))' },
  { cle: 'contenu', nom: 'Contenu CTX', teinte: 'linear-gradient(to right, var(--en-cours), var(--outil))' },
  { cle: 'buffer', nom: 'Buffer CTX', teinte: 'linear-gradient(to right, var(--ramp-mauvais), var(--ramp-moyen), var(--ramp-bon))' },
  { cle: 'attente', nom: 'attente', teinte: 'var(--requete)' },
  { cle: 'boucles', nom: 'boucles', teinte: 'var(--boucle)' },
  { cle: 'modele', nom: 'appels au modèle', teinte: 'var(--modele)' },
];
const voiesVisibles = {
  tours: true, outils: true, reflexion: true, fichiers: true, outillage: true, hooks: true, contexte: true, contenu: true, buffer: true, attente: true, boucles: true, modele: true,
};

// Ce que coûte un appel, en multiples du prix plein : écrire au cache coûte 1,25 fois, y
// lire 0,1 fois. Ce sont les tarifs relatifs d'Anthropic, et ils ne dépendent ni du modèle
// ni de la monnaie — c'est pour cela qu'on peut les écrire ici sans mentir.
const PRIX_JETON = { neuf: 1, ecrit: 1.25, lu: 0.1 };

/**
 * Ce qu'un appel économise par rapport au plein tarif.
 *
 * On ne retient pas la simple part relue : mesurée sur 16 178 requêtes de la machine, elle
 * vaut 97,9 % en moyenne et 96 % des appels sont au-dessus de 90 %. Une échelle fondée
 * dessus ne distinguerait rien. L'économie réelle s'étale, elle, de −25 % — tout écrit au
 * cache, donc payé 1,25 fois — à 90 %, le plafond, puisqu'une lecture coûte encore un
 * dixième.
 */
function economieCache(j) {
  const total = (j?.entree || 0) + (j?.cacheLu || 0) + (j?.cacheEcrit || 0);
  if (!total) return null;
  const cout = (j.entree || 0) * PRIX_JETON.neuf
    + (j.cacheEcrit || 0) * PRIX_JETON.ecrit
    + (j.cacheLu || 0) * PRIX_JETON.lu;
  return { total, cout, part: 1 - cout / total, relu: (j.cacheLu || 0) / total };
}

// Le dégradé est tendu de 50 % à 90 %, et non de 0 à 1. 90 % est le plafond atteignable ;
// 50 % est le premier centile mesuré (52,4 %), si bien que le pour-cent d'appels les plus
// coûteux sature en rouge au lieu d'écraser l'échelle. Entre les deux, les percentiles
// mesurés se répartissent : p5 à 80,6 %, p25 à 88,4 %, médiane à 89,4 %.
/**
 * L'échelle du Buffer CTX — la seule couleur que le navigateur ne peut pas résoudre
 * lui-même, puisqu'elle s'interpole entre deux paliers. Elle lit donc les variables de
 * la palette au moment de dessiner, et suit le thème comme tout le reste. La lecture est
 * mise en cache le temps d'un dessin : `getComputedStyle` coûte un calcul de style, et
 * une session en demande plusieurs milliers.
 */
const PALIERS_BUFFER = [
  { a: 0.50, variable: '--ramp-mauvais' },
  { a: 0.70, variable: '--ramp-moyen' },
  { a: 0.90, variable: '--ramp-bon' },
];
let paletteLue = null;

function rvbDeLaPalette(variable) {
  if (!paletteLue) paletteLue = new Map();
  if (paletteLue.has(variable)) return paletteLue.get(variable);
  const brut = getComputedStyle(document.documentElement).getPropertyValue(variable).trim();
  const h = brut.replace('#', '');
  const rvb = h.length >= 6
    ? [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]
    : [128, 128, 128]; // une variable absente ne doit pas faire planter un dessin
  paletteLue.set(variable, rvb);
  return rvb;
}

/** À appeler quand la palette change : la lecture mise en cache n'est plus valable. */
function oublierPalette() { paletteLue = null; }

function teinteBuffer(part) {
  const x = Math.max(PALIERS_BUFFER[0].a, Math.min(PALIERS_BUFFER.at(-1).a, part));
  for (let i = 1; i < PALIERS_BUFFER.length; i += 1) {
    const g = PALIERS_BUFFER[i - 1];
    const d = PALIERS_BUFFER[i];
    if (x > d.a) continue;
    const k = (x - g.a) / (d.a - g.a);
    const gr = rvbDeLaPalette(g.variable);
    const dr = rvbDeLaPalette(d.variable);
    const c = gr.map((v, j) => Math.round(v + (dr[j] - v) * k));
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }
  return `rgb(${rvbDeLaPalette(PALIERS_BUFFER.at(-1).variable).join(',')})`;
}

/** L'économie d'un agent entier : les coûts et les totaux s'additionnent, pas les parts. */
function economieAgent(agent) {
  let total = 0;
  let cout = 0;
  let relu = 0;
  for (const r of agent.requetesModele || []) {
    const e = economieCache(r.jetons);
    if (!e) continue;
    total += e.total; cout += e.cout; relu += (r.jetons.cacheLu || 0);
  }
  return total ? { total, cout, part: 1 - cout / total, relu: relu / total } : null;
}

// De quoi le contexte est fait. L'ordre est celui de l'empilement, du bas vers le haut.
const PARTS_CONTENU = [
  { cle: 'systeme', nom: 'invite système, rappels, skills', teinte: 'var(--ctx-systeme)' },
  { cle: 'outilSortie', nom: 'résultats d’outils', teinte: 'var(--ctx-outil-sortie)' },
  { cle: 'outilEntree', nom: 'appels d’outils', teinte: 'var(--ctx-outil-entree)' },
  { cle: 'modele', nom: 'paroles du modèle', teinte: 'var(--ctx-modele)' },
  { cle: 'humain', nom: 'requêtes d’Yves', teinte: 'var(--ctx-humain)' },
];
const totalComposition = (c) => PARTS_CONTENU.reduce((n, p) => n + (c?.[p.cle] || 0), 0);

// Une teinte par modèle. Volontairement distincte des couleurs déjà employées ailleurs :
// la voie d'un modèle ne doit pas se confondre avec un état d'agent ou une attente.
const TEINTES_MODELE = {
  'claude-opus-5': 'var(--modele-opus)',
  'claude-sonnet-5': 'var(--modele-sonnet)',
  'claude-haiku-4-5': 'var(--modele-haiku)',
};
const TEINTE_MODELE_AUTRE = 'var(--modele-autre)';
const teinteModele = (m) => TEINTES_MODELE[m] || TEINTE_MODELE_AUTRE;

/** Les modèles qu'un agent a réellement appelés, dans l'ordre de première apparition. */
function modelesDe(agent) {
  const vus = [];
  for (const r of agent.requetesModele || []) if (!vus.includes(r.modele)) vus.push(r.modele);
  return vus;
}
const elReplis = document.getElementById('replis');
const elBoucles = document.getElementById('boucles');
const elBouclesTitre = document.getElementById('bouclesTitre');
const elChoixBoucle = document.getElementById('choixBoucle');
let boucleVisee = null;      // la boucle mise en évidence sur la ligne du temps
let iterationVisee = null;   // et, dans cette boucle, le tour choisi : {boucle, rang}

function duree(ms) {
  if (ms === null || ms === undefined) return '—';
  if (ms < 1000) return ms + ' ms';
  const s = ms / 1000;
  if (s < 90) return s.toFixed(1) + ' s';
  const m = s / 60;
  if (m < 90) return m.toFixed(0) + ' min';
  const h = m / 60;
  if (h < 48) return h.toFixed(1) + ' h';
  return (h / 24).toFixed(1) + ' j';
}
const heure = (ms) => new Date(ms).toLocaleString('fr-FR');

/**
 * L'axe du temps. Une session peut s'étaler sur onze jours tout en ne travaillant que par
 * courtes bouffées : à l'échelle linéaire, tout se tasse en traits invisibles. On découpe
 * donc le temps en segments actifs, à l'échelle, séparés par des temps morts repliés à
 * largeur fixe — et marqués comme tels, pour que rien ne disparaisse en silence.
 */
function seuilVide(debut, fin) {
  // Replier un trou d'une minute a du sens sur une session d'un quart d'heure, aucun sur
  // une session de onze jours : le seuil suit la durée totale.
  return Math.max(SEUIL_VIDE_MIN_MS, (fin - debut) / PART_VIDE);
}

function construireAxe(instants, debut, fin, pxParMs, replier) {
  if (!replier) {
    const total = Math.max(1, (fin - debut) * pxParMs);
    return {
      largeur: total,
      segments: [{ t0: debut, t1: fin, x0: 0, x1: total, vide: false }],
      x: (t) => (t - debut) * pxParMs,
      // L'inverse doit exister ici aussi : le zoom à la molette s'en sert pour retenir
      // l'instant sous le curseur, et son absence faisait échouer tout le geste.
      t: (px) => debut + px / pxParMs,
      replies: 0,
      elide: 0,
    };
  }
  const seuil = seuilVide(debut, fin);
  const tries = [...new Set(instants)].sort((a, b) => a - b);
  const segments = [];
  let x = 0;
  let t0 = debut;
  let precedent = debut;
  let replies = 0;
  let elide = 0;
  for (const t of tries) {
    if (t - precedent > seuil) {
      replies += 1;
      elide += t - precedent;
      const largeur = (precedent - t0) * pxParMs;
      segments.push({ t0, t1: precedent, x0: x, x1: x + largeur, vide: false });
      x += largeur;
      segments.push({ t0: precedent, t1: t, x0: x, x1: x + LARGEUR_VIDE, vide: true });
      x += LARGEUR_VIDE;
      t0 = t;
    }
    precedent = Math.max(precedent, t);
  }
  const largeur = Math.max(1, (Math.max(precedent, fin) - t0) * pxParMs);
  segments.push({ t0, t1: Math.max(precedent, fin), x0: x, x1: x + largeur, vide: false });
  x += largeur;

  function projeter(t) {
    for (const s of segments) {
      if (t <= s.t1) {
        if (t < s.t0) return s.x0;
        if (s.vide) return s.x0 + LARGEUR_VIDE / 2;
        const p = s.t1 === s.t0 ? 0 : (t - s.t0) / (s.t1 - s.t0);
        return s.x0 + p * (s.x1 - s.x0);
      }
    }
    return x;
  }
  /** L'inverse de `projeter` : quel instant se trouve à cette abscisse. */
  function instantA(px) {
    for (const s of segments) {
      if (px > s.x1) continue;
      if (s.vide) return s.t0; // dans un temps mort replié, on rend son bord gauche
      const p = s.x1 === s.x0 ? 0 : (px - s.x0) / (s.x1 - s.x0);
      return s.t0 + p * (s.t1 - s.t0);
    }
    const fin = segments[segments.length - 1];
    return fin ? fin.t1 : debut;
  }

  return { largeur: x, segments, x: projeter, t: instantA, replies, elide };
}

/** Le temps réellement occupé, trous repliés exclus : sert à calculer l'échelle juste. */
function tempsActif(instants, debut, fin) {
  const seuil = seuilVide(debut, fin);
  const tries = [...new Set(instants)].sort((a, b) => a - b);
  let actif = fin - debut;
  let n = 0;
  let precedent = debut;
  for (const t of tries) {
    if (t - precedent > seuil) { actif -= t - precedent; n += 1; }
    precedent = Math.max(precedent, t);
  }
  return { actif: Math.max(1, actif), n };
}

function tousLesInstants(d) {
  const ts = [];
  for (const a of d.agents) {
    if (a.debut !== null) ts.push(a.debut);
    if (a.fin !== null) ts.push(a.fin);
    for (const o of a.outils) {
      if (o.debut !== null) ts.push(o.debut);
      if (o.fin !== null) ts.push(o.fin);
    }
  }
  for (const r of d.requetes) if (r.instant !== null) ts.push(r.instant);
  return ts;
}

/**
 * La couleur d'un pictogramme d'agent. Celle de l'état convient pour une barre, mais
 * « terminé » y est un gris si sombre qu'un glyphe de treize pixels y disparaît : on
 * l'éclaircit, sans changer le sens — gris veut toujours dire terminé.
 */
function couleurPicto(etat) {
  return etat === 'terminé' ? 'var(--texte-faible)' : couleurEtat(etat);
}

function couleurEtat(etat) {
  return etat === 'en cours' ? 'var(--en-cours)'
    : etat === 'interrompu' ? 'var(--interrompu)'
    : etat === 'fin inconnue' ? 'var(--inconnu)'
    : 'var(--termine)';
}

function el(nom, attrs, ...enfants) {
  const n = document.createElementNS(SVGNS, nom);
  for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
  for (const e of enfants) n.append(e);
  return n;
}

/**
 * Les voies de la piste : une par agent, et sous chaque agent qui en mène, une voie à part
 * pour ses boucles. Une boucle n'est pas un agent — elle n'a ni modèle ni outils — mais
 * elle occupe du temps, et c'est à ce titre qu'elle mérite sa propre ligne.
 */
/**
 * La référence de la voie de contexte, et ce qu'elle vaut.
 *
 * On ne connaît la fenêtre réelle que si la session a compacté : le niveau atteint juste
 * avant un compactage **est** la fenêtre, puisque c'est lui qui l'a déclenché. Sans
 * compactage, on ignore tout du plafond — une session qui plafonne à 47 k jetons sur une
 * fenêtre d'un million n'est pas pleine du tout. Dans ce cas on ne prétend pas mesurer un
 * remplissage : l'échelle reste relative et la couleur neutre.
 */
function refContexte() {
  let pic = 1;
  let compacte = false;
  for (const a of deroule.agents) {
    for (const c of a.contexte || []) if (c.jetons > pic) pic = c.jetons;
    if ((a.compactages || []).length) compacte = true;
  }
  return { pic, fenetreConnue: compacte };
}

/** La clé d'une voie, stable d'un rafraîchissement à l'autre. */
function cleVoie(v) {
  return v.agent.id + '|' + v.genre + (v.modele ? '|' + v.modele : '');
}

/**
 * Applique l'ordre choisi par Yves, s'il en a choisi un. Une voie qu'il n'a jamais vue —
 * un sous-agent qui vient de naître — se range à la fin plutôt que de bousculer ce qu'il
 * a mis en place.
 */
function rangerVoies(voies) {
  if (!ordrePersonnalise) return voies;
  const parCle = new Map(voies.map((v) => [cleVoie(v), v]));
  const rangees = [];
  for (const cle of ordreVoies) {
    const v = parCle.get(cle);
    if (v) { rangees.push(v); parCle.delete(cle); }
  }
  for (const v of parCle.values()) rangees.push(v);
  ordreVoies = rangees.map(cleVoie);
  return rangees;
}

/** Échange une voie avec sa voisine, vers le haut ou vers le bas. */
function deplacerVoie(voies, i, pas) {
  const j = i + pas;
  if (j < 0 || j >= voies.length) return;
  if (!ordrePersonnalise) {
    ordreVoies = voies.map(cleVoie);
    ordrePersonnalise = true;
  }
  const a = cleVoie(voies[i]);
  const b = cleVoie(voies[j]);
  const ia = ordreVoies.indexOf(a);
  const ib = ordreVoies.indexOf(b);
  if (ia < 0 || ib < 0) return;
  ordreVoies[ia] = b;
  ordreVoies[ib] = a;
  retenir();
  dessiner();
}

/** Les agents cachés parce qu'un de leurs ancêtres est replié. */
function agentsCaches() {
  const parId = new Map(deroule.agents.map((a) => [a.id, a]));
  const caches = new Set();
  for (const a of deroule.agents) {
    let p = a.parent;
    while (p && p !== a.id) {
      if (agentsReplies.has(p)) { caches.add(a.id); break; }
      p = parId.get(p)?.parent;
    }
  }
  return caches;
}

/** Combien d'agents une ligne repliée dissimule, descendance comprise. */
function compterDescendants(id) {
  const parId = new Map(deroule.agents.map((a) => [a.id, a]));
  let n = 0;
  for (const a of deroule.agents) {
    let p = a.parent;
    while (p && p !== a.id) {
      if (p === id) { n += 1; break; }
      p = parId.get(p)?.parent;
    }
  }
  return n;
}

function construireVoies() {
  const voies = [];
  const caches = agentsCaches();
  for (const a of deroule.agents) {
    if (caches.has(a.id)) continue;
    voies.push({ genre: 'agent', agent: a, prof: a.profondeur });
    if (agentsReplies.has(a.id)) continue;
    // Les tours viennent juste sous l'agent : ils sont le rythme de son travail, et tout
    // le reste — outils, appels au modèle — se loge dedans.
    if (voiesVisibles.tours && (a.tours || []).length) {
      voies.push({ genre: 'tours', agent: a, prof: a.profondeur + 1 });
    }
    if (voiesVisibles.outils && (a.outils || []).length) {
      voies.push({ genre: 'outils', agent: a, prof: a.profondeur + 1 });
    }
    if (voiesVisibles.reflexion
        && (a.requetesModele || []).some((r) => r.jetons.reflexion > 0)) {
      voies.push({ genre: 'reflexion', agent: a, prof: a.profondeur + 1 });
    }
    if (voiesVisibles.fichiers && (a.outils || []).some((o) => o.fichier)) {
      voies.push({ genre: 'fichiers', agent: a, prof: a.profondeur + 1 });
    }
    if (voiesVisibles.hooks && (a.hooks || []).length) {
      voies.push({ genre: 'hooks', agent: a, prof: a.profondeur + 1 });
    }
    if (voiesVisibles.outillage && (a.outillage || []).length) {
      voies.push({ genre: 'outillage', agent: a, prof: a.profondeur + 1 });
    }
    if (voiesVisibles.contexte && (a.contexte || []).length > 1) {
      voies.push({ genre: 'contexte', agent: a, prof: a.profondeur + 1 });
    }
    if (voiesVisibles.contenu && (a.requetesModele || []).length > 1) {
      voies.push({ genre: 'contenu', agent: a, prof: a.profondeur + 1 });
    }
    if (voiesVisibles.buffer && (a.requetesModele || []).length > 1) {
      voies.push({ genre: 'buffer', agent: a, prof: a.profondeur + 1 });
    }
    if (voiesVisibles.attente && (a.attentes || []).length) {
      voies.push({ genre: 'attente', agent: a, prof: a.profondeur + 1 });
    }
    if (voiesVisibles.boucles && (a.boucles || []).length) {
      voies.push({ genre: 'boucles', agent: a, prof: a.profondeur + 1 });
    }
    // Une voie par modèle réellement appelé : un agent peut en employer plusieurs, et les
    // mélanger sur une seule ligne masquerait lequel répond vite.
    if (voiesVisibles.modele) {
      for (const m of modelesDe(a)) {
        voies.push({ genre: 'modele', agent: a, modele: m, prof: a.profondeur + 1 });
      }
    }
  }
  return rangerVoies(voies);
}

function dessinerArbre() {
  const voies = construireVoies();
  elArbre.replaceChildren(...voies.map((v, i) => {
    const a = v.agent;
    const d = document.createElement('div');
    d.className = 'noeud' + (a.id === vise && v.genre === 'agent' ? ' vise' : '');

    // Le clic d'une flèche ne doit jamais ouvrir la carte de la ligne. `stopPropagation`
    // depuis le bouton ne suffit pas : le redessin détruit le bouton pendant que
    // l'événement se propage, et le gestionnaire de la ligne finit par le voir. On filtre
    // donc dans ce gestionnaire, sur l'origine du clic.
    const surLigne = (quoi) => d.addEventListener('click', (e) => {
      if (e.target.closest && e.target.closest('.rangement, .chevron')) return;
      quoi();
    });

    // Deux flèches pour rapprocher deux voies qu'on veut comparer.
    const rangement = document.createElement('span');
    rangement.className = 'rangement';
    for (const [pas, signe, quoi] of [[-1, '▲', 'monter'], [1, '▼', 'descendre']]) {
      const b = document.createElement('button');
      b.textContent = signe;
      b.title = quoi + ' cette ligne';
      b.disabled = pas < 0 ? i === 0 : i === voies.length - 1;
      b.addEventListener('click', (e) => { e.stopPropagation(); deplacerVoie(voies, i, pas); });
      rangement.append(b);
    }

    // L'indentation, puis le chevron de repli pour un agent qui a une descendance.
    const indent = document.createElement('span');
    indent.className = 'indent';
    indent.style.width = (v.prof * 1.15) + 'rem';

    const chevron = document.createElement('button');
    chevron.className = 'chevron';
    // Un agent a toujours quelque chose sous lui — au moins ses propres voies — donc il
    // porte toujours un chevron.
    const repliable = v.genre === 'agent';
    if (repliable) {
      const replie = agentsReplies.has(a.id);
      chevron.textContent = replie ? '▸' : '▾';
      chevron.title = (replie ? 'déplier' : 'replier') + ' la descendance de cet agent';
      chevron.addEventListener('click', () => {
        if (agentsReplies.has(a.id)) agentsReplies.delete(a.id);
        else agentsReplies.add(a.id);
        retenir();
        dessiner();
      });
    } else {
      chevron.className = 'chevron creux';
      chevron.textContent = '▸';
      chevron.disabled = true;
    }

    const icone = document.createElement('span');
    icone.className = 'icone';
    const puce = document.createElement('i');
    puce.className = 'puce';
    const etiq = document.createElement('span');
    etiq.className = 'etiq';
    const etat = document.createElement('span');
    etat.className = 'etat';

    if (v.genre === 'agent') {
      d.title = a.nom + '  —  ' + a.etat + '\n\n' + LEGENDE_VOIE.agent;
      icone.textContent = a.profondeur === 0 ? '◆' : '◈';
      icone.style.color = couleurPicto(a.etat);
      puce.style.background = couleurEtat(a.etat);
      etiq.textContent = a.nom;
      etat.textContent = a.outils.length + ' out.';
      surLigne(() => { vise = a.id; dessiner(); carteAgent(a); });
    } else if (v.genre === 'reflexion') {
      const avec = a.requetesModele.filter((r) => r.jetons.reflexion > 0);
      const total = avec.reduce((n, r) => n + r.jetons.reflexion, 0);
      const pic = Math.max(0, ...avec.map((r) => r.jetons.reflexion));
      d.title = avec.length + ' appels sur ' + a.requetesModele.length + ' comportent une '
        + 'réflexion\n' + total.toLocaleString('fr-FR') + ' jetons en tout, le plus long '
        + pic.toLocaleString('fr-FR') + '\n\n' + LEGENDE_VOIE.reflexion;
      icone.textContent = '∿';
      icone.style.color = 'var(--reflexion)';
      puce.style.background = 'var(--reflexion)';
      etiq.textContent = 'réflexion';
      etiq.style.color = 'var(--texte-faible)';
      etat.textContent = Math.round(total / 1000) + ' k jet.';
      surLigne(() => carteReflexion(a));
    } else if (v.genre === 'fichiers') {
      const ops = a.outils.filter((o) => o.fichier);
      const distincts = new Set(ops.map((o) => o.fichier.chemin)).size;
      const plus = ops.reduce((n, o) => n + o.fichier.plus, 0);
      const moins = ops.reduce((n, o) => n + o.fichier.moins, 0);
      d.title = distincts + ' fichiers touchés, ' + ops.length + ' opérations'
        + '\n+' + plus.toLocaleString('fr-FR') + ' / −' + moins.toLocaleString('fr-FR')
        + ' lignes\n\n' + LEGENDE_VOIE.fichiers;
      icone.textContent = '⊟';
      icone.style.color = 'var(--outil)';
      puce.style.background = 'linear-gradient(to bottom, var(--outil), var(--outil-echec))';
      etiq.textContent = 'fichiers';
      if (a.courbeFichiers) {
        d.title = d.title.replace('\n\n', '\nà la fin, ' + a.courbeFichiers.finale
          + ' fichiers qu’il avait écrits existent encore\n\n');
      }
      etiq.style.color = 'var(--texte-faible)';
      etat.textContent = distincts + ' fich.';
      surLigne(() => carteFichiers(a));
    } else if (v.genre === 'hooks') {
      const total = (a.hooks || []).reduce((n2, h) => n2 + (h.dureeMs || 0), 0);
      d.title = a.hooks.length + ' hook(s) déclenché(s), ' + Math.round(total) + ' ms en tout'
        + '\n\n' + LEGENDE_VOIE.hooks;
      icone.textContent = '⊣';
      icone.style.color = 'var(--hook)';
      puce.style.background = 'var(--hook)';
      etiq.textContent = 'hooks';
      etiq.style.color = 'var(--texte-faible)';
      etat.textContent = a.hooks.length + ' hk.';
      surLigne(() => carteHooks(a));
    } else if (v.genre === 'outillage') {
      d.title = (a.outilsOfferts || []).length + ' outils offerts à la fin\n'
        + a.outillage.length + ' changement(s) d’outillage'
        + '\n\n' + LEGENDE_VOIE.outillage;
      icone.textContent = '⊠';
      icone.style.color = 'var(--outillage)';
      puce.style.background = 'var(--outillage)';
      etiq.textContent = 'outillage';
      etiq.style.color = 'var(--texte-faible)';
      etat.textContent = (a.outilsOfferts || []).length + ' out.';
      surLigne(() => carteOutillage(a));
    } else if (v.genre === 'contexte') {
      const sien = Math.max(...a.contexte.map((c) => c.jetons));
      const ref = refContexte();
      d.title = 'Pic à ' + sien.toLocaleString('fr-FR') + ' jetons, '
        + (ref.fenetreConnue
          ? 'soit ' + Math.round((sien / ref.pic) * 100) + ' % de la fenêtre ('
            + ref.pic.toLocaleString('fr-FR') + ')'
          : 'sur une fenêtre de taille inconnue')
        + '\n\n' + LEGENDE_VOIE.contexte;
      icone.textContent = '▥';
      icone.style.color = 'var(--requete)';
      puce.style.background = ref.fenetreConnue
        ? 'linear-gradient(to top, var(--ramp-bon), var(--ramp-moyen), var(--ramp-mauvais))'
        : 'var(--termine)';
      etiq.textContent = 'Taille CTX';
      etiq.style.color = 'var(--texte-faible)';
      etat.textContent = Math.round(sien / 1000) + ' k';
      surLigne(() => carteContexte(a));
    } else if (v.genre === 'tours') {
      const cumul = a.tours.reduce((n, x) => n + x.dureeMs, 0);
      const etendue = (a.fin ?? deroule.fin) - a.debut;
      d.title = a.tours.length + ' tours\ntravail cumulé ' + duree(cumul)
        + ' sur ' + duree(etendue) + '  —  ' + (cumul * 100 / Math.max(1, etendue)).toFixed(1) + ' %'
        + '\n\n' + LEGENDE_VOIE.tours;
      icone.textContent = '⊟';
      icone.style.color = 'var(--en-cours)';
      puce.style.background = 'var(--en-cours)';
      etiq.textContent = 'tours';
      etiq.style.color = 'var(--texte-faible)';
      etat.textContent = a.tours.length + ' · ' + duree(cumul);
      surLigne(() => carteTours(a));
    } else if (v.genre === 'outils') {
      const parNom = {};
      for (const o of a.outils) parNom[o.nom] = (parNom[o.nom] || 0) + 1;
      const tri = Object.entries(parNom).sort((x, y) => y[1] - x[1]);
      d.title = a.outils.length + ' appels d’outils\n'
        + tri.map(([n, c]) => '   ' + n + ' × ' + c).join('\n')
        + '\n\n' + LEGENDE_VOIE.outils;
      icone.textContent = '⊞';
      icone.style.color = 'var(--outil)';
      puce.style.background = 'var(--outil)';
      etiq.textContent = 'outils';
      etiq.style.color = 'var(--texte-faible)';
      etat.textContent = a.outils.length + ' app.';
      surLigne(() => { vise = a.id; dessiner(); carteAgent(a); });
    } else if (v.genre === 'contenu') {
      const derniere = a.requetesModele[a.requetesModele.length - 1];
      d.title = 'De quoi le contexte est fait, à chaque appel au modèle.\n\n'
        + LEGENDE_VOIE.contenu;
      icone.textContent = '▤';
      icone.style.color = 'var(--en-cours)';
      puce.style.background = 'linear-gradient(to right, var(--en-cours), var(--outil))';
      etiq.textContent = 'Contenu CTX';
      etiq.style.color = 'var(--texte-faible)';
      etat.textContent = Math.round(totalComposition(derniere?.composition) / 1000) + ' k car.';
      surLigne(() => carteContenu(a, derniere));
    } else if (v.genre === 'buffer') {
      const e = economieAgent(a);
      const pires = (a.requetesModele || [])
        .map((r) => economieCache(r.jetons)).filter(Boolean)
        .filter((x) => x.part < 0.7).length;
      d.title = 'Le cache lui a épargné ' + Math.round((e?.part || 0) * 100) + ' % de ce que '
        + 'ses appels auraient coûté\n'
        + (e ? Math.round(e.total).toLocaleString('fr-FR') + ' jetons présentés, ' + Math.round(e.relu * 100)
          + ' % relus du cache\n' : '')
        + (pires ? pires + ' appel(s) sous 70 % — le buffer y a été reconstruit\n' : '')
        + '\n' + LEGENDE_VOIE.buffer;
      icone.textContent = '⊞';
      icone.style.color = teinteBuffer(e?.part ?? 0.9);
      puce.style.background = 'linear-gradient(to right, var(--ramp-mauvais), var(--ramp-moyen), var(--ramp-bon))';
      etiq.textContent = 'Buffer CTX';
      etiq.style.color = 'var(--texte-faible)';
      // « 89 % » tout court se lit à tort comme la part relue du cache, qui est un autre
      // nombre — sur un appel mesuré, 85 % d'économie pour 96 % de jetons relus. On dit
      // donc de quoi il s'agit.
      etat.textContent = Math.round((e?.part || 0) * 100) + ' % épargnés';
      surLigne(() => carteBuffer(a, null));
    } else if (v.genre === 'modele') {
      const reqs = a.requetesModele.filter((r) => r.modele === v.modele);
      const lat = reqs.reduce((n, r) => n + r.latenceMs, 0) / Math.max(1, reqs.length);
      const rep = reqs.reduce((n, r) => n + r.reponseMs, 0) / Math.max(1, reqs.length);
      d.title = v.modele + '\n' + reqs.length + ' appel(s)'
        + '\nlatence moyenne ' + duree(Math.round(lat))
        + '\nréponse moyenne ' + duree(Math.round(rep))
        + '\n\n' + LEGENDE_VOIE.modele;
      icone.textContent = '◇';
      icone.style.color = teinteModele(v.modele);
      puce.style.background = teinteModele(v.modele);
      etiq.textContent = v.modele.replace(/^claude-/, '');
      etiq.style.color = 'var(--texte-faible)';
      etat.textContent = reqs.length + ' app.';
      surLigne(() => carteModele(a, v.modele));
    } else if (v.genre === 'attente') {
      const total = a.attentes.reduce((n, x) => n + (x.dureeMs || 0), 0);
      const questions = a.attentes.filter((x) => x.genre === 'question').length;
      d.title = a.attentes.length + ' périodes d’attente, ' + duree(total) + ' en tout'
        + (questions ? ' — dont ' + questions + ' question(s) posée(s)' : '')
        + '\n\n' + LEGENDE_VOIE.attente;
      icone.textContent = '⊝';
      icone.style.color = 'var(--requete)';
      puce.style.background = 'var(--requete)';
      etiq.textContent = 'attente';
      etiq.style.color = 'var(--texte-faible)';
      etat.textContent = duree(total);
      surLigne(() => carteAttentes(a));
    } else {
      const n = a.boucles.length;
      const its = a.boucles.reduce((s, b) => s + b.iterations.length, 0);
      d.title = n + ' boucle(s), ' + its + ' itération(s)\n\n' + LEGENDE_VOIE.boucles;
      icone.textContent = '⟳';
      icone.style.color = 'var(--boucle)';
      puce.style.background = 'var(--boucle)';
      puce.style.borderRadius = '50%';
      etiq.textContent = n > 1 ? n + ' boucles' : 'une boucle';
      etiq.style.color = 'var(--texte-faible)';
      etat.textContent = its + ' it.';
      surLigne(() => carteBoucle(a.boucles[0], a, 0));
    }
    d.append(rangement, indent, chevron, icone, puce, etiq, etat);
    // Une ligne repliée dit combien d'agents elle dissimule.
    if (v.genre === 'agent' && agentsReplies.has(a.id)) {
      const caches = document.createElement('span');
      caches.className = 'caches';
      const n = compterDescendants(a.id);
      caches.textContent = n ? '+' + n : '…';
      caches.title = n
        ? n + ' sous-agent(s) replié(s), et toutes les voies de celui-ci'
        : 'les voies de cet agent sont repliées';
      d.insertBefore(caches, etat);
    }
    return d;
  }));
}

function dessinerPiste() {
  const d = deroule;
  const instants = tousLesInstants(d);
  if (d.sessionVivante) { d.fin = Math.max(d.fin, Date.now()); instants.push(Date.now()); }
  const span = Math.max(1, d.fin - d.debut);
  // L'échelle la plus large fait tenir toute la session dans la largeur réellement
  // disponible — et non dans une largeur supposée, qui déborderait. Les bandes de temps
  // mort occupent une place fixe : il faut la retrancher avant de calculer l'échelle.
  const dispo = Math.max(320, elPiste.clientWidth - 24);
  const { actif, n } = elReplier.checked
    ? tempsActif(instants, d.debut, d.fin)
    : { actif: span, n: 0 };
  const min = Math.max(dispo - n * LARGEUR_VIDE, dispo * 0.25) / actif;
  // Jusqu'où aller en zoom ? Deux bornes. Le navigateur écrête un élément au-delà de
  // 33 554 428 px — mesuré : jusqu'à 20 millions tout reste à sa place, à 50 millions la
  // fin du dessin se replie sur elle-même. On s'arrête donc bien en deçà. Et au-delà d'un
  // pixel par milliseconde, il n'y a plus rien à y gagner.
  const max = Math.max(min * 2, Math.min(1, LARGEUR_MAX / actif));
  const p = Number(elZoom.value) / 100;
  const pxParMs = min * Math.pow(max / min, p);
  elZoomTexte.textContent = pxParMs * 1000 >= 1
    ? (pxParMs * 1000).toFixed(1) + ' px/s'
    : (pxParMs * 60000).toFixed(1) + ' px/min';

  const axe = construireAxe(instants, d.debut, d.fin, pxParMs, elReplier.checked);
  axeCourant = axe;

  const vue = {
    x0: elPiste.scrollLeft - MARGE_RENDU,
    x1: elPiste.scrollLeft + elPiste.clientWidth + MARGE_RENDU,
  };
  rendu = { defil: elPiste.scrollLeft, largeur: axe.largeur };
  const visible = (a, b) => b >= vue.x0 && a <= vue.x1;
  elReplis.textContent = axe.replies
    ? axe.replies + ' temps mort' + (axe.replies > 1 ? 's' : '') + ' replié'
      + (axe.replies > 1 ? 's' : '') + ', ' + duree(axe.elide) + ' élidée'
    : '';
  const voies = construireVoies();
  const hauteur = MARGE_HAUT + voies.length * HAUTEUR_VOIE + 20;
  const svg = el('svg', { width: Math.ceil(axe.largeur) + 2, height: hauteur });
  const defs = el('defs', {});
  const degrade = el('linearGradient', {
    id: 'degrade-contexte', x1: '0', y1: '1', x2: '0', y2: '0',
  });
  degrade.append(
    el('stop', { offset: '0%', 'stop-color': 'var(--ramp-bon)' }),
    el('stop', { offset: '55%', 'stop-color': 'var(--ramp-moyen)' }),
    el('stop', { offset: '100%', 'stop-color': 'var(--ramp-mauvais)' }),
  );
  defs.append(degrade);
  svg.append(defs);

  // La boucle choisie dans la liste : une plage mise en évidence sur toute la hauteur,
  // dessinée en fond pour ne rien recouvrir.
  if (boucleVisee) {
    const choix = trouverBoucle(boucleVisee);
    if (choix) {
      const bx0 = axe.x(choix.b.debut);
      const bx1 = Math.max(bx0 + 3, axe.x(choix.b.fin ?? d.fin));
      svg.append(el('rect', {
        x: bx0, y: REGLE_BAS, width: bx1 - bx0, height: hauteur - REGLE_BAS,
        fill: 'var(--boucle)', opacity: '.1',
      }));
      for (const bx of [bx0, bx1]) {
        svg.append(el('line', {
          x1: bx, y1: REGLE_BAS, x2: bx, y2: hauteur,
          stroke: 'var(--boucle)', 'stroke-width': 1.5, opacity: '.75',
        }));
      }
      const et = el('text', {
        x: bx0 + 4, y: REGLE_BAS + 11, fill: 'var(--boucle)', 'font-size': '9.5',
      });
      et.textContent = 'boucle choisie · ' + choix.b.iterations.length + ' it. · '
        + duree((choix.b.fin ?? d.fin) - choix.b.debut);
      svg.append(et);

      // Le tour choisi dans la carte : sa fenêtre va de la fin du tour précédent à son
      // propre réveil. On l'encadre plus franchement que la boucle entière.
      if (iterationVisee && iterationVisee.boucle === choix.b.id) {
        const it = choix.b.iterations[iterationVisee.rang];
        if (it) {
          const ix0 = axe.x(it.depuis ?? it.instant);
          const ix1 = Math.max(ix0 + 2, axe.x(it.jusqua ?? it.instant));
          svg.append(el('rect', {
            x: ix0, y: REGLE_BAS, width: ix1 - ix0, height: hauteur - REGLE_BAS,
            fill: 'var(--accent)', opacity: '.16',
          }));
          svg.append(el('rect', {
            x: ix0, y: REGLE_BAS, width: ix1 - ix0, height: hauteur - REGLE_BAS,
            fill: 'none', stroke: 'var(--accent)', 'stroke-width': 1.5,
            'stroke-dasharray': '5 3',
          }));
          const eti = el('text', {
            x: ix0 + 4, y: REGLE_BAS + 22, fill: 'var(--accent)', 'font-size': '9.5',
          });
          eti.textContent = 'itération ' + (iterationVisee.rang + 1) + ' sur '
            + choix.b.iterations.length + ' · ' + duree(ix1 === ix0 ? 0 : (it.jusqua - it.depuis));
          svg.append(eti);
        }
      }
    }
  }

  svg.append(dessinerRegle(axe, pxParMs, hauteur, vue));

  // Les temps morts repliés, en bande claire sur le fond sombre : une bande sombre s'y
  // noyait, alors que le repli est justement ce qu'il ne faut pas rater.
  for (const s of axe.segments) {
    if (!s.vide) continue;
    // La bande monte jusqu'en haut, règle comprise : c'est bien l'axe du temps lui-même
    // qui saute ici, et non seulement les voies.
    svg.append(el('rect', {
      x: s.x0, y: 0, width: LARGEUR_VIDE, height: hauteur,
      fill: 'var(--texte)', opacity: '.085',
    }));
    // Deux bords fins : sans eux, deux replis voisins se confondraient en une seule bande.
    for (const bx of [s.x0, s.x0 + LARGEUR_VIDE]) {
      svg.append(el('line', {
        x1: bx, y1: 0, x2: bx, y2: hauteur,
        stroke: 'var(--texte)', 'stroke-width': 1, opacity: '.16',
      }));
    }
    // Le « ⋯ » se place sur la ligne des étiquettes de la règle, où rien ne le recouvre :
    // plus bas, les repères de requête passaient dessus.
    // Trois points ordinaires : le caractère d'ellipse médiane manque à certaines polices
    // et s'affichait en carré vide.
    const t = el('text', {
      x: s.x0 + LARGEUR_VIDE / 2, y: REGLE_BAS - 6, 'text-anchor': 'middle',
      fill: 'var(--texte)', 'font-size': '13', opacity: '.7', 'letter-spacing': '1',
    });
    t.textContent = '...';
    t.append(el('title', {}, document.createTextNode(
      'temps mort replié : ' + duree(s.t1 - s.t0) + '\nde ' + heure(s.t0) + '\nà ' + heure(s.t1))));
    svg.append(t);
  }

  // L'instant présent, quand la session tourne encore : la ligne du temps doit avancer
  // même lorsque rien ne se produit (§7 du cahier des charges).
  if (d.sessionVivante) {
    const x = axe.x(Math.min(Date.now(), d.fin));
    svg.append(el('line', {
      x1: x, y1: REGLE_BAS + 2, x2: x, y2: hauteur,
      stroke: 'var(--en-cours)', 'stroke-width': 1.4, opacity: '.8',
    }));
    const marque = el('text', {
      x: x - 4, y: REGLE_BAS + 14, 'text-anchor': 'end', fill: 'var(--en-cours)',
      'font-size': '9',
    });
    marque.textContent = 'maintenant';
    svg.append(marque);
  }

  // Les compactages : l'instant où l'agent perd le détail de sa mémoire. C'est le fait le
  // moins intuitif du fonctionnement d'un agent, il mérite un repère franc.
  for (const a of d.agents) {
    for (const k of a.compactages || []) {
      if (k.instant === null) continue;
      const x = axe.x(k.instant);
      const g = el('g', {});
      g.append(el('line', {
        x1: x, y1: REGLE_BAS + 2, x2: x, y2: hauteur,
        stroke: 'var(--compact)', 'stroke-width': 1.2, 'stroke-dasharray': '2 3',
        opacity: '.85',
      }));
      const et = el('text', {
        x: x + 3, y: REGLE_BAS + 16, fill: 'var(--compact)', 'font-size': '8.5',
      });
      et.textContent = '⟲';
      g.append(et);
      g.append(el('title', {}, document.createTextNode(
        'compactage — ' + heure(k.instant)
        + "\nla conversation est résumée ici : l'agent perd le détail de ce qui précède")));
      svg.append(g);
    }
    for (const err of a.erreurs || []) {
      if (err.instant === null) continue;
      const x = axe.x(err.instant);
      const g = el('g', {});
      g.append(el('line', {
        x1: x, y1: REGLE_BAS + 2, x2: x, y2: hauteur, stroke: 'var(--panne)',
        'stroke-width': 1.2, opacity: '.8',
      }));
      g.append(el('circle', { cx: x, cy: REGLE_BAS + 8, r: 3, fill: 'var(--panne)' }));
      g.append(el('title', {}, document.createTextNode(
        'panne — ' + heure(err.instant) + '\n' + err.texte)));
      svg.append(g);
    }
  }

  // Les requêtes d'Yves : des repères verticaux traversant toutes les voies.
  //
  // La pastille porte le clic, et elle doit donc être attrapable. Le trait fait un pixel
  // de large et la pastille faisait 3,5 de rayon : viser sept pixels à la souris sur une
  // piste dense est un exercice d'adresse. On sépare donc ce qu'on **voit** de ce qu'on
  // **attrape**, comme le fait déjà la voie des outils — une prise transparente, plus
  // large que la marque.
  //
  // Les repères sont dessinés AVANT les voies, donc une marque d'outil qui tombe au même
  // endroit reste au-dessus et garde son clic : la prise élargie n'attrape que le vide.
  // ⚠️ La prise ne peut pas être généreuse sans borne. Mesuré sur une session de 76
  // requêtes vue en entier : l'écart médian entre deux repères est de **3 pixels**, et
  // 65 paires sur 75 sont plus proches que la prise qu'on voudrait leur donner. Une prise
  // fixe y volerait le clic du voisin. On la borne donc à la moitié de la distance au
  // repère le plus proche : serrés, les repères gardent chacun leur part ; isolés — le
  // cas où l'on vise vraiment — ils retrouvent toute la prise.
  const xRequetes = d.requetes.filter((r) => r.instant !== null).map((r) => axe.x(r.instant));
  const triees = [...xRequetes].sort((a2, b2) => a2 - b2);
  // La demi-distance au voisin le plus proche : deux prises se touchent alors sans jamais
  // se mordre. Le plancher de 2 px garde une cible minimale ; en dessous de 4 px d'écart
  // les pastilles se confondent déjà à l'œil et aucune prise ne saurait les démêler — à
  // ce zoom-là on ne vise pas un repère, on en regarde la densité.
  const prisePour = (x) => {
    const i = triees.indexOf(x);
    const avant = i > 0 ? x - triees[i - 1] : Infinity;
    const apres = i < triees.length - 1 ? triees[i + 1] - x : Infinity;
    return Math.max(2, Math.min(13, Math.min(avant, apres) / 2));
  };
  for (const r of d.requetes) {
    if (r.instant === null) continue;
    const x = axe.x(r.instant);
    const prise = prisePour(x);
    const g = el('g', { class: 'repere-requete' });
    g.append(el('line', {
      x1: x, y1: REGLE_BAS + 4, x2: x, y2: hauteur,
      stroke: 'var(--requete)', 'stroke-width': 1, opacity: '.55',
    }));
    g.append(el('circle', {
      class: 'pastille-requete', cx: x, cy: REGLE_BAS + 11, r: 5.5, fill: 'var(--requete)',
    }));
    // Les deux prises : tout le long du trait, et plus généreusement sur la pastille.
    g.append(el('line', {
      x1: x, y1: REGLE_BAS + 4, x2: x, y2: hauteur,
      stroke: 'transparent', 'stroke-width': prise * 2,
    }));
    g.append(el('circle', { cx: x, cy: REGLE_BAS + 11, r: prise, fill: 'transparent' }));
    g.append(el('title', {}, document.createTextNode(
      'requête — ' + heure(r.instant) + '\n\n' + (r.texte || '').slice(0, 400))));
    g.style.cursor = 'pointer';
    g.addEventListener('click', () => carteRequete(r));
    svg.append(g);
  }

  voies.forEach((v, i) => {
    const centre = MARGE_HAUT + i * HAUTEUR_VOIE + HAUTEUR_VOIE / 2;
    if (v.genre === 'contexte') {
      svg.append(dessinerVoieContexte(v.agent, centre, axe, refContexte()));
      return;
    }
    if (v.genre === 'buffer') {
      svg.append(dessinerVoieBuffer(v.agent, centre, axe, visible));
      return;
    }
    if (v.genre === 'contenu') {
      svg.append(dessinerVoieContenu(v.agent, centre, axe, visible));
      return;
    }
    if (v.genre === 'tours') {
      svg.append(dessinerVoieTours(v.agent, centre, axe, visible));
      return;
    }
    if (v.genre === 'outils') {
      svg.append(dessinerVoieOutils(v.agent, centre, axe, visible));
      return;
    }
    if (v.genre === 'reflexion') {
      svg.append(dessinerVoieReflexion(v.agent, centre, axe, visible));
      return;
    }
    if (v.genre === 'fichiers') {
      svg.append(dessinerVoieFichiers(v.agent, centre, axe, visible));
      return;
    }
    if (v.genre === 'outillage') {
      svg.append(dessinerVoieOutillage(v.agent, centre, axe, visible));
      return;
    }
    if (v.genre === 'hooks') {
      svg.append(dessinerVoieHooks(v.agent, centre, axe, visible));
      return;
    }
    if (v.genre === 'modele') {
      svg.append(dessinerVoieModele(v.agent, v.modele, centre, axe, visible));
      return;
    }
    if (v.genre === 'attente') {
      svg.append(dessinerVoieAttente(v.agent, centre, axe, visible));
      return;
    }
    if (v.genre === 'boucles') { svg.append(dessinerVoieBoucles(v.agent, centre, axe)); return; }
    const a = v.agent;
    // La voie se partage en deux : la barre de l'agent au-dessus, la bande de durée des
    // appels d'outils en dessous. L'ensemble reste centré sur la voie.
    const y = centre - HAUTEUR_BARRE / 2;
    const x0 = a.debut === null ? 0 : axe.x(a.debut);
    const finEffective = a.fin ?? d.fin;
    const x1 = Math.max(x0 + 2, axe.x(finEffective));
    const g = el('g', { class: a.id === vise ? 'vise-barre' : '' });

    // La barre de l'agent. Terminé : grisé. En cours : bord droit ouvert, en pointillés.
    g.append(el('rect', {
      x: x0, y, width: x1 - x0, height: HAUTEUR_BARRE, rx: 3,
      fill: couleurEtat(a.etat),
      opacity: a.etat === 'terminé' ? '.55' : '.85',
      ...(a.fin === null ? { 'stroke-dasharray': '3 2', stroke: couleurEtat(a.etat) } : {}),
    }));
    g.append(el('title', {}, document.createTextNode(
      a.nom + '\n' + a.etat + (a.arrierePlan ? ' (arrière-plan)' : '')
      + '\nprofondeur ' + a.profondeur
      + '\ndébut ' + (a.debut ? heure(a.debut) : '—')
      + '\ndurée ' + duree(a.dureeMs)
      + (a.modele ? '\nmodèle ' + a.modele : '')
      + '\n' + a.outils.length + " appel(s) d'outil")));

    g.addEventListener('click', () => { vise = a.id; dessiner(); carteAgent(a); });
    svg.append(g);
  });

  elPiste.replaceChildren(svg);
}

// ------------------------------------------------------------------------- les cartes

const elPanneau = document.getElementById('panneau');
const elBoite = document.getElementById('panneauBoite');

// Cliquer le fond, hors de la boîte, referme la modale.
elPanneau.addEventListener('click', (e) => { if (e.target === elPanneau) fermerPanneau(); });

function ligne(dl, cle, valeur, mono) {
  if (valeur === null || valeur === undefined || valeur === '') return;
  const dt = document.createElement('dt'); dt.textContent = cle;
  const dd = document.createElement('dd');
  if (mono) { const c = document.createElement('code'); c.textContent = valeur; dd.append(c); }
  else dd.textContent = valeur;
  dl.append(dt, dd);
}

/**
 * Une barre de recherche au-dessus d'un bloc de texte. Elle surligne toutes les
 * occurrences, les compte, et permet de sauter de l'une à l'autre — un résultat d'outil
 * fait couramment plusieurs milliers de caractères, et y chercher à l'œil est pénible.
 */
function barreRecherche(pre, texte) {
  const barre = document.createElement('div');
  barre.className = 'recherche';
  const champ = document.createElement('input');
  champ.type = 'search';
  champ.placeholder = 'chercher dans ce texte…';
  champ.spellcheck = false;
  const precedent = document.createElement('button');
  precedent.textContent = '↑';
  precedent.title = 'occurrence précédente';
  const suivant = document.createElement('button');
  suivant.textContent = '↓';
  suivant.title = 'occurrence suivante  (Entrée)';
  const compte = document.createElement('span');
  compte.className = 'compte';
  barre.append(champ, precedent, suivant, compte);

  let marques = [];
  let rang = -1;

  const viser = (n) => {
    if (!marques.length) return;
    rang = (n + marques.length) % marques.length;
    marques.forEach((m, i) => m.classList.toggle('vise', i === rang));
    marques[rang].scrollIntoView({ block: 'center' });
    compte.textContent = (rang + 1) + ' sur ' + marques.length;
  };

  const chercher = () => {
    const terme = champ.value;
    marques = [];
    rang = -1;
    if (!terme) {
      pre.textContent = texte;
      compte.textContent = '';
      precedent.disabled = true;
      suivant.disabled = true;
      return;
    }
    // On reconstruit le contenu en nœuds plutôt qu'en HTML : le texte peut contenir
    // n'importe quoi, et l'échapper à la main est une source d'ennuis.
    const bas = texte.toLowerCase();
    const cible = terme.toLowerCase();
    const bouts = [];
    let i = 0;
    for (;;) {
      const j = bas.indexOf(cible, i);
      if (j < 0) { bouts.push(document.createTextNode(texte.slice(i))); break; }
      if (j > i) bouts.push(document.createTextNode(texte.slice(i, j)));
      const m = document.createElement('mark');
      m.textContent = texte.slice(j, j + terme.length);
      bouts.push(m);
      marques.push(m);
      i = j + terme.length;
    }
    pre.replaceChildren(...bouts);
    compte.textContent = marques.length
      ? marques.length + (marques.length > 1 ? ' trouvées' : ' trouvée')
      : 'rien trouvé';
    precedent.disabled = marques.length === 0;
    suivant.disabled = marques.length === 0;
    if (marques.length) viser(0);
  };

  champ.addEventListener('input', chercher);
  champ.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    viser(rang + (e.shiftKey ? -1 : 1));
  });
  precedent.addEventListener('click', () => viser(rang - 1));
  suivant.addEventListener('click', () => viser(rang + 1));
  precedent.disabled = true;
  suivant.disabled = true;
  return barre;
}

/**
 * Un bloc dépliable. Ouvert par défaut : ce qu'un agent a reçu et rendu, ou ce qu'un outil
 * a pris et renvoyé, est le contenu principal de la carte — le replier imposait un clic
 * pour voir l'essentiel. La hauteur reste bornée, chaque bloc ayant son propre ascenseur.
 */
/**
 * Un bloc repliable.
 *
 * `console` le rend comme un terminal : fond sombre dans les deux thèmes, bandeau
 * d'invite, et la sortie dans un gris plus doux que la commande. `console.invite` est le
 * glyphe à afficher — « $ » pour un shell — et `console.libelle` ce qu'on en dit.
 *
 * ⚠️ Le contenu du `<pre>` reste **exact** : l'invite vit dans le bandeau, jamais dans le
 * texte. Sans quoi un copier-coller rapporterait une commande fausse.
 */
function blocReplie(titre, contenu, ouvert = true, console_ = null) {
  if (!contenu) return null;
  const d = document.createElement('details');
  d.className = 'bloc';
  if (ouvert) d.open = true;
  const s = document.createElement('summary');
  s.textContent = titre + '  (' + contenu.length + ' caractères)';
  const pre = document.createElement('pre');
  pre.textContent = contenu;
  const corps = contenu.length > 400 ? [barreRecherche(pre, contenu), pre] : [pre];

  if (console_) {
    const cadre = document.createElement('div');
    cadre.className = 'console' + (console_.genre ? ' ' + console_.genre : '');
    const bandeau = document.createElement('div');
    bandeau.className = 'bandeau';
    // Un terminal ne préfixe pas ce qu'il répond : la sortie n'a pas d'invite. C'est plus
    // fidèle, et ça évite de parier sur un glyphe que la police du poste n'aurait pas.
    const inv = document.createElement('span');
    inv.className = 'invite';
    inv.textContent = console_.invite || '';
    // pas d'étiquette vide : elle laisserait un décalage inexpliqué devant le libellé
    const lib = document.createElement('span');
    lib.textContent = console_.libelle || '';
    const cpt = document.createElement('span');
    cpt.className = 'compte';
    const n = contenu.split('\n').length;
    cpt.textContent = n + (n > 1 ? ' lignes' : ' ligne');
    bandeau.append(...(console_.invite ? [inv] : []), lib, cpt);
    cadre.append(bandeau, ...corps);
    d.append(s, cadre);
    return d;
  }

  // En deçà de quelques centaines de caractères, l'œil suffit et la barre encombre.
  d.append(s, ...corps);
  return d;
}

function ouvrirPanneau(genre, titre, elements) {
  if (genre !== 'boucle') iterationVisee = null;
  elBoite.replaceChildren();
  const fermer = document.createElement('button');
  fermer.className = 'fermer';
  fermer.textContent = '×';
  fermer.title = 'fermer (Échap)';
  fermer.addEventListener('click', fermerPanneau);
  const g = document.createElement('div'); g.className = 'genre'; g.textContent = genre;
  const h = document.createElement('h2'); h.textContent = titre;
  elBoite.append(fermer, g, h, ...elements.filter(Boolean));
  elPanneau.classList.add('ouvert');
  elBoite.scrollTop = 0;
}

/**
 * Amène une plage de temps dans la fenêtre si elle n'y est pas déjà : encadrer un tour
