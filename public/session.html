<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude N Works — ligne du temps</title>
<style>
  :root {
    --fond: #11131a; --fond-carte: #1a1d27; --trait: #2b3040;
    --texte: #e4e6ee; --texte-faible: #8d93a8;
    --accent: #7aa2f7;
    --en-cours: #7aa2f7; --termine: #4a5170; --interrompu: #f7768e; --inconnu: #e0af68;
    --outil: #9ece6a; --outil-echec: #f7768e; --outil-agent: #bb9af7;
    --requete: #e0af68;
    --boucle: #2ac3de;
    --compact: #bb9af7;
    --panne: #f7768e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fond); color: var(--texte);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  header { padding: 1.2rem 1.5rem .9rem; border-bottom: 1px solid var(--trait); }
  header a { color: var(--texte-faible); text-decoration: none; font-size: .82rem; }
  header a:hover { color: var(--accent); }
  h1 { font-size: 1.15rem; margin: .4rem 0 .35rem; font-weight: 600; }
  .resume { color: var(--texte-faible); font-size: .83rem; }
  .resume b { color: var(--texte); font-weight: 600; }

  .reglages {
    display: flex; gap: 1.2rem; align-items: center; flex-wrap: wrap;
    padding: .7rem 1.5rem; border-bottom: 1px solid var(--trait);
    font-size: .8rem; color: var(--texte-faible);
  }
  .reglages label { display: flex; gap: .45rem; align-items: center; }
  input[type=range] { width: 11rem; accent-color: var(--accent); }
  .legende { display: flex; gap: .9rem; flex-wrap: wrap; margin-left: auto; }
  .legende span { display: flex; gap: .3rem; align-items: center; }
  .puce { width: .7rem; height: .7rem; border-radius: 2px; display: inline-block; }

  .cadre { display: grid; grid-template-columns: 19rem 1fr; height: calc(100vh - 11rem); }
  .arbre { border-right: 1px solid var(--trait); overflow: hidden; padding-top: 2.1rem; }
  .noeud {
    height: 2.2rem; display: flex; align-items: center; gap: .4rem;
    padding: 0 .7rem; cursor: pointer; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; font-size: .82rem;
  }
  .noeud:hover, .noeud.vise { background: var(--fond-carte); }
  .noeud .tiret { color: var(--trait); font-family: monospace; }
  .noeud .etiq { overflow: hidden; text-overflow: ellipsis; }
  .noeud .etat { margin-left: auto; font-size: .72rem; color: var(--texte-faible); }

  .piste { overflow: auto; position: relative; }
  svg { display: block; }
  .vise-barre { outline: 1px solid var(--accent); }
  .message { padding: 3rem 1.5rem; color: var(--texte-faible); }

  /* Le panneau des cartes : il recouvre la droite de la piste sans la faire bouger. */
  .panneau {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(31rem, 94vw);
    background: var(--fond-carte); border-left: 1px solid var(--trait);
    box-shadow: -14px 0 34px #0008; overflow-y: auto; padding: 1.2rem 1.3rem 3rem;
    display: none;
  }
  .panneau.ouvert { display: block; }
  .panneau .fermer {
    float: right; background: none; border: 0; color: var(--texte-faible);
    font-size: 1.3rem; cursor: pointer; line-height: 1; padding: 0 .2rem;
  }
  .panneau .fermer:hover { color: var(--texte); }
  .panneau .genre {
    font-size: .7rem; text-transform: uppercase; letter-spacing: .09em;
    color: var(--texte-faible);
  }
  .panneau h2 { font-size: 1.05rem; margin: .25rem 0 .9rem; font-weight: 600; }
  .panneau dl {
    display: grid; grid-template-columns: max-content 1fr; gap: .35rem 1rem;
    margin: 0 0 1rem; font-size: .82rem;
  }
  .panneau dt { color: var(--texte-faible); }
  .panneau dd { margin: 0; overflow-wrap: anywhere; }
  .panneau dd code { font-family: ui-monospace, Menlo, monospace; font-size: .95em; }
  .bloc { margin-top: 1rem; }
  .bloc > summary {
    cursor: pointer; font-size: .78rem; color: var(--texte-faible);
    text-transform: uppercase; letter-spacing: .07em; padding: .25rem 0;
  }
  .bloc > summary:hover { color: var(--texte); }
  .bloc pre {
    margin: .45rem 0 0; padding: .7rem .8rem; background: var(--fond);
    border: 1px solid var(--trait); border-radius: 6px;
    font: 12px/1.5 ui-monospace, Menlo, monospace;
    white-space: pre-wrap; overflow-wrap: anywhere; max-height: 24rem; overflow: auto;
  }
  .avert {
    margin-top: .6rem; font-size: .76rem; color: var(--inconnu); font-style: italic;
  }
  .bande { display: flex; flex-wrap: wrap; gap: 3px; margin: .5rem 0 .2rem; }
  .bande i {
    width: 15px; height: 22px; border-radius: 2px; cursor: pointer;
    background: var(--outil); position: relative;
  }
  .bande i.rien { background: var(--trait); }
  .bande i.vise { outline: 2px solid var(--accent); outline-offset: 1px; }
  .bande i:hover { filter: brightness(1.4); }
  .iteration {
    margin-top: .7rem; padding: .6rem .75rem; background: var(--fond);
    border: 1px solid var(--trait); border-radius: 6px; font-size: .82rem;
  }
  .iteration .quand { color: var(--texte-faible); font-size: .76rem; }
  .boutons-boucles { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .3rem; }
  .boutons-boucles button {
    background: var(--fond); border: 1px solid var(--trait); color: var(--texte);
    border-radius: 999px; padding: .12rem .6rem; font-size: .74rem; cursor: pointer;
    font-family: inherit;
  }
  .boutons-boucles button:hover { border-color: var(--accent); color: var(--accent); }
  .puces-outils { display: flex; flex-wrap: wrap; gap: .3rem; margin: .2rem 0 0; }
  .puces-outils span {
    background: var(--fond); border: 1px solid var(--trait); border-radius: 999px;
    padding: .1rem .55rem; font-size: .74rem;
  }
</style>
</head>
<body>
<header>
  <a href="/">← toutes les sessions</a>
  <h1 id="titre">…</h1>
  <div class="resume" id="resume"></div>
  <div class="resume"><span id="vivante" style="color:var(--en-cours)"></span></div>
</header>

<div class="reglages">
  <label>échelle
    <input type="range" id="zoom" min="0" max="100" value="0">
    <span id="zoomTexte"></span>
  </label>
  <label><input type="checkbox" id="replier" checked> replier les temps morts</label>
  <span id="replis"></span>
  <span id="boucles" style="display:flex;gap:.4rem;align-items:center"></span>
  <div class="legende">
    <span><i class="puce" style="background:var(--en-cours)"></i>en cours</span>
    <span><i class="puce" style="background:var(--termine)"></i>terminé</span>
    <span><i class="puce" style="background:var(--interrompu)"></i>interrompu</span>
    <span><i class="puce" style="background:var(--inconnu)"></i>fin inconnue</span>
    <span><i class="puce" style="background:var(--outil)"></i>outil</span>
    <span><i class="puce" style="background:var(--outil-agent)"></i>appel d'agent</span>
    <span><i class="puce" style="background:var(--requete)"></i>requête</span>
    <span><i class="puce" style="background:var(--boucle);border-radius:50%"></i>boucle</span>
    <span><i class="puce" style="background:var(--compact)"></i>compactage</span>
    <span><i class="puce" style="background:var(--panne);border-radius:50%"></i>panne</span>
  </div>
</div>

<div class="cadre">
  <div class="arbre" id="arbre"></div>
  <div class="piste" id="piste"><p class="message">Lecture du transcript…</p></div>
</div>

<aside class="panneau" id="panneau" aria-live="polite"></aside>

<script>
'use strict';

const SVGNS = 'http://www.w3.org/2000/svg';
const HAUTEUR_VOIE = 35.2;   // doit valoir la hauteur d'un nœud de l'arbre (2.2rem)
const MARGE_HAUT = 33.6;    // doit valoir le padding-top de l'arbre (2.1rem)
const HAUTEUR_BARRE = 16;
const LARGEUR_VIDE = 22;     // largeur donnée à un temps mort replié
const SEUIL_VIDE_MIN_MS = 60000; // on ne replie jamais un trou de moins d'une minute
const PART_VIDE = 400;      // ni un trou de moins d'un quatre-centième de la session

let deroule = null;
let vise = null;

const elTitre = document.getElementById('titre');
const elResume = document.getElementById('resume');
const elArbre = document.getElementById('arbre');
const elPiste = document.getElementById('piste');
const elZoom = document.getElementById('zoom');
const elZoomTexte = document.getElementById('zoomTexte');
const elReplier = document.getElementById('replier');
const elVivante = document.getElementById('vivante');
const elReplis = document.getElementById('replis');
const elBoucles = document.getElementById('boucles');

function duree(ms) {
  if (ms === null || ms === undefined) return '—';
  if (ms < 1000) return ms + ' ms';
  const s = ms / 1000;
  if (s < 90) return s.toFixed(1) + ' s';
  const m = s / 60;
  if (m < 90) return m.toFixed(0) + ' min';
  const h = m / 60;
  if (h < 48) return h.toFixed(1) + ' h';
  return (h / 24).toFixed(1) + ' j';
}
const heure = (ms) => new Date(ms).toLocaleString('fr-FR');

/**
 * L'axe du temps. Une session peut s'étaler sur onze jours tout en ne travaillant que par
 * courtes bouffées : à l'échelle linéaire, tout se tasse en traits invisibles. On découpe
 * donc le temps en segments actifs, à l'échelle, séparés par des temps morts repliés à
 * largeur fixe — et marqués comme tels, pour que rien ne disparaisse en silence.
 */
function seuilVide(debut, fin) {
  // Replier un trou d'une minute a du sens sur une session d'un quart d'heure, aucun sur
  // une session de onze jours : le seuil suit la durée totale.
  return Math.max(SEUIL_VIDE_MIN_MS, (fin - debut) / PART_VIDE);
}

function construireAxe(instants, debut, fin, pxParMs, replier) {
  if (!replier) {
    const total = Math.max(1, (fin - debut) * pxParMs);
    return {
      largeur: total,
      segments: [{ t0: debut, t1: fin, x0: 0, x1: total, vide: false }],
      x: (t) => (t - debut) * pxParMs,
      replies: 0,
      elide: 0,
    };
  }
  const seuil = seuilVide(debut, fin);
  const tries = [...new Set(instants)].sort((a, b) => a - b);
  const segments = [];
  let x = 0;
  let t0 = debut;
  let precedent = debut;
  let replies = 0;
  let elide = 0;
  for (const t of tries) {
    if (t - precedent > seuil) {
      replies += 1;
      elide += t - precedent;
      const largeur = (precedent - t0) * pxParMs;
      segments.push({ t0, t1: precedent, x0: x, x1: x + largeur, vide: false });
      x += largeur;
      segments.push({ t0: precedent, t1: t, x0: x, x1: x + LARGEUR_VIDE, vide: true });
      x += LARGEUR_VIDE;
      t0 = t;
    }
    precedent = Math.max(precedent, t);
  }
  const largeur = Math.max(1, (Math.max(precedent, fin) - t0) * pxParMs);
  segments.push({ t0, t1: Math.max(precedent, fin), x0: x, x1: x + largeur, vide: false });
  x += largeur;

  function projeter(t) {
    for (const s of segments) {
      if (t <= s.t1) {
        if (t < s.t0) return s.x0;
        if (s.vide) return s.x0 + LARGEUR_VIDE / 2;
        const p = s.t1 === s.t0 ? 0 : (t - s.t0) / (s.t1 - s.t0);
        return s.x0 + p * (s.x1 - s.x0);
      }
    }
    return x;
  }
  return { largeur: x, segments, x: projeter, replies, elide };
}

/** Le temps réellement occupé, trous repliés exclus : sert à calculer l'échelle juste. */
function tempsActif(instants, debut, fin) {
  const seuil = seuilVide(debut, fin);
  const tries = [...new Set(instants)].sort((a, b) => a - b);
  let actif = fin - debut;
  let n = 0;
  let precedent = debut;
  for (const t of tries) {
    if (t - precedent > seuil) { actif -= t - precedent; n += 1; }
    precedent = Math.max(precedent, t);
  }
  return { actif: Math.max(1, actif), n };
}

function tousLesInstants(d) {
  const ts = [];
  for (const a of d.agents) {
    if (a.debut !== null) ts.push(a.debut);
    if (a.fin !== null) ts.push(a.fin);
    for (const o of a.outils) {
      if (o.debut !== null) ts.push(o.debut);
      if (o.fin !== null) ts.push(o.fin);
    }
  }
  for (const r of d.requetes) if (r.instant !== null) ts.push(r.instant);
  return ts;
}

function couleurEtat(etat) {
  return etat === 'en cours' ? 'var(--en-cours)'
    : etat === 'interrompu' ? 'var(--interrompu)'
    : etat === 'fin inconnue' ? 'var(--inconnu)'
    : 'var(--termine)';
}

function el(nom, attrs, ...enfants) {
  const n = document.createElementNS(SVGNS, nom);
  for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
  for (const e of enfants) n.append(e);
  return n;
}

/**
 * Les voies de la piste : une par agent, et sous chaque agent qui en mène, une voie à part
 * pour ses boucles. Une boucle n'est pas un agent — elle n'a ni modèle ni outils — mais
 * elle occupe du temps, et c'est à ce titre qu'elle mérite sa propre ligne.
 */
function construireVoies() {
  const voies = [];
  for (const a of deroule.agents) {
    voies.push({ genre: 'agent', agent: a });
    if ((a.contexte || []).length > 1) voies.push({ genre: 'contexte', agent: a });
    if ((a.boucles || []).length) voies.push({ genre: 'boucles', agent: a });
  }
  return voies;
}

function dessinerArbre() {
  elArbre.replaceChildren(...construireVoies().map((v) => {
    const a = v.agent;
    const d = document.createElement('div');
    d.className = 'noeud' + (a.id === vise && v.genre === 'agent' ? ' vise' : '');
    const tiret = document.createElement('span');
    tiret.className = 'tiret';
    const puce = document.createElement('i');
    puce.className = 'puce';
    const etiq = document.createElement('span');
    etiq.className = 'etiq';
    const etat = document.createElement('span');
    etat.className = 'etat';

    if (v.genre === 'agent') {
      d.title = a.nom;
      tiret.textContent = a.profondeur === 0 ? '' : '│ '.repeat(a.profondeur - 1) + '└─';
      puce.style.background = couleurEtat(a.etat);
      etiq.textContent = a.nom;
      etat.textContent = a.outils.length + ' out.';
      d.addEventListener('click', () => { vise = a.id; dessiner(); carteAgent(a); });
    } else if (v.genre === 'contexte') {
      const pic = Math.max(...a.contexte.map((c) => c.jetons));
      d.title = 'taille du contexte — pic à ' + pic.toLocaleString('fr-FR') + ' jetons';
      tiret.textContent = '│ '.repeat(a.profondeur) + '▁ ';
      puce.style.background = 'linear-gradient(to top, #9ece6a, #e0af68, #f7768e)';
      etiq.textContent = 'contexte';
      etiq.style.color = 'var(--texte-faible)';
      etat.textContent = Math.round(pic / 1000) + ' k';
    } else {
      const n = a.boucles.length;
      const its = a.boucles.reduce((s, b) => s + b.iterations.length, 0);
      d.title = n + ' boucle(s), ' + its + ' itération(s)';
      tiret.textContent = '│ '.repeat(a.profondeur) + '↻ ';
      puce.style.background = 'var(--boucle)';
      puce.style.borderRadius = '50%';
      etiq.textContent = n > 1 ? n + ' boucles' : 'une boucle';
      etiq.style.color = 'var(--texte-faible)';
      etat.textContent = its + ' it.';
      d.addEventListener('click', () => carteBoucle(a.boucles[0], a, 0));
    }
    d.append(tiret, puce, etiq, etat);
    return d;
  }));
}

function dessinerPiste() {
  const d = deroule;
  const instants = tousLesInstants(d);
  if (d.sessionVivante) { d.fin = Math.max(d.fin, Date.now()); instants.push(Date.now()); }
  const span = Math.max(1, d.fin - d.debut);
  // L'échelle la plus large fait tenir toute la session dans la largeur réellement
  // disponible — et non dans une largeur supposée, qui déborderait. Les bandes de temps
  // mort occupent une place fixe : il faut la retrancher avant de calculer l'échelle.
  const dispo = Math.max(320, elPiste.clientWidth - 24);
  const { actif, n } = elReplier.checked
    ? tempsActif(instants, d.debut, d.fin)
    : { actif: span, n: 0 };
  const min = Math.max(dispo - n * LARGEUR_VIDE, dispo * 0.25) / actif;
  const max = Math.max(min * 2, 1 / 1000);
  const p = Number(elZoom.value) / 100;
  const pxParMs = min * Math.pow(max / min, p);
  elZoomTexte.textContent = pxParMs * 1000 >= 1
    ? (pxParMs * 1000).toFixed(1) + ' px/s'
    : (pxParMs * 60000).toFixed(1) + ' px/min';

  const axe = construireAxe(instants, d.debut, d.fin, pxParMs, elReplier.checked);
  elReplis.textContent = axe.replies
    ? axe.replies + ' temps mort' + (axe.replies > 1 ? 's' : '') + ' replié'
      + (axe.replies > 1 ? 's' : '') + ', ' + duree(axe.elide) + ' élidée'
    : '';
  const voies = construireVoies();
  const hauteur = MARGE_HAUT + voies.length * HAUTEUR_VOIE + 20;
  const svg = el('svg', { width: Math.ceil(axe.largeur) + 2, height: hauteur });
  const defs = el('defs', {});
  const degrade = el('linearGradient', {
    id: 'degrade-contexte', x1: '0', y1: '1', x2: '0', y2: '0',
  });
  degrade.append(
    el('stop', { offset: '0%', 'stop-color': '#9ece6a' }),
    el('stop', { offset: '55%', 'stop-color': '#e0af68' }),
    el('stop', { offset: '100%', 'stop-color': '#f7768e' }),
  );
  defs.append(degrade);
  svg.append(defs);

  // Les temps morts repliés, en fond, avec la durée élidée écrite dessus.
  for (const s of axe.segments) {
    if (!s.vide) continue;
    svg.append(el('rect', {
      x: s.x0, y: 0, width: LARGEUR_VIDE, height: hauteur,
      fill: '#000', opacity: '.28',
    }));
    const t = el('text', {
      x: s.x0 + LARGEUR_VIDE / 2, y: 16, 'text-anchor': 'middle',
      fill: 'var(--texte-faible)', 'font-size': '8.5',
    });
    t.textContent = '⋯';
    t.append(el('title', {}, document.createTextNode(
      'temps mort replié : ' + duree(s.t1 - s.t0) + '\nde ' + heure(s.t0) + '\nà ' + heure(s.t1))));
    svg.append(t);
  }

  // L'instant présent, quand la session tourne encore : la ligne du temps doit avancer
  // même lorsque rien ne se produit (§7 du cahier des charges).
  if (d.sessionVivante) {
    const x = axe.x(Math.min(Date.now(), d.fin));
    svg.append(el('line', {
      x1: x, y1: 20, x2: x, y2: hauteur,
      stroke: 'var(--en-cours)', 'stroke-width': 1.4, opacity: '.8',
    }));
    const marque = el('text', {
      x: x - 4, y: 30, 'text-anchor': 'end', fill: 'var(--en-cours)', 'font-size': '9',
    });
    marque.textContent = 'maintenant';
    svg.append(marque);
  }

  // Les compactages : l'instant où l'agent perd le détail de sa mémoire. C'est le fait le
  // moins intuitif du fonctionnement d'un agent, il mérite un repère franc.
  for (const a of d.agents) {
    for (const k of a.compactages || []) {
      if (k.instant === null) continue;
      const x = axe.x(k.instant);
      const g = el('g', {});
      g.append(el('line', {
        x1: x, y1: 18, x2: x, y2: hauteur,
        stroke: 'var(--compact)', 'stroke-width': 1.2, 'stroke-dasharray': '2 3',
        opacity: '.85',
      }));
      const et = el('text', {
        x: x + 3, y: 30, fill: 'var(--compact)', 'font-size': '8.5',
      });
      et.textContent = '⟲';
      g.append(et);
      g.append(el('title', {}, document.createTextNode(
        'compactage — ' + heure(k.instant)
        + "\nla conversation est résumée ici : l'agent perd le détail de ce qui précède")));
      svg.append(g);
    }
    for (const err of a.erreurs || []) {
      if (err.instant === null) continue;
      const x = axe.x(err.instant);
      const g = el('g', {});
      g.append(el('line', {
        x1: x, y1: 18, x2: x, y2: hauteur, stroke: 'var(--panne)', 'stroke-width': 1.2,
        opacity: '.8',
      }));
      g.append(el('circle', { cx: x, cy: 18, r: 3, fill: 'var(--panne)' }));
      g.append(el('title', {}, document.createTextNode(
        'panne — ' + heure(err.instant) + '\n' + err.texte)));
      svg.append(g);
    }
  }

  // Les requêtes d'Yves : des repères verticaux traversant toutes les voies.
  for (const r of d.requetes) {
    if (r.instant === null) continue;
    const x = axe.x(r.instant);
    const g = el('g', {});
    g.append(el('line', {
      x1: x, y1: 20, x2: x, y2: hauteur,
      stroke: 'var(--requete)', 'stroke-width': 1, opacity: '.55',
    }));
    g.append(el('circle', { cx: x, cy: 20, r: 3.5, fill: 'var(--requete)' }));
    g.append(el('title', {}, document.createTextNode(
      'requête — ' + heure(r.instant) + '\n\n' + (r.texte || '').slice(0, 400))));
    g.style.cursor = 'pointer';
    g.addEventListener('click', () => carteRequete(r));
    svg.append(g);
  }

  voies.forEach((v, i) => {
    const centre = MARGE_HAUT + i * HAUTEUR_VOIE + HAUTEUR_VOIE / 2;
    if (v.genre === 'contexte') { svg.append(dessinerVoieContexte(v.agent, centre, axe)); return; }
    if (v.genre === 'boucles') { svg.append(dessinerVoieBoucles(v.agent, centre, axe)); return; }
    const a = v.agent;
    const y = centre - HAUTEUR_BARRE / 2;
    const x0 = a.debut === null ? 0 : axe.x(a.debut);
    const finEffective = a.fin ?? d.fin;
    const x1 = Math.max(x0 + 2, axe.x(finEffective));
    const g = el('g', { class: a.id === vise ? 'vise-barre' : '' });

    // La barre de l'agent. Terminé : grisé. En cours : bord droit ouvert, en pointillés.
    g.append(el('rect', {
      x: x0, y, width: x1 - x0, height: HAUTEUR_BARRE, rx: 3,
      fill: couleurEtat(a.etat),
      opacity: a.etat === 'terminé' ? '.55' : '.85',
      ...(a.fin === null ? { 'stroke-dasharray': '3 2', stroke: couleurEtat(a.etat) } : {}),
    }));
    g.append(el('title', {}, document.createTextNode(
      a.nom + '\n' + a.etat + (a.arrierePlan ? ' (arrière-plan)' : '')
      + '\nprofondeur ' + a.profondeur
      + '\ndébut ' + (a.debut ? heure(a.debut) : '—')
      + '\ndurée ' + duree(a.dureeMs)
      + (a.modele ? '\nmodèle ' + a.modele : '')
      + '\n' + a.outils.length + " appel(s) d'outil")));

    // Les appels d'outils : tous, un par un, à leur instant — §5 du cahier des charges.
    // La durée est une bande discrète posée sous la barre, l'instant de départ un trait
    // net : sans quoi un appel long, comme un appel d'agent, masquerait l'agent lui-même.
    for (const o of a.outils) {
      if (o.debut === null) continue;
      const ox = axe.x(o.debut);
      const largeur = o.fin !== null ? Math.max(1.5, axe.x(o.fin) - ox) : 1.5;
      const estAgent = o.nom === 'Agent' || o.nom === 'Task';
      const couleur = o.ok === false ? 'var(--outil-echec)'
        : estAgent ? 'var(--outil-agent)' : 'var(--outil)';
      if (largeur > 2) {
        g.append(el('rect', {
          x: ox, y: y + HAUTEUR_BARRE, width: largeur, height: 4,
          fill: couleur, opacity: '.5',
        }));
      }
      g.append(el('rect', {
        x: ox, y: y - 3, width: 1.8, height: HAUTEUR_BARRE + 9, fill: couleur,
      }));
      const titre = el('rect', {
        x: ox - 2.5, y: y - 3, width: Math.max(6, largeur + 5), height: HAUTEUR_BARRE + 9,
        fill: 'transparent',
      });
      titre.append(el('title', {}, document.createTextNode(
        o.nom + (o.ok === false ? '  — ÉCHEC' : '')
        + '\n' + heure(o.debut) + '\ndurée ' + duree(o.dureeMs)
        + (o.resume ? '\n\n' + o.resume.slice(0, 300) : ''))));
      titre.style.cursor = 'pointer';
      titre.addEventListener('click', (e) => {
        e.stopPropagation();
        vise = a.id; dessiner();
        const b = o.boucle && (a.boucles || []).find((x) => x.id === o.boucle);
        if (b) carteBoucle(b, a, o.rang); else carteOutil(o, a);
      });
      g.append(titre);
    }

    g.addEventListener('click', () => { vise = a.id; dessiner(); carteAgent(a); });
    svg.append(g);
  });

  elPiste.replaceChildren(svg);
}

// ------------------------------------------------------------------------- les cartes

const elPanneau = document.getElementById('panneau');

function ligne(dl, cle, valeur, mono) {
  if (valeur === null || valeur === undefined || valeur === '') return;
  const dt = document.createElement('dt'); dt.textContent = cle;
  const dd = document.createElement('dd');
  if (mono) { const c = document.createElement('code'); c.textContent = valeur; dd.append(c); }
  else dd.textContent = valeur;
  dl.append(dt, dd);
}

/** Un bloc replié par défaut : un prompt ou une sortie peut faire des pages (§6.4). */
function blocReplie(titre, contenu, ouvert) {
  if (!contenu) return null;
  const d = document.createElement('details');
  d.className = 'bloc';
  if (ouvert) d.open = true;
  const s = document.createElement('summary');
  s.textContent = titre + '  (' + contenu.length + ' caractères)';
  const pre = document.createElement('pre');
  pre.textContent = contenu;
  d.append(s, pre);
  return d;
}

function ouvrirPanneau(genre, titre, elements) {
  elPanneau.replaceChildren();
  const fermer = document.createElement('button');
  fermer.className = 'fermer';
  fermer.textContent = '×';
  fermer.title = 'fermer (Échap)';
  fermer.addEventListener('click', fermerPanneau);
  const g = document.createElement('div'); g.className = 'genre'; g.textContent = genre;
  const h = document.createElement('h2'); h.textContent = titre;
  elPanneau.append(fermer, g, h, ...elements.filter(Boolean));
  elPanneau.classList.add('ouvert');
  elPanneau.scrollTop = 0;
}

function fermerPanneau() {
  elPanneau.classList.remove('ouvert');
  elPanneau.replaceChildren();
}

/** Carte d'agent — §6.1. Chaque champ absent est omis, jamais inventé. */
function carteAgent(a) {
  const dl = document.createElement('dl');
  ligne(dl, 'État', a.etat + (a.arrierePlan ? '  (lancé en arrière-plan)' : ''));
  ligne(dl, 'Type d’agent', a.type);
  ligne(dl, 'Profondeur', a.profondeur === 0 ? 'agent racine' : String(a.profondeur));
  const parent = a.parent && a.parent !== 'racine'
    ? (deroule.agents.find((x) => x.id === a.parent)?.nom || a.parent)
    : (a.profondeur === 0 ? null : 'agent racine');
  ligne(dl, 'Lancé par', parent);
  ligne(dl, 'Début', a.debut ? heure(a.debut) : null);
  ligne(dl, 'Fin', a.fin ? heure(a.fin) : (a.etat === 'en cours' ? 'pas encore' : 'inconnue'));
  ligne(dl, 'Durée', duree(a.dureeMs));
  ligne(dl, 'Modèle', a.modele, true);
  ligne(dl, 'Effort', a.effort);
  ligne(dl, 'Jetons', a.jetons !== null && a.jetons !== undefined ? a.jetons.toLocaleString('fr-FR') : null);
  ligne(dl, 'Appels d’outils', String(a.outils.length));
  const enfants = deroule.agents.filter((x) => x.parent === a.id).length;
  ligne(dl, 'Sous-agents lancés', enfants ? String(enfants) : null);
  if (a.statutBrut && a.statutBrut !== 'completed') ligne(dl, 'Statut brut', a.statutBrut, true);

  const morceaux = [dl];

  // Les outils réellement employés, comptés — et non la liste des outils offerts, qui
  // n'est presque jamais disponible (C2 d'OBSERVATIONS-FORMAT.md).
  const parNom = {};
  for (const o of a.outils) parNom[o.nom] = (parNom[o.nom] || 0) + 1;
  const noms = Object.entries(parNom).sort((x, y) => y[1] - x[1]);
  if (noms.length) {
    const bloc = document.createElement('div');
    bloc.className = 'bloc';
    const s = document.createElement('div');
    s.style.cssText = 'font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--texte-faible)';
    s.textContent = 'outils employés';
    const puces = document.createElement('div');
    puces.className = 'puces-outils';
    for (const [nom, n] of noms) {
      const sp = document.createElement('span');
      sp.textContent = nom + ' × ' + n;
      puces.append(sp);
    }
    bloc.append(s, puces);
    morceaux.push(bloc);
  }

  if ((a.skillsCharges || []).length) {
    const bloc = document.createElement('div');
    bloc.className = 'bloc';
    const s = document.createElement('div');
    s.style.cssText = 'font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--texte-faible)';
    s.textContent = 'skills réellement chargés';
    const puces = document.createElement('div');
    puces.className = 'puces-outils';
    const vus = new Map();
    for (const sk of a.skillsCharges) {
      if (!vus.has(sk.nom)) vus.set(sk.nom, { n: 0, taille: sk.taille, chemin: sk.chemin });
      vus.get(sk.nom).n += 1;
    }
    for (const [nom, info] of vus) {
      const sp = document.createElement('span');
      sp.textContent = nom + (info.n > 1 ? ' × ' + info.n : '');
      sp.title = (info.chemin || '') + (info.taille ? '  —  ' + info.taille + ' caractères chargés' : '');
      puces.append(sp);
    }
    bloc.append(s, puces);
    morceaux.push(bloc);
  }
  if ((a.erreurs || []).length) {
    const p = document.createElement('p');
    p.className = 'avert';
    p.textContent = a.erreurs.length + ' panne(s) pendant son travail : '
      + a.erreurs.map((e) => e.texte.replace(/^API Error:\s*/, '')).join(' · ');
    morceaux.push(p);
  }
  morceaux.push(blocReplie('entrée — le prompt reçu', a.prompt));
  morceaux.push(blocReplie('sortie — sa réponse finale', a.sortie));

  if (a.etat === 'fin inconnue') {
    const p = document.createElement('p');
    p.className = 'avert';
    p.textContent = "Aucun marqueur de fin n'a été écrit et la session ne tourne plus : "
      + "cet agent a été coupé net. L'instant affiché est sa dernière trace, pas sa fin.";
    morceaux.push(p);
  }
  ouvrirPanneau(a.profondeur === 0 ? 'agent racine' : 'sous-agent', a.nom, morceaux);
}

/** Carte d'un appel d'outil — §6.4 — ou d'un skill — §6.2. */
function carteOutil(o, agent) {
  const estSkill = Boolean(o.skill);
  const dl = document.createElement('dl');
  if (estSkill) ligne(dl, 'Skill', o.skill, true);
  ligne(dl, 'Outil', o.nom, true);
  ligne(dl, 'Appelé par', agent.nom);
  ligne(dl, 'Instant', o.debut ? heure(o.debut) : null);
  ligne(dl, 'Durée', o.fin !== null ? duree(o.dureeMs) : 'sans résultat enregistré');
  // Un résultat sans drapeau d'erreur est le cas ordinaire : on omet la ligne plutôt que
  // d'afficher « inconnue » sur presque tous les appels.
  ligne(dl, 'Issue', o.ok === false ? 'échec' : o.ok === true ? 'succès' : null);

  const morceaux = [dl,
    blocReplie(estSkill ? 'consigne donnée au skill' : 'entrée', o.entree),
    blocReplie('résultat', o.sortie)];

  // Le contenu que le skill a réellement injecté : ce que l'appel seul ne dit pas.
  if (estSkill) {
    const charge = (agent.skillsCharges || [])
      .filter((s) => s.nom === o.skill)
      .sort((x, y) => Math.abs(x.instant - o.debut) - Math.abs(y.instant - o.debut))[0];
    if (charge) {
      ligne(dl, 'Chargé depuis', charge.chemin, true);
      ligne(dl, 'Taille chargée', charge.taille + ' caractères');
      const tronqueSkill = charge.taille && charge.taille > charge.contenu.length;
      morceaux.push(blocReplie(
        'instructions réellement chargées' + (tronqueSkill ? ' — extrait' : ''),
        charge.contenu));
      if (tronqueSkill) {
        const p = document.createElement('p');
        p.className = 'avert';
        p.textContent = 'Le skill fait ' + charge.taille
          + ' caractères ; l’extrait ci-dessus s’arrête à ' + charge.contenu.length + '.';
        morceaux.push(p);
      }
    }
  }

  if (o.tronque) {
    const p = document.createElement('p');
    p.className = 'avert';
    p.textContent = "Entrée ou résultat tronqués à 700 caractères : le transcript en "
      + 'contient davantage.';
    morceaux.push(p);
  }

  ouvrirPanneau(estSkill ? 'skill' : "appel d'outil",
    estSkill ? o.skill : o.nom + (o.resume ? ' — ' + o.resume.slice(0, 60) : ''),
    morceaux);
}

/**
 * Carte de boucle — §6.3. Ce qu'elle doit rendre visible : la répétition, et l'avancement
 * dans cette répétition.
 */
function carteBoucle(b, agent, rangVise) {
  const dl = document.createElement('dl');
  ligne(dl, 'État', b.etat);
  ligne(dl, 'Agent', agent.nom);
  ligne(dl, 'Itérations', String(b.iterations.length));
  ligne(dl, 'Sans effet', b.sansEffet
    ? b.sansEffet + ' sur ' + b.iterations.length
      + (b.sansEffetALaFin ? '  —  dont ' + b.sansEffetALaFin + ' de suite à la fin' : '')
    : 'aucune');
  ligne(dl, 'Début', b.debut ? heure(b.debut) : null);
  ligne(dl, 'Fin', b.fin ? heure(b.fin) : 'pas encore');
  ligne(dl, 'Durée', duree((b.fin ?? Date.now()) - b.debut));
  ligne(dl, 'Ouverte par', b.source === 'skill'
    ? 'un appel du skill loop'
    : "aucun appel de skill — consigne relue dans le réveil");

  const morceaux = [dl];

  const titreBande = document.createElement('div');
  titreBande.style.cssText = 'font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--texte-faible);margin-top:1rem';
  titreBande.textContent = 'la répétition — une case par itération, dans l’ordre';
  const bande = document.createElement('div');
  bande.className = 'bande';
  const detail = document.createElement('div');
  detail.className = 'iteration';

  function montrer(rang) {
    const it = b.iterations[rang];
    [...bande.children].forEach((c, i) => c.classList.toggle('vise', i === rang));
    detail.replaceChildren();
    const titre = document.createElement('div');
    titre.innerHTML = '';
    titre.append(document.createTextNode(
      'itération ' + (rang + 1) + ' sur ' + b.iterations.length
      + ' — ' + (it.noop ? "rien n'a changé" : 'quelque chose a été produit')));
    titre.style.fontWeight = '600';
    const quand = document.createElement('div');
    quand.className = 'quand';
    let texte = heure(it.instant);
    if (it.delaiS) texte += '  ·  réveil demandé dans ' + duree(it.delaiS * 1000);
    // Le délai demandé n'est pas le délai subi : scheduled_task_fire dit quand le réveil
    // a vraiment eu lieu.
    if (it.attenteMs) {
      texte += '  ·  réveillé après ' + duree(it.attenteMs);
      if (it.delaiS) {
        const ecart = it.attenteMs - it.delaiS * 1000;
        if (Math.abs(ecart) > 30000) {
          texte += ' (' + (ecart > 0 ? '+' : '−') + duree(Math.abs(ecart)) + ')';
        }
      }
    }
    quand.textContent = texte;
    const raison = document.createElement('div');
    raison.style.marginTop = '.35rem';
    raison.textContent = it.raison || '(aucune raison donnée)';
    detail.append(titre, quand, raison);
  }

  b.iterations.forEach((it, rang) => {
    const c = document.createElement('i');
    c.className = it.noop ? 'rien' : '';
    c.title = 'itération ' + (rang + 1) + (it.noop ? " — rien n'a changé" : '');
    c.addEventListener('click', () => montrer(rang));
    bande.append(c);
  });

  const legende = document.createElement('div');
  legende.style.cssText = 'font-size:.74rem;color:var(--texte-faible);margin-top:.15rem';
  legende.textContent = 'case pleine : quelque chose a été produit · case grise : rien n’a changé';

  morceaux.push(titreBande, bande, legende, detail,
    blocReplie('consigne de la boucle', b.consigne));
  ouvrirPanneau('boucle', b.consigne
    ? b.consigne.replace(/^\/loop\s*/, '').slice(0, 70)
    : 'boucle sans consigne retrouvée', morceaux);
  montrer(rangVise >= 0 && rangVise < b.iterations.length ? rangVise : 0);
}

function listerBoucles() {
  const toutes = [];
  for (const a of deroule.agents) for (const b of a.boucles || []) toutes.push([b, a]);
  if (!toutes.length) { elBoucles.replaceChildren(); return; }
  const titre = document.createElement('span');
  titre.textContent = toutes.length + (toutes.length > 1 ? ' boucles' : ' boucle') + ' :';
  const boutons = document.createElement('span');
  boutons.className = 'boutons-boucles';
  toutes.forEach(([b, a], i) => {
    const bt = document.createElement('button');
    bt.textContent = '#' + (i + 1) + ' · ' + b.iterations.length + ' it.';
    bt.title = (b.consigne || '').slice(0, 160);
    bt.addEventListener('click', () => carteBoucle(b, a, 0));
    boutons.append(bt);
  });
  elBoucles.replaceChildren(titre, boutons);
}

function carteRequete(r) {
  ouvrirPanneau('requête', heure(r.instant), [blocReplie('texte', r.texte, true)]);
}

/**
 * La taille du contexte, en aire remplie d'un dégradé vertical : vert en bas quand il
 * reste de la place, rouge en haut quand la fenêtre sature. Le dégradé étant vertical,
 * c'est la hauteur de la courbe qui décide de la couleur — pas de calcul par point.
 *
 * La référence est le plus haut niveau atteint dans la session. Quand la session a connu
 * un compactage, ce pic **est** la fenêtre réelle, puisque c'est lui qui l'a déclenché.
 */
function dessinerVoieContexte(agent, centre, axe) {
  const g = el('g', {});
  const points = agent.contexte;
  const pic = Math.max(...points.map((c) => c.jetons), 1);
  const haut = centre - 13;
  const bas = centre + 13;
  const y = (jetons) => bas - (jetons / pic) * (bas - haut);

  const chemin = [];
  for (const c of points) chemin.push(`${axe.x(c.instant).toFixed(1)},${y(c.jetons).toFixed(1)}`);
  if (chemin.length < 2) return g;

  const x0 = axe.x(points[0].instant);
  const x1 = axe.x(points[points.length - 1].instant);
  g.append(el('polygon', {
    points: `${x0.toFixed(1)},${bas} ${chemin.join(' ')} ${x1.toFixed(1)},${bas}`,
    fill: 'url(#degrade-contexte)', opacity: '.8',
  }));
  g.append(el('polyline', {
    points: chemin.join(' '), fill: 'none',
    stroke: 'var(--texte)', 'stroke-width': .7, opacity: '.45',
  }));

  // Une prise par dixième de la largeur, pour lire une valeur au survol sans surcharger.
  const pas = Math.max(1, Math.floor(points.length / 60));
  for (let i = 0; i < points.length; i += pas) {
    const c = points[i];
    const px = axe.x(c.instant);
    const prise = el('rect', { x: px - 3, y: haut, width: 6, height: bas - haut, fill: 'transparent' });
    prise.append(el('title', {}, document.createTextNode(
      c.jetons.toLocaleString('fr-FR') + ' jetons de contexte  ('
      + Math.round((c.jetons / pic) * 100) + ' % du pic)\n' + heure(c.instant))));
    g.append(prise);
  }
  return g;
}

/**
 * Une boucle se dessine comme un rail, et non comme une barre d'agent : un trait fin bordé
 * de deux montants, avec une encoche par itération — pleine si quelque chose a été
 * produit, creuse si rien n'a changé. Les boucles d'un même agent ne se chevauchent jamais,
 * un arrêt fermant toujours la précédente.
 */
function dessinerVoieBoucles(agent, centre, axe) {
  const g = el('g', {});
  for (const b of agent.boucles) {
    const x0 = axe.x(b.debut);
    const x1 = Math.max(x0 + 3, axe.x(b.fin ?? deroule.fin));
    g.append(el('line', {
      x1: x0, y1: centre, x2: x1, y2: centre,
      stroke: 'var(--boucle)', 'stroke-width': 1.4, opacity: '.75',
      ...(b.etat === 'en cours' ? { 'stroke-dasharray': '4 3' } : {}),
    }));
    for (const x of [x0, x1]) {
      g.append(el('line', {
        x1: x, y1: centre - 6, x2: x, y2: centre + 6,
        stroke: 'var(--boucle)', 'stroke-width': 1.4,
      }));
    }
    for (const it of b.iterations) {
      const xi = axe.x(it.instant);
      g.append(el('rect', {
        x: xi - 1.4, y: centre - 4.5, width: 2.8, height: 9, rx: 1,
        fill: it.noop ? 'var(--fond)' : 'var(--boucle)',
        stroke: 'var(--boucle)', 'stroke-width': it.noop ? 1 : 0,
      }));
    }
    const prise = el('rect', {
      x: x0 - 2, y: centre - 9, width: (x1 - x0) + 4, height: 18, fill: 'transparent',
    });
    prise.style.cursor = 'pointer';
    prise.append(el('title', {}, document.createTextNode(
      (b.consigne || 'boucle').replace(/^\/loop\s*/, '').slice(0, 90)
      + '\n' + b.iterations.length + ' itération(s), ' + b.sansEffet + ' sans effet'
      + '\n' + b.etat + ' · ' + duree((b.fin ?? Date.now()) - b.debut))));
    prise.addEventListener('click', () => carteBoucle(b, agent, 0));
    g.append(prise);
  }
  return g;
}

function dessiner() {
  if (!deroule) return;
  dessinerArbre();
  dessinerPiste();
}

// `deroule` commence vide : c'est le flux qui le remplit.


function resumer(d) {
  const outils = d.agents.reduce((n, a) => n + a.outils.length, 0);
  const sousAgents = d.agents.length - 1;
  const parEtat = {};
  for (const a of d.agents) parEtat[a.etat] = (parEtat[a.etat] || 0) + 1;
  elResume.innerHTML = '';
  const bout = (t) => { const s = document.createElement('span'); s.textContent = t; return s; };
  const fort = (t) => { const b = document.createElement('b'); b.textContent = t; return b; };
  elResume.append(
    fort(sousAgents + ' sous-agent' + (sousAgents > 1 ? 's' : '')), bout(' · '),
    fort(outils + " appel" + (outils > 1 ? 's' : '') + " d'outil"), bout(' · '),
    fort(d.requetes.length + ' requête' + (d.requetes.length > 1 ? 's' : '')), bout(' · '),
    bout('du ' + heure(d.debut) + ' au ' + heure(d.fin)), bout(' · '),
    bout(duree(d.fin - d.debut)), bout(' · '),
    bout(Object.entries(parEtat).map(([k, v]) => v + ' ' + k).join(', ')),
  );
}

const id = new URLSearchParams(location.search).get('id');

/**
 * Le suivi d'une session vivante. Le serveur n'envoie que lorsque le transcript a bougé ;
 * on redessine alors en conservant la position de défilement et la carte ouverte, sans
 * quoi l'écran sauterait sous les doigts à chaque ligne écrite.
 */
function appliquerDeroule(d) {
  const premiereFois = deroule === null;
  const defil = elPiste.scrollLeft;
  const carteOuverte = elPanneau.classList.contains('ouvert');
  deroule = d;
  if (premiereFois) {
    elTitre.textContent = (d.session && d.session.nom) || d.agents[0]?.nom || id;
  }
  elVivante.textContent = d.sessionVivante ? '· en direct' : '';
  resumer(d);
  listerBoucles();
  dessiner();
  elPiste.scrollLeft = defil;
  if (carteOuverte) elPanneau.classList.add('ouvert');
}

function echouer(message) {
  elPiste.replaceChildren();
  const p = document.createElement('p');
  p.className = 'message';
  p.textContent = 'Impossible de lire cette session : ' + message;
  elPiste.append(p);
}

const fluxSession = new EventSource('/flux-session?id=' + encodeURIComponent(id || ''));
fluxSession.addEventListener('message', (e) => {
  try {
    const d = JSON.parse(e.data);
    if (d.erreur) { echouer(d.erreur); return; }
    appliquerDeroule(d);
  } catch (err) { console.error(err); }
});
fluxSession.addEventListener('error', () => {
  if (!deroule) echouer('le flux ne répond pas');
});

// Même quand rien ne se produit, le temps passe : le repère « maintenant » doit glisser.
setInterval(() => {
  if (deroule && deroule.sessionVivante) dessinerPiste();
}, 1000);

elZoom.addEventListener('input', dessiner);
addEventListener('resize', dessiner);
addEventListener('keydown', (e) => { if (e.key === 'Escape') fermerPanneau(); });
elReplier.addEventListener('change', dessiner);
// L'arbre et les voies doivent rester alignés quand on fait défiler.
elPiste.addEventListener('scroll', () => { elArbre.scrollTop = elPiste.scrollTop; });
</script>
</body>
</html>
