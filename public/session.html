 * qu'on ne voit pas ne sert à rien. On ne bouge pas si la plage est déjà visible, pour ne
 * pas faire sauter l'écran sous les doigts.
 */
function amenerEnVue(t0, t1) {
  if (!axeCourant) return;
  const x0 = axeCourant.x(t0);
  const x1 = axeCourant.x(t1);
  const gauche = elPiste.scrollLeft;
  const droite = gauche + elPiste.clientWidth;
  if (x0 >= gauche && x1 <= droite) return;
  elPiste.scrollLeft = Math.max(0, (x0 + x1) / 2 - elPiste.clientWidth / 2);
}

function fermerPanneau() {
  elPanneau.classList.remove('ouvert');
  elBoite.replaceChildren();
  iterationVisee = null;
  if (boucleVisee !== null) {
    boucleVisee = null;
    if (elChoixBoucle) elChoixBoucle.value = '';
    if (deroule) dessinerPiste();
  }
}

/** Carte d'agent — §6.1. Chaque champ absent est omis, jamais inventé. */
function carteAgent(a) {
  const dl = document.createElement('dl');
  ligne(dl, 'État', a.etat + (a.arrierePlan ? '  (lancé en arrière-plan)' : ''));
  ligne(dl, 'Type d’agent', a.type);
  ligne(dl, 'Profondeur', a.profondeur === 0 ? 'agent racine' : String(a.profondeur));
  const parent = a.parent && a.parent !== 'racine'
    ? (deroule.agents.find((x) => x.id === a.parent)?.nom || a.parent)
    : (a.profondeur === 0 ? null : 'agent racine');
  ligne(dl, 'Lancé par', parent);
  ligne(dl, 'Début', a.debut ? heure(a.debut) : null);
  ligne(dl, 'Fin', a.fin ? heure(a.fin) : (a.etat === 'en cours' ? 'pas encore' : 'inconnue'));
  ligne(dl, 'Durée', duree(a.dureeMs));
  ligne(dl, 'Modèle', a.modele, true);
  ligne(dl, 'Effort', a.effort);
  // Le répertoire de travail. Il n'est pas une propriété fixe de la session : mesuré sur
  // les 194 transcripts de la machine, il change en cours de route dans 44 d'entre eux, et
  // 7 sous-agents sur 69 travaillent ailleurs que leur parent. On donne donc le dernier
  // connu, et le nombre de fois où il a changé.
  // ⚠️ On donne les répertoires DISTINCTS, pas le compte de changements : mesuré sur
  // `454ef787`, 188 changements pour 6 répertoires — le cwd oscille entre un dossier et
  // son sous-dossier à chaque appel, et le compte brut ne dirait rien de vrai.
  const lieux = a.repertoires || [];
  ligne(dl, 'Répertoire de travail', a.repertoire
    ? a.repertoire + (lieux.length > 1 ? '   (' + lieux.length + ' répertoires distincts)' : '')
    : null, true);
  ligne(dl, 'Branche git', a.branche, true);
  ligne(dl, 'Jetons', a.jetons !== null && a.jetons !== undefined ? a.jetons.toLocaleString('fr-FR') : null);
  ligne(dl, 'Appels d’outils', String(a.outils.length));
  const enfants = deroule.agents.filter((x) => x.parent === a.id).length;
  ligne(dl, 'Sous-agents lancés', enfants ? String(enfants) : null);
  if (a.statutBrut && a.statutBrut !== 'completed') ligne(dl, 'Statut brut', a.statutBrut, true);

  const morceaux = [dl];
  if ((a.repertoires || []).length > 1) {
    morceaux.push(blocReplie(
      'les ' + a.repertoires.length + ' répertoires où cet agent a travaillé',
      a.repertoires.map((r) => r.chemin + '   —   ' + r.lignes + ' ligne(s)').join('\n')
      + '\n\n' + a.changementsDeRepertoire + ' changements en tout : le répertoire oscille '
      + 'entre un dossier et son sous-dossier au fil des appels, ce ne sont pas autant de '
      + 'déplacements voulus.', false));
  }

  // Né pendant une boucle : on le dit, et on y renvoie.
  if (a.neDansBoucle) {
    const lien = trouverBoucle(a.neDansBoucle.boucle);
    const dt = document.createElement('dt'); dt.textContent = 'Né pendant';
    const dd = document.createElement('dd');
    const bt = document.createElement('button');
    bt.className = 'lien-boucle';
    bt.textContent = 'l’itération ' + (a.neDansBoucle.rang + 1) + ' sur '
      + a.neDansBoucle.total + ' d’une boucle';
    if (lien) {
      bt.addEventListener('click', () => carteBoucle(lien.b, lien.agent, a.neDansBoucle.rang));
      bt.title = (lien.b.consigne || '').replace(/^\/loop\s*/, '').slice(0, 160);
    }
    dd.append(bt);
    dl.append(dt, dd);
  }

  // Les outils réellement employés, comptés — et non la liste des outils offerts, qui
  // n'est presque jamais disponible (C2 d'OBSERVATIONS-FORMAT.md).
  const parNom = {};
  for (const o of a.outils) parNom[o.nom] = (parNom[o.nom] || 0) + 1;
  const noms = Object.entries(parNom).sort((x, y) => y[1] - x[1]);
  if (noms.length) {
    const bloc = document.createElement('div');
    bloc.className = 'bloc';
    const s = document.createElement('div');
    s.style.cssText = 'font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--texte-faible)';
    s.textContent = 'outils employés';
    const puces = document.createElement('div');
    puces.className = 'puces-outils';
    for (const [nom, n] of noms) {
      const sp = document.createElement('span');
      sp.textContent = nom + ' × ' + n;
      puces.append(sp);
    }
    bloc.append(s, puces);
    morceaux.push(bloc);
  }

  if ((a.skillsCharges || []).length) {
    const bloc = document.createElement('div');
    bloc.className = 'bloc';
    const s = document.createElement('div');
    s.style.cssText = 'font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--texte-faible)';
    s.textContent = 'skills réellement chargés';
    const puces = document.createElement('div');
    puces.className = 'puces-outils';
    const vus = new Map();
    for (const sk of a.skillsCharges) {
      if (!vus.has(sk.nom)) vus.set(sk.nom, { n: 0, taille: sk.taille, chemin: sk.chemin });
      vus.get(sk.nom).n += 1;
    }
    for (const [nom, info] of vus) {
      const sp = document.createElement('span');
      sp.textContent = nom + (info.n > 1 ? ' × ' + info.n : '');
      sp.title = (info.chemin || '') + (info.taille ? '  —  ' + info.taille + ' caractères chargés' : '');
      puces.append(sp);
    }
    bloc.append(s, puces);
    morceaux.push(bloc);
  }
  if ((a.erreurs || []).length) {
    const p = document.createElement('p');
    p.className = 'avert';
    p.textContent = a.erreurs.length + ' panne(s) pendant son travail : '
      + a.erreurs.map((e) => e.texte.replace(/^API Error:\s*/, '')).join(' · ');
    morceaux.push(p);
  }
  morceaux.push(blocReplie('entrée — le prompt reçu', a.prompt));
  morceaux.push(blocReplie('sortie — sa réponse finale', a.sortie));

  if (a.etat === 'fin inconnue') {
    const p = document.createElement('p');
    p.className = 'avert';
    p.textContent = "Aucun marqueur de fin n'a été écrit et la session ne tourne plus : "
      + "cet agent a été coupé net. L'instant affiché est sa dernière trace, pas sa fin.";
    morceaux.push(p);
  }
  ouvrirPanneau(a.profondeur === 0 ? 'agent racine' : 'sous-agent', a.nom, morceaux);
}

/** Carte d'un appel d'outil — §6.4 — ou d'un skill — §6.2. */
function carteOutil(o, agent) {
  const estSkill = Boolean(o.skill);
  const dl = document.createElement('dl');
  if (estSkill) ligne(dl, 'Skill', o.skill, true);
  ligne(dl, 'Outil', o.nom, true);
  ligne(dl, 'Appelé par', agent.nom);
  ligne(dl, 'Instant', o.debut ? heure(o.debut) : null);
  ligne(dl, 'Durée', o.fin !== null ? duree(o.dureeMs) : 'sans résultat enregistré');
  // Un résultat sans drapeau d'erreur est le cas ordinaire : on omet la ligne plutôt que
  // d'afficher « inconnue » sur presque tous les appels.
  ligne(dl, 'Issue', o.ok === false ? 'échec' : o.ok === true ? 'succès' : null);

  const morceaux = [dl,
    // L'invite dit la vérité sur ce qu'on lit : « $ » pour un shell, « › » sinon —
    // l'entrée d'un Read ou d'un Agent est du JSON, pas une ligne de commande, et lui
    // mettre une invite de shell serait un mensonge de forme.
    blocReplie(estSkill ? 'consigne donnée au skill' : 'entrée', o.entree, true, {
      invite: o.nom === 'Bash' ? '$' : '›',
      libelle: o.nom === 'Bash' ? 'commande' : (estSkill ? 'consigne' : 'entrée de ' + o.nom),
    }),
    blocReplie('résultat', o.sortie, true, {
      libelle: o.ok === false ? 'sortie — en échec' : 'sortie',
      genre: o.ok === false ? 'echec' : 'sortie',
    })];

  // Le contenu que le skill a réellement injecté : ce que l'appel seul ne dit pas.
  if (estSkill) {
    const charge = (agent.skillsCharges || [])
      .filter((s) => s.nom === o.skill)
      .sort((x, y) => Math.abs(x.instant - o.debut) - Math.abs(y.instant - o.debut))[0];
    if (charge) {
      ligne(dl, 'Chargé depuis', charge.chemin, true);
      ligne(dl, 'Taille chargée', charge.taille + ' caractères');
      const tronqueSkill = charge.taille && charge.taille > charge.contenu.length;
      // Seule exception : les instructions d'un skill font des milliers de caractères et
      // ne sont pas ce qu'on vient lire en premier.
      morceaux.push(blocReplie(
        'instructions réellement chargées' + (tronqueSkill ? ' — extrait' : ''),
        charge.contenu, false));
      if (tronqueSkill) {
        const p = document.createElement('p');
        p.className = 'avert';
        p.textContent = 'Le skill fait ' + charge.taille
          + ' caractères ; l’extrait ci-dessus s’arrête à ' + charge.contenu.length + '.';
        morceaux.push(p);
      }
    }
  }

  if (o.tronque) {
    const p = document.createElement('p');
    p.className = 'avert';
    p.textContent = "Entrée ou résultat tronqués à 700 caractères : le transcript en "
      + 'contient davantage.';
    morceaux.push(p);
  }

  ouvrirPanneau(estSkill ? 'skill' : "appel d'outil",
    estSkill ? o.skill : o.nom + (o.resume ? ' — ' + o.resume.slice(0, 60) : ''),
    morceaux);
}

/**
 * Carte de boucle — §6.3. Ce qu'elle doit rendre visible : la répétition, et l'avancement
 * dans cette répétition.
 */
function carteBoucle(b, agent, rangVise) {
  const dl = document.createElement('dl');
  ligne(dl, 'État', b.etat);
  ligne(dl, 'Agent', agent.nom);
  ligne(dl, 'Itérations', String(b.iterations.length));
  ligne(dl, 'Sans effet', b.sansEffet
    ? b.sansEffet + ' sur ' + b.iterations.length
      + (b.sansEffetALaFin ? '  —  dont ' + b.sansEffetALaFin + ' de suite à la fin' : '')
    : 'aucune');
  ligne(dl, 'Début', b.debut ? heure(b.debut) : null);
  ligne(dl, 'Fin', b.fin ? heure(b.fin) : 'pas encore');
  ligne(dl, 'Durée', duree((b.fin ?? Date.now()) - b.debut));
  ligne(dl, 'Ouverte par', b.source === 'skill'
    ? 'un appel du skill loop'
    : "aucun appel de skill — consigne relue dans le réveil");

  const morceaux = [dl];

  const titreBande = document.createElement('div');
  titreBande.style.cssText = 'font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--texte-faible);margin-top:1rem';
  titreBande.textContent = 'la répétition — une case par itération, dans l’ordre';
  const bande = document.createElement('div');
  bande.className = 'bande';
  const detail = document.createElement('div');
  detail.className = 'iteration';

  function montrer(rang) {
    const it = b.iterations[rang];
    [...bande.children].forEach((c, i) => c.classList.toggle('vise', i === rang));
    iterationVisee = { boucle: b.id, rang };
    amenerEnVue(it.depuis ?? it.instant, it.jusqua ?? it.instant);
    dessinerPiste();
    detail.replaceChildren();
    const titre = document.createElement('div');
    titre.innerHTML = '';
    titre.append(document.createTextNode(
      'itération ' + (rang + 1) + ' sur ' + b.iterations.length
      + ' — ' + (it.noop ? "rien n'a changé" : 'quelque chose a été produit')));
    titre.style.fontWeight = '600';
    const quand = document.createElement('div');
    quand.className = 'quand';
    let texte = heure(it.instant);
    if (it.delaiS) texte += '  ·  réveil demandé dans ' + duree(it.delaiS * 1000);
    // Le délai demandé n'est pas le délai subi : scheduled_task_fire dit quand le réveil
    // a vraiment eu lieu.
    if (it.attenteMs) {
      texte += '  ·  réveillé après ' + duree(it.attenteMs);
      if (it.delaiS) {
        const ecart = it.attenteMs - it.delaiS * 1000;
        if (Math.abs(ecart) > 30000) {
          texte += ' (' + (ecart > 0 ? '+' : '−') + duree(Math.abs(ecart)) + ')';
        }
      }
    }
    quand.textContent = texte;
    const raison = document.createElement('div');
    raison.style.marginTop = '.35rem';
    raison.textContent = it.raison || '(aucune raison donnée)';
    detail.append(titre, quand, raison);

    // Les agents nés pendant ce tour, de toutes profondeurs : c'est ici que se lit
    // « ce sous-agent, il est né au tour numéro combien ? ».
    if ((it.agents || []).length) {
      const nes = document.createElement('div');
      nes.className = 'nes';
      const etiq = document.createElement('span');
      etiq.style.cssText = 'font-size:.74rem;color:var(--texte-faible);align-self:center';
      etiq.textContent = 'agents nés pendant ce tour :';
      nes.append(etiq);
      for (const ref of it.agents) {
        const bt = document.createElement('button');
        bt.textContent = (ref.profondeur > 1 ? '↳ '.repeat(ref.profondeur - 1) : '') + ref.nom;
        bt.title = 'profondeur ' + ref.profondeur;
        bt.addEventListener('click', () => {
          const cible = deroule.agents.find((x) => x.id === ref.id);
          if (cible) { vise = cible.id; dessiner(); carteAgent(cible); }
        });
        nes.append(bt);
      }
      detail.append(nes);
    }
  }

  b.iterations.forEach((it, rang) => {
    const c = document.createElement('i');
    const classes = [];
    if (it.arret) classes.push('arret'); else if (it.noop) classes.push('rien');
    if ((it.agents || []).length) classes.push('enfante');
    c.className = classes.join(' ');
    c.title = 'itération ' + (rang + 1)
      + (it.arret ? " — c'est elle qui a arrêté la boucle" : it.noop ? " — rien n'a changé" : '')
      + ((it.agents || []).length ? '\n' + it.agents.length + ' agent(s) lancé(s)' : '');
    c.addEventListener('click', () => montrer(rang));
    bande.append(c);
  });

  const legende = document.createElement('div');
  legende.style.cssText = 'font-size:.74rem;color:var(--texte-faible);margin-top:.15rem';
  legende.textContent = 'case pleine : quelque chose a été produit · case grise : rien n’a '
    + 'changé · case bleue : c’est elle qui a arrêté la boucle · pastille : des agents y '
    + 'sont nés';

  morceaux.push(titreBande, bande, legende, detail,
    blocReplie('consigne de la boucle', b.consigne));

  // La boucle ouverte se signale aussi sur la ligne du temps.
  if (boucleVisee !== b.id) {
    boucleVisee = b.id;
    if (elChoixBoucle) elChoixBoucle.value = b.id;
    dessinerPiste();
  }
  ouvrirPanneau('boucle', b.consigne
    ? b.consigne.replace(/^\/loop\s*/, '').slice(0, 70)
    : 'boucle sans consigne retrouvée', morceaux);
  montrer(rangVise >= 0 && rangVise < b.iterations.length ? rangVise : 0);
}

function trouverBoucle(id) {
  for (const agent of deroule.agents) {
    for (const b of agent.boucles || []) if (b.id === id) return { b, agent };
  }
  return null;
}

function listerBoucles() {
  const toutes = [];
  for (const a of deroule.agents) for (const b of a.boucles || []) toutes.push([b, a]);
  if (!toutes.length) { elBoucles.style.display = 'none'; return; }
  elBoucles.style.display = 'flex';
  elBouclesTitre.textContent = toutes.length + (toutes.length > 1 ? ' boucles' : ' boucle');

  const vide = document.createElement('option');
  vide.value = '';
  vide.textContent = '— en choisir une —';
  const options = toutes.map(([b], i) => {
    const o = document.createElement('option');
    o.value = b.id;
    const consigne = (b.consigne || '').replace(/^\/loop\s*/, '').slice(0, 52);
    o.textContent = '#' + (i + 1) + ' · ' + b.iterations.length + ' it. · ' + consigne;
    return o;
  });
  elChoixBoucle.replaceChildren(vide, ...options);
  elChoixBoucle.value = boucleVisee || '';
}

elChoixBoucle.addEventListener('change', () => {
  const choix = trouverBoucle(elChoixBoucle.value);
  if (!choix) { boucleVisee = null; dessinerPiste(); fermerPanneau(); return; }
  carteBoucle(choix.b, choix.agent, 0);
});

/** Carte de la voie de contexte : ce que la courbe montre, et ce qu'elle ne sait pas. */
function carteContexte(a) {
  const ref = refContexte();
  const points = a.contexte || [];
  const sien = Math.max(...points.map((c) => c.jetons), 0);
  const dernier = points.length ? points[points.length - 1].jetons : null;
  const dl = document.createElement('dl');
  ligne(dl, 'Agent', a.nom);
  ligne(dl, 'Pic atteint', sien.toLocaleString('fr-FR') + ' jetons');
  ligne(dl, 'À la fin', dernier !== null ? dernier.toLocaleString('fr-FR') + ' jetons' : null);
  ligne(dl, 'Relevés', String(points.length));
  ligne(dl, 'Compactages', String((a.compactages || []).length));
  ligne(dl, 'Référence de la couleur',
    ref.fenetreConnue
      ? ref.pic.toLocaleString('fr-FR') + ' jetons — la fenêtre, connue par le compactage '
        + 'qu’elle a déclenché'
      : 'aucune — cette session n’a jamais compacté');

  const morceaux = [dl];
  const p = document.createElement('p');
  p.className = 'avert';
  p.textContent = ref.fenetreConnue
    ? 'La courbe est peinte d’un dégradé vert → rouge : plus elle monte, plus la fenêtre '
      + 'est pleine. Elle retombe d’un coup à chaque compactage.'
    : 'La couleur reste neutre : sans compactage, on ignore la taille réelle de la '
      + 'fenêtre, et un pic de ' + sien.toLocaleString('fr-FR') + ' jetons ne veut pas '
      + 'dire qu’elle est pleine. L’échelle est seulement relative.';
  morceaux.push(p);
  ouvrirPanneau('contexte', a.nom, morceaux);
}

/**
 * Une jauge de part, du rouge au vert. Les bornes se nomment, parce que la même jauge sert
 * à deux choses qui n'ont rien à voir : la part servie par le cache, et la part du
 * contexte que le transcript permet de nommer.
 */
function jaugeCache(part, legende, bornes = ['tout au prix fort', '50 %', 'tout en cache']) {
  const bloc = document.createElement('div');
  bloc.className = 'jauge';
  const valeur = document.createElement('div');
  valeur.className = 'valeur';
  const fort = document.createElement('b');
  fort.textContent = (part * 100).toFixed(1).replace('.', ',') + ' %';
  fort.style.color = part > 0.9 ? 'var(--ramp-bon)' : part > 0.6 ? 'var(--ramp-moyen)' : 'var(--ramp-mauvais)';
  valeur.append(fort, document.createTextNode('  ' + legende));
  const piste = document.createElement('div');
  piste.className = 'piste-jauge';
  const curseur = document.createElement('div');
  curseur.className = 'curseur';
  curseur.style.left = (Math.max(0, Math.min(1, part)) * 100).toFixed(1) + '%';
  piste.append(curseur);
  const grad = document.createElement('div');
  grad.className = 'graduations';
  for (const l of bornes) {
    const s = document.createElement('span');
    s.textContent = l;
    grad.append(s);
  }
  bloc.append(valeur, piste, grad);
  return bloc;
}

/** Les jetons d'entrée d'un appel ou d'un ensemble d'appels, détaillés. */
function detaillerEntree(dl, j, nombre) {
  const entree = (j.entree || 0) + (j.cacheLu || 0) + (j.cacheEcrit || 0);
  ligne(dl, 'Entrée, en tout', nombre(entree) + ' jetons');
  ligne(dl, '— lus du cache', nombre(j.cacheLu)
    + (entree ? '   (' + Math.round(((j.cacheLu || 0) / entree) * 100) + ' %)' : ''));
  ligne(dl, '— écrits au cache', nombre(j.cacheEcrit)
    + (entree ? '   (' + Math.round(((j.cacheEcrit || 0) / entree) * 100) + ' %)' : ''));
  ligne(dl, '— payés au prix fort', nombre(j.entree)
    + (entree ? '   (' + Math.round(((j.entree || 0) / entree) * 100) + ' %)' : ''));
  return entree ? (j.cacheLu || 0) / entree : 0;
}

/** Carte de l'outillage : ce que l'agent peut appeler, et ce qui a changé en route. */
/**
 * La carte des hooks. C'est elle qui porte les durées, puisque la voie ne peut pas les
 * dessiner — un hook dure quelques dizaines de millisecondes, soit un dixième de pixel.
 */
function carteHooks(agent, visee) {
  const hooks = agent.hooks || [];
  const dl = document.createElement('dl');
  if (visee) {
    ligne(dl, 'Ce hook', visee.nom);
    ligne(dl, 'Événement', visee.evenement);
    ligne(dl, 'Instant', heure(visee.instant));
    ligne(dl, 'Durée', visee.dureeMs !== null ? visee.dureeMs + ' ms' : null);
    ligne(dl, 'Code de sortie', visee.code !== null ? String(visee.code) : null);
    ligne(dl, 'Autour de l’appel', visee.idAppel);
  }
  ligne(dl, 'Agent', agent.nom);
  ligne(dl, 'Hooks déclenchés', String(hooks.length));

  // Par événement : le compte, le temps total, la médiane. C'est le chiffre qui dit ce
  // que les hooks coûtent réellement à chaque geste.
  const parEvenement = new Map();
  for (const h of hooks) {
    const cle = h.evenement || '(sans événement)';
    if (!parEvenement.has(cle)) parEvenement.set(cle, []);
    parEvenement.get(cle).push(h.dureeMs || 0);
  }
  const total = hooks.reduce((n2, h) => n2 + (h.dureeMs || 0), 0);
  ligne(dl, 'Temps total', total + ' ms');
  const rates = hooks.filter((h) => !h.ok).length;
  ligne(dl, 'En échec', rates ? String(rates) : 'aucun');

  const morceaux = [dl];

  const table = document.createElement('dl');
  for (const [ev, ds] of [...parEvenement.entries()].sort((x, y) => y[1].length - x[1].length)) {
    const tri = [...ds].sort((x, y) => x - y);
    const med = tri.length ? tri[Math.floor(tri.length / 2)] : 0;
    ligne(table, ev, ds.length + ' × · médiane ' + med + ' ms · total '
      + ds.reduce((x, y) => x + y, 0) + ' ms');
  }
  morceaux.push(table);

  // Ceux qui parlent : leur contenu entre dans la conversation, il faut pouvoir le lire.
  const parlants = hooks.filter((h) => h.injecte);
  if (parlants.length) {
    morceaux.push(blocReplie(parlants.length + ' hook(s) qui injectent du texte dans la conversation',
      parlants.map((h) => h.nom + ' — ' + heure(h.instant) + '\n' + h.injecte).join('\n\n'), true));
  }

  if (visee && visee.commande) {
    morceaux.push(blocReplie('la commande exécutée', visee.commande, false));
  }

  const p = document.createElement('p');
  p.className = 'avert';
  p.textContent = 'Ce que cette voie ne peut pas montrer, et c’est mesuré : les hooks '
    + 'déclarés par le dépôt observé. Un hook de projet s’exécute pour de vrai — son refus '
    + 'atteint l’agent, ses fichiers sont écrits — mais il ne laisse AUCUN enregistrement '
    + 'dans le transcript. Les 32 609 enregistrements de la machine viennent tous de la '
    + 'configuration personnelle, et c’est aussi pourquoi aucun n’a jamais un code de '
    + 'sortie non nul. La commande d’un hook, elle, n’est jamais envoyée au modèle : elle '
    + 'pèse 3 226 caractères en moyenne et ne compte pas dans le contexte.';
  morceaux.push(p);

  ouvrirPanneau('hooks', agent.nom, morceaux);
}

function carteOutillage(agent, visee) {
  const dl = document.createElement('dl');
  if (visee) {
    ligne(dl, 'Cet événement', NOM_OUTILLAGE[visee.genre]);
    ligne(dl, 'Instant', heure(visee.instant));
    ligne(dl, 'Détail', visee.detail);
    if (visee.ajoutes) ligne(dl, 'Outils ajoutés', String(visee.ajoutes));
    if (visee.retires) ligne(dl, 'Outils retirés', String(visee.retires));
    ligne(dl, 'Offerts à cet instant', visee.total !== undefined ? String(visee.total) : null);
  }
  ligne(dl, 'Agent', agent.nom);
  ligne(dl, 'Outils offerts à la fin', String((agent.outilsOfferts || []).length));
  ligne(dl, 'Changements', String(agent.outillage.length));

  const morceaux = [dl];

  // La chronologie des changements.
  if (agent.outillage.length) {
    const liste = document.createElement('div');
    liste.className = 'ctx-liste';
    for (const e of agent.outillage) {
      const d = document.createElement('details');
      d.className = 'ctx-element';
      const s = document.createElement('summary');
      const m = document.createElement('i');
      m.className = 'marque';
      m.style.background = 'var(--outillage)';
      const quoi = document.createElement('span');
      quoi.className = 'quoi';
      quoi.textContent = NOM_OUTILLAGE[e.genre];
      const quand = document.createElement('span');
      quand.className = 'quand';
      quand.textContent = e.instant ? new Date(e.instant).toLocaleTimeString('fr-FR') : '';
      const taille = document.createElement('span');
      taille.className = 'taille';
      taille.textContent = (e.total !== undefined ? e.total + ' offerts' : '');
      s.append(m, quoi, quand, taille);
      const pre = document.createElement('pre');
      pre.textContent = (e.noms || []).join('\n') || '(aucun nom enregistré)';
      d.append(s, pre);
      liste.append(d);
    }
    morceaux.push(liste);
  }

  // Et la liste de ce qui est offert à la fin.
  const offerts = [...(agent.outilsOfferts || [])].sort();
  if (offerts.length) {
    morceaux.push(blocReplie('les ' + offerts.length + ' outils offerts à la fin',
      offerts.join('\n'), false));
  }

  const p = document.createElement('p');
  p.className = 'avert';
  p.textContent = 'Les permissions proprement dites ne sont presque jamais enregistrées : '
    + 'sur l’ensemble des transcrits, deux enregistrements de permissions non vides sur '
    + 'deux cent trente, deux refus d’outil, et un seul changement de mode. Ce qui bouge '
    + 'réellement est le catalogue d’outils — ouvert au démarrage, enrichi quand une '
    + 'recherche d’outils en remonte, restreint quand un skill l’impose.';
  morceaux.push(p);

  ouvrirPanneau('outillage', agent.nom, morceaux);
}

/** Carte des fichiers : lesquels ont été touchés, combien de fois, et de combien. */
function carteFichiers(agent) {
  const ops = agent.outils.filter((o) => o.fichier);
  const parFichier = new Map();
  for (const o of ops) {
    const f = o.fichier;
    if (!parFichier.has(f.chemin)) {
      parFichier.set(f.chemin, { lu: 0, ecrit: 0, modifie: 0, plus: 0, moins: 0 });
    }
    const e = parFichier.get(f.chemin);
    if (f.genre === 'lu') e.lu += 1;
    else if (f.genre === 'écrit') e.ecrit += 1;
    else e.modifie += 1;
    e.plus += f.plus;
    e.moins += f.moins;
  }
  const nombre = (n) => (n || 0).toLocaleString('fr-FR');
  const plus = ops.reduce((n, o) => n + o.fichier.plus, 0);
  const moins = ops.reduce((n, o) => n + o.fichier.moins, 0);
  const ecrits = ops.filter((o) => o.fichier.genre === 'écrit').length;
  const modifs = ops.filter((o) => o.fichier.genre === 'modifié').length;

  const dl = document.createElement('dl');
  ligne(dl, 'Agent', agent.nom);
  ligne(dl, 'Fichiers distincts', String(parFichier.size));
  ligne(dl, 'Opérations', ops.length + '   (' + (ops.length - ecrits - modifs) + ' lectures, '
    + ecrits + ' écritures, ' + modifs + ' modifications)');
  ligne(dl, 'Lignes ajoutées', '+' + nombre(plus));
  ligne(dl, 'Lignes retirées', '−' + nombre(moins));
  if (agent.courbeFichiers) {
    const c = agent.courbeFichiers;
    const pic = Math.max(0, ...c.points.map((q) => q.nombre));
    let descentes = 0;
    for (let i = 1; i < c.points.length; i += 1) {
      if (c.points[i].nombre < c.points[i - 1].nombre) descentes += 1;
    }
    ligne(dl, 'Fichiers qu’il a fait exister', c.finale + (pic > c.finale ? '   (pic à ' + pic + ')' : ''));
    ligne(dl, 'Suppressions comptées', String(descentes));
    ligne(dl, 'Suppressions non attribuées', c.ignorees
      ? c.ignorees + '   (motif ou variable : on ne devine pas ce qu’elles effacent)'
      : null);
  }

  const morceaux = [dl];

  // Les fichiers les plus repris : c'est là que le travail a été le plus difficile.
  const tri = [...parFichier.entries()]
    .sort((a, b) => (b[1].ecrit + b[1].modifie + b[1].lu) - (a[1].ecrit + a[1].modifie + a[1].lu));
  const liste = document.createElement('div');
  liste.className = 'ctx-liste';
  for (const [chemin, e] of tri.slice(0, 40)) {
    const d = document.createElement('div');
    d.className = 'ctx-element';
    const s = document.createElement('div');
    s.style.cssText = 'display:flex;gap:.5rem;align-items:baseline;padding:.3rem .1rem;font-size:.78rem';
    const nom = document.createElement('span');
    nom.textContent = chemin.replace(/^.*\/(?=[^/]*\/[^/]*$)/, '');
    nom.title = chemin;
    nom.style.cssText = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
    const compte = document.createElement('span');
    compte.style.cssText = 'margin-left:auto;color:var(--texte-faible);font-size:.74rem;white-space:nowrap';
    const bouts = [];
    if (e.lu) bouts.push(e.lu + ' lu');
    if (e.ecrit) bouts.push(e.ecrit + ' écrit');
    if (e.modifie) bouts.push(e.modifie + ' modifié');
    if (e.plus) bouts.push('+' + e.plus);
    if (e.moins) bouts.push('−' + e.moins);
    compte.textContent = bouts.join(' · ');
    s.append(nom, compte);
    d.append(s);
    liste.append(d);
  }
  morceaux.push(liste);
  if (tri.length > 40) {
    const reste = document.createElement('p');
    reste.className = 'avert';
    reste.textContent = (tri.length - 40) + ' autres fichiers ne sont pas listés ici.';
    morceaux.push(reste);
  }

  const p = document.createElement('p');
  p.className = 'avert';
  p.textContent = 'Le compte est exact pour un Edit, qui porte l’ancien et le nouveau '
    + 'texte. Un Write ne porte que le nouveau contenu : ses lignes comptent en positif, '
    + 'et ce qu’il a remplacé reste inconnu. Le transcript ne contient aucun diff git — '
    + 'ce qui est montré est ce que l’agent a demandé, ce qui est plus proche de la source.';
  morceaux.push(p);

  ouvrirPanneau('fichiers', agent.nom, morceaux);
}

/** Carte de la réflexion : quand le modèle réfléchit, et combien. */
function carteReflexion(agent) {
  const reqs = agent.requetesModele;
  const avec = reqs.filter((r) => r.jetons.reflexion > 0);
  const jetons = avec.map((r) => r.jetons.reflexion).sort((a, b) => a - b);
  const total = jetons.reduce((n, j) => n + j, 0);
  const sortie = reqs.reduce((n, r) => n + r.jetons.sortie, 0);
  const nombre = (n) => (n || 0).toLocaleString('fr-FR');

  const dl = document.createElement('dl');
  ligne(dl, 'Agent', agent.nom);
  ligne(dl, 'Appels avec réflexion', avec.length + ' sur ' + reqs.length
    + '   (' + Math.round(avec.length * 100 / Math.max(1, reqs.length)) + ' %)');
  ligne(dl, 'Jetons de réflexion', nombre(total)
    + '   soit ' + Math.round(total * 100 / Math.max(1, sortie)) + ' % de tout ce qu’il a produit');
  ligne(dl, 'Par réflexion', jetons.length
    ? 'médiane ' + nombre(jetons[Math.floor(jetons.length / 2)])
      + ', la plus longue ' + nombre(jetons[jetons.length - 1])
    : null);

  // Réfléchit-il davantage avant d'appeler un outil, ou avant de parler ?
  const avant = { avecOutil: [0, 0], sansOutil: [0, 0] };
  for (const r of avec) {
    const cle = r.outils.length ? 'avecOutil' : 'sansOutil';
    avant[cle][0] += 1;
    avant[cle][1] += r.jetons.reflexion;
  }
  const moy = (q) => (q[0] ? Math.round(q[1] / q[0]) : 0);
  ligne(dl, 'Avant d’appeler un outil',
    avant.avecOutil[0] + ' fois, ' + nombre(moy(avant.avecOutil)) + ' jetons en moyenne');
  ligne(dl, 'Avant de seulement parler',
    avant.sansOutil[0] + ' fois, ' + nombre(moy(avant.sansOutil)) + ' jetons en moyenne');

  const p = document.createElement('p');
  p.className = 'avert';
  p.textContent = 'Le contenu de la réflexion n’est pas conservé par le transcript : seule '
    + 'sa signature l’est. On sait donc qu’elle a eu lieu et ce qu’elle a coûté, jamais ce '
    + 'qu’elle disait. La hauteur des barres suit la racine du nombre de jetons, sans quoi '
    + 'le pic écraserait toutes les autres.';

  ouvrirPanneau('réflexion', agent.nom, [dl, p]);
}

/**
 * Carte des tours : le détail de l'un d'eux, et surtout la part du temps où la machine a
 * vraiment travaillé. C'est le chiffre que toutes les autres voies laissaient deviner.
 */
function carteTours(agent, visee) {
  const tours = agent.tours;
  const cumul = tours.reduce((n, t) => n + t.dureeMs, 0);
  const etendue = Math.max(1, (agent.fin ?? deroule.fin) - agent.debut);
  const tries = [...tours].map((t) => t.dureeMs).sort((a, b) => a - b);

  const dl = document.createElement('dl');
  const morceaux = [dl];

  if (visee) {
    const c = contenuDuTour(agent, visee);
    ligne(dl, 'Ce tour', heure(visee.debut) + '  →  ' + heure(visee.fin));
    ligne(dl, 'Durée', duree(visee.dureeMs));
    ligne(dl, 'Appels d’outils', String(c.outils.length));
    ligne(dl, 'Requêtes au modèle', String(c.requetes.length));
    ligne(dl, 'Temps dans les outils', duree(c.tempsOutils)
      + '   (' + Math.round(c.tempsOutils * 100 / Math.max(1, visee.dureeMs)) + ' %)');
    ligne(dl, 'Temps chez le modèle', duree(c.tempsModele)
      + '   (' + Math.round(c.tempsModele * 100 / Math.max(1, visee.dureeMs)) + ' %)');
    const parNom = {};
    for (const o of c.outils) parNom[o.nom] = (parNom[o.nom] || 0) + 1;
    const tri = Object.entries(parNom).sort((x, y) => y[1] - x[1]);
    if (tri.length) ligne(dl, 'Outils employés', tri.map(([n, k]) => n + ' × ' + k).join(', '));
  }

  ligne(dl, 'Agent', agent.nom);
  ligne(dl, 'Tours', String(tours.length));
  ligne(dl, 'Travail cumulé', duree(cumul));
  ligne(dl, 'Étendue de l’agent', duree(etendue));
  ligne(dl, 'Durée d’un tour', tries.length
    ? 'médiane ' + duree(tries[Math.floor(tries.length / 2)])
      + ', la plus longue ' + duree(tries[tries.length - 1])
    : null);

  morceaux.push(jaugeCache(cumul / etendue, 'du temps, la machine travaillait',
    ['elle attendait tout du long', '50 %', 'elle n’a jamais chômé']));

  const p = document.createElement('p');
  p.className = 'avert';
  p.style.fontStyle = 'normal';
  p.style.color = 'var(--texte-faible)';
  p.textContent = 'Un tour va de ce qui réveille l’agent — une requête d’Yves, un réveil '
    + 'de boucle, la fin d’une tâche d’arrière-plan — jusqu’à ce qu’il rende la main. '
    + 'Claude Code en écrit lui-même la durée : c’est la seule mesure exacte du temps de '
    + 'travail, et non une estimation tirée des événements. Entre deux tours, la machine '
    + 'n’a rien à faire.';
  morceaux.push(p);

  ouvrirPanneau('tours', agent.nom, morceaux);
}

/** Carte d'un modèle : ce qu'on a mesuré de ses appels, et le détail de l'un d'eux. */
function carteModele(agent, modele, visee) {
  const reqs = agent.requetesModele.filter((r) => r.modele === modele);
  const moyenne = (f) => reqs.reduce((n, r) => n + f(r), 0) / Math.max(1, reqs.length);
  const pire = (f) => reqs.reduce((n, r) => Math.max(n, f(r)), 0);
  const sansDuree = reqs.filter((r) => r.reponseMs === 0).length;

  const nombre = (n) => (n || 0).toLocaleString('fr-FR');
  const dl = document.createElement('dl');
  const morceauxEnTete = [];
  let partCet = null;
  if (visee) {
    const j = visee.jetons || {};
    ligne(dl, 'Cet appel', heure(visee.appel));
    ligne(dl, 'Déclenché par', visee.declencheur);
    ligne(dl, 'Attente avant réponse', duree(visee.latenceMs));
    ligne(dl, 'Durée de réponse', visee.reponseMs
      ? duree(visee.reponseMs)
      : 'non mesurable — réponse d’un seul bloc');
    partCet = detaillerEntree(dl, j, nombre);
    ligne(dl, 'Sortie', nombre(j.sortie) + ' jetons'
      + (j.reflexion ? '   dont ' + nombre(j.reflexion) + ' de réflexion' : ''));
    ligne(dl, 'Blocs écrits', visee.blocs
      + (visee.reflechi ? ', dont un de réflexion' : ''));
    ligne(dl, 'Outils appelés', visee.outils.length ? visee.outils.join(', ') : 'aucun');
    ligne(dl, 'Fin de réponse', visee.arret);
    if (visee.dit) {
      morceauxEnTete.push(blocReplie(
        'ce que le modèle a dit' + (visee.ditTronque ? ' — extrait' : ''), visee.dit));
    }
  }
  ligne(dl, 'Modèle', modele, true);
  ligne(dl, 'Agent', agent.nom);
  ligne(dl, 'Appels', String(reqs.length));
  ligne(dl, 'Attente avant réponse', 'moyenne ' + duree(Math.round(moyenne((r) => r.latenceMs)))
    + ', pire ' + duree(pire((r) => r.latenceMs)));
  ligne(dl, 'Durée de réponse', 'moyenne ' + duree(Math.round(moyenne((r) => r.reponseMs)))
    + ', pire ' + duree(pire((r) => r.reponseMs)));
  ligne(dl, 'Sans durée mesurable', sansDuree + ' sur ' + reqs.length
    + '  (' + Math.round((sansDuree / Math.max(1, reqs.length)) * 100) + ' %)');

  // Les jetons de tous les appels de ce modèle, pour situer celui qu'on regarde.
  const total = reqs.reduce((n, r) => ({
    entree: n.entree + (r.jetons?.entree || 0),
    sortie: n.sortie + (r.jetons?.sortie || 0),
    cacheLu: n.cacheLu + (r.jetons?.cacheLu || 0),
    cacheEcrit: n.cacheEcrit + (r.jetons?.cacheEcrit || 0),
    reflexion: n.reflexion + (r.jetons?.reflexion || 0),
  }), { entree: 0, sortie: 0, cacheLu: 0, cacheEcrit: 0, reflexion: 0 });
  const partTotale = detaillerEntree(dl, total, nombre);
  ligne(dl, 'Sortie, en tout', nombre(total.sortie) + ' jetons'
    + (total.reflexion ? '   dont ' + nombre(total.reflexion) + ' de réflexion' : ''));

  const p = document.createElement('p');
  p.className = 'avert';
  p.textContent = 'Ce qu’on mesure ici est ce que le transcript permet de mesurer, et non '
    + 'la latence du réseau. L’« appel » est le dernier événement écrit avant la réponse — '
    + 'une requête d’Yves, un résultat d’outil, ou le réveil d’une boucle. Le « début de '
    + 'réponse » est l’instant où le premier bloc a été écrit, pas celui du premier jeton : '
    + 'un bloc de réflexion long repousse donc ce début. Et une réponse d’un seul bloc n’a '
    + 'pas de durée mesurable.';
  const explication = document.createElement('p');
  explication.className = 'avert';
  explication.style.fontStyle = 'normal';
  explication.style.color = 'var(--texte-faible)';
  explication.textContent = 'Tout le contexte est renvoyé au modèle à chaque appel. Les '
    + 'jetons « lus du cache » ne sont pas retraités : c’est eux qui rendent une longue '
    + 'session tenable. Les jetons « écrits au cache » sont ce qui vient d’être ajouté et '
    + 'qu’on paie une fois pour pouvoir le relire ensuite. Ceux « payés au prix fort » '
    + 'n’ont pas été mis en cache du tout. Plus la part lue du cache est haute, mieux la '
    + 'session est servie.';

  const jauges = [];
  if (partCet !== null) jauges.push(jaugeCache(partCet, 'de cet appel vient du cache'));
  jauges.push(jaugeCache(partTotale, 'de tous les appels de ce modèle viennent du cache'));

  ouvrirPanneau('modèle', modele.replace(/^claude-/, ''),
    [dl, ...jauges, explication, ...morceauxEnTete, p]);
}

const TEINTE_GENRE = {
  humain: 'var(--ctx-humain)', modele: 'var(--ctx-modele)', reflexion: 'var(--ctx-reflexion)',
  outilEntree: 'var(--ctx-outil-entree)', outilSortie: 'var(--ctx-outil-sortie)',
    systeme: 'var(--ctx-systeme)', resume: 'var(--ctx-resume)',
};
const NOM_GENRE = {
  humain: 'requêtes d’Yves', modele: 'paroles du modèle', reflexion: 'réflexions',
  outilEntree: 'appels d’outils', outilSortie: 'résultats d’outils',
  systeme: 'système et rappels', resume: 'résumé de compactage',
};

/**
 * Lit, auprès du serveur, le contenu du contexte tel qu'il était à cet appel, et l'affiche
 * élément par élément. C'est servi à la demande : plusieurs centaines de milliers de
 * caractères, qu'on ne regarde qu'un appel à la fois.
 */
async function montrerContenuContexte(agent, requete, hote) {
  hote.replaceChildren();
  const attente = document.createElement('p');
  attente.className = 'avert';
  attente.textContent = 'lecture du contexte…';
  hote.append(attente);
  let data;
  try {
    const r = await fetch('/api/contexte?id=' + encodeURIComponent(idSession)
      + '&agent=' + encodeURIComponent(agent.id)
      + '&instant=' + requete.appel);
    data = await r.json();
    if (data.erreur) throw new Error(data.erreur);
  } catch (e) {
    attente.textContent = 'contexte illisible : ' + e.message;
    return;
  }

  const actifs = new Set(Object.keys(NOM_GENRE));
  const liste = document.createElement('div');
  liste.className = 'ctx-liste';
  let terme = '';

  const dessinerListe = () => {
    const bas = terme.toLowerCase();
    const retenus = data.elements.filter((e) => actifs.has(e.genre)
      && (!bas || (e.texte || '').toLowerCase().includes(bas)
        || (e.titre || '').toLowerCase().includes(bas)));
    compteur.textContent = terme
      ? retenus.length + ' élément(s) contiennent « ' + terme + ' » sur '
        + data.elements.length
      : '';
    liste.replaceChildren(...retenus.map((e) => {
      const d = document.createElement('details');
      d.className = 'ctx-element';
      const s = document.createElement('summary');
      const m = document.createElement('i');
      m.className = 'marque';
      m.style.background = TEINTE_GENRE[e.genre] || 'var(--trait)';
      const quoi = document.createElement('span');
      quoi.className = 'quoi';
      quoi.textContent = e.titre;
      const quand = document.createElement('span');
      quand.className = 'quand';
      quand.textContent = e.instant ? new Date(e.instant).toLocaleTimeString('fr-FR') : '';
      const taille = document.createElement('span');
      taille.className = 'taille';
      taille.textContent = e.vide
        ? 'contenu non conservé'
        : (e.texte || '').length.toLocaleString('fr-FR') + ' car.';
      s.append(m, quoi, quand, taille);
      const texte = e.vide
        ? '(le transcript ne conserve pas le contenu des blocs de réflexion — seule leur '
          + 'signature est gardée)'
        : (e.texte || '');
      const pre = document.createElement('pre');
      pre.textContent = texte;
      d.append(s, ...(texte.length > 400 ? [barreRecherche(pre, texte)] : []), pre);
      // Un élément trouvé par la recherche s'ouvre tout seul : on vient le lire.
      if (terme && !e.vide) {
        d.open = true;
        const b = d.querySelector('.recherche input');
        if (b) { b.value = terme; b.dispatchEvent(new Event('input')); }
      }
      return d;
    }));
  };

  // La recherche sur tout le contexte : elle réduit la liste aux éléments qui contiennent
  // le terme, et les ouvre déjà surlignés.
  const barreCtx = document.createElement('div');
  barreCtx.className = 'recherche';
  const champCtx = document.createElement('input');
  champCtx.type = 'search';
  champCtx.placeholder = 'chercher dans tout le contexte…';
  champCtx.spellcheck = false;
  const compteur = document.createElement('span');
  compteur.className = 'compte';
  compteur.style.minWidth = '14rem';
  barreCtx.append(champCtx, compteur);
  let minuteur = null;
  champCtx.addEventListener('input', () => {
    clearTimeout(minuteur);
    minuteur = setTimeout(() => { terme = champCtx.value.trim(); dessinerListe(); }, 160);
  });

  const filtres = document.createElement('div');
  filtres.className = 'ctx-filtres';
  const parGenre = {};
  for (const e of data.elements) parGenre[e.genre] = (parGenre[e.genre] || 0) + 1;
  for (const [cle, nom] of Object.entries(NOM_GENRE)) {
    if (!parGenre[cle]) continue;
    const b = document.createElement('button');
    b.textContent = nom + '  ' + parGenre[cle];
    b.style.borderColor = TEINTE_GENRE[cle];
    b.setAttribute('aria-pressed', 'true');
    b.addEventListener('click', () => {
      const on = b.getAttribute('aria-pressed') === 'true';
      b.setAttribute('aria-pressed', String(!on));
      if (on) actifs.delete(cle); else actifs.add(cle);
      dessinerListe();
    });
    filtres.append(b);
  }

  const entete = document.createElement('p');
  entete.className = 'avert';
  entete.style.fontStyle = 'normal';
  entete.style.color = 'var(--texte-faible)';
  entete.textContent = data.elements.length + ' éléments, '
    + data.caracteres.toLocaleString('fr-FR') + ' caractères'
    + (data.compactages ? '  —  reconstruit depuis le dernier des ' + data.compactages
      + ' compactage(s) qui précèdent' : '');

  hote.replaceChildren(entete, barreCtx, filtres, liste);
  dessinerListe();
}

/** Carte du contenu du contexte à un appel donné. */
/** Carte du buffer : ce que le cache épargne, pour un appel ou pour l'agent entier. */
function carteBuffer(agent, visee) {
  const nombre = (n) => Math.round(n || 0).toLocaleString('fr-FR');
  const global = economieAgent(agent);
  const dl = document.createElement('dl');
  const morceaux = [dl];

  if (visee) {
    const e = economieCache(visee.jetons);
    const rang = (agent.requetesModele || []).indexOf(visee);
    ligne(dl, 'Cet appel', heure(visee.appel)
      + (rang === 0 ? '   —  le premier de l’agent : il n’avait rien à relire' : ''));
    ligne(dl, 'Déclenché par', visee.declencheur);
    detaillerEntree(dl, visee.jetons, nombre);
    if (e) {
      ligne(dl, 'Coût de l’appel', nombre(e.cout) + ' jetons au prix plein, '
        + 'pour ' + nombre(e.total) + ' présentés');
      morceaux.push(jaugeCache(e.part, 'du prix plein épargné par le cache',
        ['tout au prix fort', '45 %', 'plafond : 90 %']));
    }
  }

  ligne(dl, 'Agent', agent.nom);
  ligne(dl, 'Appels mesurés', String((agent.requetesModele || []).length));
  if (global) {
    ligne(dl, 'Jetons présentés en tout', nombre(global.total));
    ligne(dl, 'Relus du cache', Math.round(global.relu * 100) + ' %');
    ligne(dl, 'Coût réel', nombre(global.cout) + ' jetons au prix plein');
    ligne(dl, 'Épargné par le cache', nombre(global.total - global.cout) + ' jetons, soit '
      + Math.round(global.part * 100) + ' %');
    if (!visee) {
      morceaux.push(jaugeCache(global.part, 'du prix plein épargné sur tout l’agent',
        ['tout au prix fort', '45 %', 'plafond : 90 %']));
    }
    const faibles = (agent.requetesModele || [])
      .map((r) => ({ r, e: economieCache(r.jetons) })).filter((x) => x.e)
      .filter((x) => x.e.part < 0.7);
    ligne(dl, 'Appels sous 70 %', faibles.length
      ? faibles.length + '  —  ' + faibles.slice(0, 6).map((x) => heure(x.r.appel)).join(', ')
        + (faibles.length > 6 ? '…' : '')
      : 'aucun');
  }

  const p = document.createElement('p');
  p.className = 'avert';
  const q = document.createElement('p');
  q.className = 'avert';
  q.style.fontStyle = 'normal';
  q.style.color = 'var(--texte-faible)';
  q.textContent = 'Un appel qui épargne peu suit presque toujours une pause : le cache '
    + 'expire, et le retour le réécrit. Mesuré sur la session la plus longue de cette '
    + 'machine, 2 880 appels : des 22 qui tombent sous 70 %, 18 suivent un silence de plus '
    + 'de cinq minutes, l’écart médian étant de 2 h 36 — contre 2,3 s pour les autres. '
    + 'Ce n’est donc pas une faute de conduite, c’est le prix d’une interruption.';
  morceaux.push(q);

  const avert = document.createElement('p');
  avert.className = 'avert';
  avert.textContent = 'Les tarifs employés sont des rapports, pas une monnaie : écrire au '
    + 'cache coûte 1,25 fois le prix plein, y lire 0,1 fois. L’économie est donc exacte en '
    + 'proportion et muette en euros — le transcript ne porte aucun prix. Le plafond est '
    + '90 % : même entièrement relu, un contexte coûte encore un dixième. Et le premier '
    + 'appel d’un agent est toujours bas sans que personne n’ait mal fait : il n’y a rien '
    + 'à relire avant de l’avoir écrit.';
  morceaux.push(avert);

  ouvrirPanneau('buffer', visee ? 'Buffer CTX — un appel' : 'Buffer CTX — ' + agent.nom, morceaux);
}

function carteContenu(agent, requete) {
  const c = requete?.composition || {};
  const total = totalComposition(c);
  const nombre = (n) => (n || 0).toLocaleString('fr-FR');

  const dl = document.createElement('dl');
  ligne(dl, 'À l’appel de', requete ? heure(requete.appel) : null);
  ligne(dl, 'Éléments', String(c.n || 0));
  ligne(dl, 'Caractères attribués', nombre(total));
  for (const part of PARTS_CONTENU.slice().reverse()) {
    ligne(dl, '— ' + part.nom, nombre(c[part.cle])
      + (total ? '   (' + Math.round(((c[part.cle] || 0) / total) * 100) + ' %)' : ''));
  }

  const morceaux = [dl];

  // Ce que le transcript n'explique pas. Un jeton vaut environ quatre caractères de texte
  // ordinaire ; le rapport mesuré dit donc quelle part du contexte on sait nommer.
  const jetons = requete
    ? (requete.jetons.entree + requete.jetons.cacheLu + requete.jetons.cacheEcrit)
    : 0;
  if (jetons > 0 && total > 0) {
    const estimation = total / 4;
    const part = Math.max(0, Math.min(1, estimation / jetons));
    ligne(dl, 'Contexte mesuré', nombre(jetons) + ' jetons');
    morceaux.push(jaugeCache(part, 'du contexte est nommé par le transcript',
      ['rien d’identifiable', '50 %', 'tout nommé']));
    const p = document.createElement('p');
    p.className = 'avert';
    p.textContent = 'Le reste — l’invite système complète, les définitions d’outils, la '
      + 'mémoire du projet — ne figure pas dans le transcript et ne peut donc pas être '
      + 'détaillé ici. L’estimation compte quatre caractères par jeton ; sur cette session '
      + 'le rapport mesuré est de 1,37 caractère attribué par jeton de contexte, soit '
      + 'environ un tiers.';
    morceaux.push(p);
  }

  // La lecture du contexte lui-même, chargée après coup.
  if (requete) {
    const details = document.createElement('details');
    details.className = 'bloc';
    const s = document.createElement('summary');
    s.textContent = 'lire le contexte envoyé à cet appel';
    const hote = document.createElement('div');
    details.append(s, hote);
    let charge = false;
    details.addEventListener('toggle', () => {
      if (details.open && !charge) { charge = true; montrerContenuContexte(agent, requete, hote); }
    });
    morceaux.push(details);
  }

  ouvrirPanneau('contenu du contexte', agent.nom, morceaux);
}

/** Carte de l'attente : le détail d'une période, et le compte de toutes. */
function carteAttentes(agent, visee) {
  const parGenre = {};
  for (const at of agent.attentes) {
    if (!parGenre[at.genre]) parGenre[at.genre] = { n: 0, ms: 0 };
    parGenre[at.genre].n += 1;
    parGenre[at.genre].ms += at.dureeMs || 0;
  }
  const total = Object.values(parGenre).reduce((n, v) => n + v.ms, 0);

  const dl = document.createElement('dl');
  if (visee) {
    ligne(dl, 'Cette attente', NOM_ATTENTE[visee.genre]);
    ligne(dl, 'Durée', duree(visee.dureeMs) + (visee.ouverte ? '  (toujours en cours)' : ''));
    ligne(dl, 'Début', heure(visee.debut));
    ligne(dl, 'Fin', visee.fin ? heure(visee.fin) : 'pas encore');
    ligne(dl, 'Contexte', visee.detail);
  }
  ligne(dl, 'Attente totale', duree(total) + ' sur ' + agent.attentes.length + ' périodes');
  for (const [genre, v] of Object.entries(parGenre).sort((a, b) => b[1].ms - a[1].ms)) {
    ligne(dl, '— ' + genre, v.n + ' fois, ' + duree(v.ms));
  }

  const p = document.createElement('p');
  p.className = 'avert';
  p.textContent = 'Une attente est un intervalle de plus de trente secondes sans aucun '
    + 'événement — ni appel d’outil, ni parole de l’agent — ou bien une question posée et '
    + 'restée sans réponse. Les pauses de réflexion de l’agent ne comptent pas : ses '
    + 'propres messages sont des événements.';
  ouvrirPanneau('attente', agent.nom, [dl, p]);
}

function carteRequete(r) {
  ouvrirPanneau('requête', heure(r.instant), [blocReplie('texte', r.texte, true)]);
}

// Les pas d'une règle du temps, du plus fin au plus large. On choisit le premier qui
// laisse assez de place entre deux étiquettes pour qu'elles ne se chevauchent pas.
// Les pas retenus suivent une préférence : l'heure ronde d'abord, puis les dizaines de
// minutes (:00, :10, :20…), puis les multiples de cinq, puis la minute. En dessous, la
// même progression en secondes. Les pas intermédiaires — le quart d'heure, la demi-heure,
// les deux minutes — sont écartés : ils donnent des repères qu'on lit moins vite.
const PAS_REGLE = [
  1000, 5000, 10000, 30000,
  60000, 5 * 60000, 10 * 60000,
  3600000, 2 * 3600000, 3 * 3600000, 6 * 3600000, 12 * 3600000,
  86400000, 2 * 86400000, 7 * 86400000, 28 * 86400000,
];

function etiquetteTemps(instant, pas) {
  const d = new Date(instant);
  const deuxChiffres = (n) => String(n).padStart(2, '0');
  if (pas < 60000) {
    return deuxChiffres(d.getHours()) + ':' + deuxChiffres(d.getMinutes())
      + ':' + deuxChiffres(d.getSeconds());
  }
  if (pas < 86400000) return deuxChiffres(d.getHours()) + 'h' + deuxChiffres(d.getMinutes());
  return deuxChiffres(d.getDate()) + '/' + deuxChiffres(d.getMonth() + 1);
}

/**
 * La règle du temps, en haut de la piste.
 *
 * Elle se calcule **par segment actif** et non sur toute la largeur : avec les temps morts
 * repliés, le temps n'avance pas au même rythme d'un bout à l'autre, et une graduation
 * régulière en pixels mentirait. Chaque segment reçoit donc ses propres graduations, à des
 * instants ronds de l'heure locale, et le pas est choisi d'après l'échelle courante.
 */
function dessinerRegle(axe, pxParMs, hauteur, vue) {
  const g = el('g', {});
  const place = 72; // largeur minimale réservée à une étiquette
  const pas = PAS_REGLE.find((p) => p * pxParMs >= place) || PAS_REGLE[PAS_REGLE.length - 1];

  g.append(el('line', {
    x1: Math.max(0, vue.x0), y1: REGLE_BAS, x2: Math.min(axe.largeur, vue.x1), y2: REGLE_BAS,
    stroke: 'var(--trait)', 'stroke-width': 1,
  }));

  // Une étiquette n'est écrite que si la place est libre. Le trait de graduation, lui,
  // reste toujours : il ne peut pas se chevaucher, et il garde la verticale lisible.
  // `occuper` retient l'abscisse de la dernière étiquette écrite, et non sa fin : y
  // ajouter `place` reviendrait à exiger deux fois l'écartement voulu, et une étiquette
  // sur deux sauterait — c'est ce qui donnait des pas de deux minutes là où la minute
  // tenait largement.
  let derniereEtiquette = -Infinity;
  const placeLibre = (x) => x - derniereEtiquette >= place;
  const occuper = (x) => { derniereEtiquette = x; };

  let jourPrecedent = null;
  for (const s of axe.segments) {
    if (s.vide) continue;

    // Un repère au départ de chaque segment actif, quoi qu'il arrive. Sans lui, à grande
    // échelle le pas retenu peut dépasser la durée du segment et la règle resterait
    // muette — constaté : 12 h de pas pour des segments de quelques heures.
    const xd = axe.x(s.t0);
    if (s.x1 < vue.x0 || s.x0 > vue.x1) continue; // segment hors de vue : rien à graduer
    g.append(el('line', {
      x1: xd, y1: REGLE_BAS - 8, x2: xd, y2: REGLE_BAS,
      stroke: 'var(--texte)', 'stroke-width': 1, opacity: '.5',
    }));
    const dep = new Date(s.t0);
    if (placeLibre(xd)) {
      const bornes = el('text', {
        x: xd + 3, y: REGLE_BAS - 7, fill: 'var(--texte)', 'font-size': '9.5',
        opacity: '.85',
      });
      bornes.textContent = String(dep.getDate()).padStart(2, '0') + '/'
        + String(dep.getMonth() + 1).padStart(2, '0') + ' '
        + String(dep.getHours()).padStart(2, '0') + 'h'
        + String(dep.getMinutes()).padStart(2, '0');
      bornes.append(el('title', {}, document.createTextNode(heure(s.t0))));
      g.append(bornes);
      occuper(xd);
    }
    jourPrecedent = dep.toDateString();

    // On s'aligne sur des instants ronds de l'heure **locale**, pas de l'époque.
    const decalage = new Date(s.t0).getTimezoneOffset() * 60000;
    let t = Math.ceil((s.t0 - decalage) / pas) * pas + decalage;
    // On saute directement au premier instant visible plutôt que de parcourir des
    // dizaines de milliers de graduations hors champ.
    if (axe.x(t) < vue.x0) {
      const sauts = Math.floor((vue.x0 - axe.x(t)) / (pas * pxParMs));
      if (sauts > 0) t += sauts * pas;
    }
    for (; t <= s.t1; t += pas) {
      const x = axe.x(t);
      if (x > vue.x1) break;
      if (x < vue.x0) continue;
      if (x - xd < place * 0.6) continue; // trop près du repère de départ : illisible
      g.append(el('line', {
        x1: x, y1: REGLE_BAS - 5, x2: x, y2: REGLE_BAS,
        stroke: 'var(--texte-faible)', 'stroke-width': 1, opacity: '.7',
      }));
      // Un filet très pâle descend sur toute la hauteur : on suit la verticale à l'œil.
      g.append(el('line', {
        x1: x, y1: REGLE_BAS, x2: x, y2: hauteur,
        stroke: 'var(--texte)', 'stroke-width': 1, opacity: '.045',
      }));
      const jour = new Date(t).toDateString();
      if (!placeLibre(x)) { jourPrecedent = jour; continue; }
      const et = el('text', {
        x: x + 3, y: REGLE_BAS - 7, fill: 'var(--texte-faible)', 'font-size': '9.5',
      });
      et.textContent = etiquetteTemps(t, pas);
      g.append(et);
      occuper(x);

      // Le jour ne s'écrit qu'au changement de date, sous l'heure.
      if (jour !== jourPrecedent && pas < 86400000) {
        const dt = new Date(t);
        const ej = el('text', {
          x: x + 3, y: REGLE_BAS + 10, fill: 'var(--texte-faible)',
          'font-size': '8.5', opacity: '.8',
        });
        ej.textContent = String(dt.getDate()).padStart(2, '0') + '/'
          + String(dt.getMonth() + 1).padStart(2, '0');
        g.append(ej);
      }
      jourPrecedent = jour;
    }
  }
  return g;
}

/**
 * La taille du contexte, en aire remplie d'un dégradé vertical : vert en bas quand il
 * reste de la place, rouge en haut quand la fenêtre sature. Le dégradé étant vertical,
 * c'est la hauteur de la courbe qui décide de la couleur — pas de calcul par point.
 *
 * La référence est le plus haut niveau atteint **dans toute la session**, agents compris,
 * et non le pic propre à chaque agent : sans quoi un sous-agent à 15 k jetons s'afficherait
 * aussi rouge que l'agent racine à un million, ce qui est faux. Quand la session a connu un
 * compactage, ce pic commun **est** la fenêtre réelle, puisque c'est lui qui l'a déclenché.
 */
function dessinerVoieContexte(agent, centre, axe, ref) {
  const g = el('g', {});
  const points = agent.contexte;
  const pic = ref.pic;
  const haut = centre - 13;
  const bas = centre + 13;
  const y = (jetons) => bas - (jetons / pic) * (bas - haut);

  const chemin = [];
  for (const c of points) chemin.push(`${axe.x(c.instant).toFixed(1)},${y(c.jetons).toFixed(1)}`);
  if (chemin.length < 2) return g;

  const x0 = axe.x(points[0].instant);
  const x1 = axe.x(points[points.length - 1].instant);
  g.append(el('polygon', {
    points: `${x0.toFixed(1)},${bas} ${chemin.join(' ')} ${x1.toFixed(1)},${bas}`,
    // Le dégradé ne sort que lorsqu'on sait ce qu'il mesure.
    fill: ref.fenetreConnue ? 'url(#degrade-contexte)' : 'var(--termine)',
    opacity: ref.fenetreConnue ? '.8' : '.75',
  }));
  g.append(el('polyline', {
    points: chemin.join(' '), fill: 'none',
    stroke: 'var(--texte)', 'stroke-width': .7, opacity: '.45',
  }));

  // Une prise par dixième de la largeur, pour lire une valeur au survol sans surcharger.
  const pas = Math.max(1, Math.floor(points.length / 60));
  for (let i = 0; i < points.length; i += pas) {
    const c = points[i];
    const px = axe.x(c.instant);
    const prise = el('rect', { x: px - 3, y: haut, width: 6, height: bas - haut, fill: 'transparent' });
    prise.style.cursor = 'pointer';
    prise.addEventListener('click', (e) => { e.stopPropagation(); carteContexte(agent); });
    prise.append(el('title', {}, document.createTextNode(
      c.jetons.toLocaleString('fr-FR') + ' jetons de contexte  ('
      + Math.round((c.jetons / pic) * 100)
      + (ref.fenetreConnue ? ' % de la fenêtre' : ' % du plus haut niveau de la session')
      + ')\n' + heure(c.instant)
      + (ref.fenetreConnue ? '' : '\n\nCette session n’a jamais compacté : on ignore la '
        + 'taille réelle de la fenêtre, donc l’échelle est relative et la couleur neutre.'))));
    g.append(prise);
  }
  return g;
}

/**
 * La voie d'un modèle. Chaque appel se lit en trois temps : le trait de l'appel, la ligne
 * fine de l'attente, puis le rectangle de la réponse. Le décalage entre le trait et le
 * rectangle *est* la latence — c'est ce qu'on vient voir.
 */
function dessinerVoieModele(agent, modele, centre, axe, visible) {
  const g = el('g', {});
  const couleur = teinteModele(modele);
  for (const r of agent.requetesModele) {
    if (r.modele !== modele) continue;
    const xa = axe.x(r.appel);
    const xd = axe.x(r.debut);
    const xf = Math.max(xd + 1.5, axe.x(r.fin));
    if (!visible(xa, xf)) continue;

    // L'attente avant la première parole du modèle.
    if (xd - xa > 0.6) {
      g.append(el('line', {
        x1: xa, y1: centre, x2: xd, y2: centre,
        stroke: couleur, 'stroke-width': 1.2, opacity: '.4',
      }));
    }
    // L'instant de l'appel.
    g.append(el('rect', {
      x: xa - 0.9, y: centre - 7, width: 1.8, height: 14, fill: couleur, opacity: '.8',
    }));
    // La réponse.
    g.append(el('rect', {
      x: xd, y: centre - 5.5, width: xf - xd, height: 11, rx: 2,
      fill: couleur, opacity: '.85',
    }));

    const prise = el('rect', {
      x: Math.min(xa, xd) - 3, y: centre - 10,
      width: Math.max(6, xf - Math.min(xa, xd) + 6), height: 20, fill: 'transparent',
    });
    prise.style.cursor = 'pointer';
    prise.append(el('title', {}, document.createTextNode(
      modele + '\nappelé à ' + heure(r.appel)
      + '\nattente avant la réponse : ' + duree(r.latenceMs)
      + '\nréponse : ' + (r.reponseMs ? duree(r.reponseMs) : 'd’un seul bloc, durée non mesurable')
      + '\n' + r.blocs + ' bloc(s)' + (r.arret ? '  ·  ' + r.arret : '')
      + '\n' + (r.jetons?.entree || 0).toLocaleString('fr-FR') + ' jetons en entrée, '
      + (r.jetons?.sortie || 0).toLocaleString('fr-FR') + ' en sortie'
      + (r.declencheur ? '\n\ndéclenché par ' + r.declencheur : ''))));
    prise.addEventListener('click', (e) => { e.stopPropagation(); carteModele(agent, modele, r); });
    g.append(prise);
  }
  return g;
}

const COULEUR_ATTENTE = {
  question: 'var(--requete)',
  sommeil: 'var(--boucle)',
  inoccupée: 'var(--attente)',
};
const NOM_ATTENTE = {
  question: 'une question posée, sans réponse encore',
  sommeil: 'une boucle qui dort entre deux tours',
  inoccupée: 'le tour est fini, personne n’a repris la main',
};

const FORME_OUTILLAGE = {
  offerts: 'plein', retirés: 'creux', remontés: 'losange',
  serveurs: 'carré', restreint: 'croix', mode: 'croix',
};
const NOM_OUTILLAGE = {
  offerts: 'des outils offerts', retirés: 'des outils retirés',
  remontés: 'des outils remontés en cours de route',
  serveurs: 'un serveur MCP branché', restreint: 'l’outillage restreint',
  mode: 'le mode de permission a changé',
};

/**
 * La voie de l'outillage : ce que l'agent a le droit d'appeler, et les instants où cela
 * change. Les événements sont rares — une poignée par session — donc des marques, pas des
 * barres : une voie remplie laisserait croire à une activité continue qu'il n'y a pas.
 */
/**
 * La voie des hooks : ce qui s'exécute **autour** de chaque geste de l'agent, et qui
 * décide de ce qui a le droit de se produire.
 *
 * Le transcript les écrit depuis toujours — 32 609 enregistrements sur cette machine —
 * et ils n'étaient montrés nulle part. Chacun porte son `toolUseID`, donc chaque marque
 * sait quel appel d'outil elle encadre.
 *
 * ⚠️ La durée ne peut pas être une largeur : la médiane d'un `PreToolUse` est de 41 ms,
 * soit un dixième de pixel à l'échelle courante. Ce sont donc des **marques**, et c'est la
 * carte qui donne les durées. Ce qui se lit à l'œil est la **densité** — deux traits par
 * appel d'outil — et les événements de cycle de vie, qui traversent la voie.
 */
function dessinerVoieHooks(agent, centre, axe, visible) {
  const g = el('g', {});
  const AVANT = new Set(['PreToolUse']);
  const APRES = new Set(['PostToolUse', 'PostToolUseFailure']);
  for (const h of agent.hooks || []) {
    if (h.instant === null) continue;
    const x = axe.x(h.instant);
    if (!visible(x - 6, x + 6)) continue;
    const couleur = !h.ok ? 'var(--outil-echec)' : h.injecte ? 'var(--requete)' : 'var(--hook)';
    if (h.injecte) {
      // Un hook qui parle : son contenu entre vraiment dans la conversation. Rare — cinq
      // fois sur toute la machine — et c'est pour ça qu'il a une forme à lui.
      g.append(el('path', {
        d: `M ${x} ${centre - 7} L ${x + 5} ${centre} L ${x} ${centre + 7} L ${x - 5} ${centre} Z`,
        fill: couleur, opacity: '.95',
      }));
    } else if (AVANT.has(h.evenement)) {
      g.append(el('rect', { x: x - 0.9, y: centre - 8, width: 1.8, height: 8, fill: couleur, opacity: '.85' }));
    } else if (APRES.has(h.evenement)) {
      g.append(el('rect', { x: x - 0.9, y: centre, width: 1.8, height: 8, fill: couleur, opacity: '.85' }));
    } else {
      // SessionStart, SubagentStart, Stop : les bornes du cycle de vie, qui traversent.
      g.append(el('rect', { x: x - 1.2, y: centre - 9, width: 2.4, height: 18, rx: 1, fill: couleur, opacity: '.9' }));
    }
    const prise = el('rect', { x: x - 6, y: centre - 11, width: 12, height: 22, fill: 'transparent' });
    prise.style.cursor = 'pointer';
    prise.append(el('title', {}, document.createTextNode(
      h.nom + (h.ok ? '' : '  — ÉCHEC')
      + '\n' + heure(h.instant)
      + (h.dureeMs !== null ? '\ndurée ' + h.dureeMs + ' ms' : '')
      + (h.code !== null ? '\ncode de sortie ' + h.code : '')
      + (h.idAppel ? '\nautour de l’appel ' + h.idAppel.slice(0, 18) : '')
      + (h.injecte ? '\n\ninjecte dans la conversation :\n' + h.injecte.slice(0, 200) : ''))));
    prise.addEventListener('click', (ev) => { ev.stopPropagation(); carteHooks(agent, h); });
    g.append(prise);
  }
  return g;
}

function dessinerVoieOutillage(agent, centre, axe, visible) {
  const g = el('g', {});
  for (const e of agent.outillage) {
    if (e.instant === null) continue;
    const x = axe.x(e.instant);
    if (!visible(x - 6, x + 6)) continue;
    const forme = FORME_OUTILLAGE[e.genre] || 'plein';
    if (forme === 'losange' || forme === 'croix') {
      const d = forme === 'losange'
        ? `M ${x} ${centre - 7} L ${x + 6} ${centre} L ${x} ${centre + 7} L ${x - 6} ${centre} Z`
        : `M ${x - 5} ${centre - 5} L ${x + 5} ${centre + 5} M ${x + 5} ${centre - 5} L ${x - 5} ${centre + 5}`;
      g.append(el('path', {
        d, fill: forme === 'losange' ? 'var(--outillage)' : 'none',
        stroke: 'var(--outillage)', 'stroke-width': forme === 'croix' ? 1.8 : 0, opacity: '.95',
      }));
    } else if (forme === 'carré') {
      g.append(el('rect', {
        x: x - 4.5, y: centre - 4.5, width: 9, height: 9, rx: 1.5,
        fill: 'none', stroke: 'var(--outillage)', 'stroke-width': 1.6, opacity: '.95',
      }));
    } else {
      g.append(el('rect', {
        x: x - 1.4, y: centre - 8, width: 2.8, height: 16, rx: 1,
        fill: forme === 'plein' ? 'var(--outillage)' : 'none',
        stroke: 'var(--outillage)', 'stroke-width': forme === 'creux' ? 1.4 : 0, opacity: '.9',
      }));
    }
    const prise = el('rect', {
      x: x - 8, y: centre - 11, width: 16, height: 22, fill: 'transparent',
    });
    prise.style.cursor = 'pointer';
    prise.append(el('title', {}, document.createTextNode(
      NOM_OUTILLAGE[e.genre] + '\n' + heure(e.instant)
      + (e.detail ? '\n' + e.detail : '')
      + (e.total !== undefined ? '\n' + e.total + ' outils offerts à cet instant' : '')
      + (e.noms && e.noms.length ? '\n\n' + e.noms.slice(0, 12).join(', ')
        + (e.noms.length > 12 ? ', …' : '') : ''))));
    prise.addEventListener('click', (ev) => { ev.stopPropagation(); carteOutillage(agent, e); });
    g.append(prise);
  }
  return g;
}

/**
 * La voie des fichiers : un diff de part et d'autre d'une ligne de base, le vert vers le
 * haut pour ce qui est ajouté, le rose vers le bas pour ce qui est retiré. Les hauteurs
 * suivent la racine du nombre de lignes — un fichier de mille lignes ne doit pas réduire
 * une correction de trois lignes à rien.
 */
function dessinerVoieFichiers(agent, centre, axe, visible) {
  const g = el('g', {});
  const ops = agent.outils.filter((o) => o.fichier && o.debut !== null);
  if (!ops.length) return g;
  const pic = Math.max(1, ...ops.map((o) => Math.max(o.fichier.plus, o.fichier.moins)));
  // La voie se partage : le diff occupe le haut autour de sa ligne de base, la courbe du
  // nombre de fichiers occupe une bande au ras du bas. Les deux mesurent des choses
  // différentes, les mélanger sur la même amplitude les rendait illisibles toutes les deux.
  const base = centre - 4;
  const demi = 8;
  const basCourbe = centre + 13;
  const hauteurCourbe = 11;

  // En fond, la courbe du nombre de fichiers que l'agent a fait exister : elle monte à
  // chaque fichier écrit pour la première fois, descend quand il en supprime un qu'il
  // avait écrit. Un escalier et non une courbe lissée — le compte change par bonds, et
  // lisser laisserait croire à une progression continue.
  const courbe = agent.courbeFichiers;
  if (courbe && courbe.points.length > 1) {
    const plafond = Math.max(1, ...courbe.points.map((q) => q.nombre));
    const bas = basCourbe;
    const y = (n) => bas - (n / plafond) * hauteurCourbe;
    const fin = axe.x(agent.fin ?? deroule.fin);
    const marches = [];
    let precedent = null;
    for (const q of courbe.points) {
      const x = axe.x(q.instant);
      if (precedent !== null) marches.push(`${x.toFixed(1)},${y(precedent).toFixed(1)}`);
      marches.push(`${x.toFixed(1)},${y(q.nombre).toFixed(1)}`);
      precedent = q.nombre;
    }
    marches.push(`${fin.toFixed(1)},${y(precedent).toFixed(1)}`);
    const depart = axe.x(courbe.points[0].instant);
    // Pas de remplissage : l'aire se disputerait l'espace avec les barres du diff, qui
    // partent de la même ligne de base. Un trait franc se distingue d'elles sans effort.
    g.append(el('polyline', {
      points: marches.join(' '), fill: 'none',
      stroke: 'var(--outillage)', 'stroke-width': 1.6, opacity: '.9',
      'stroke-linejoin': 'round',
    }));
    // Le compte courant, répété à gauche de la fenêtre pour rester lisible où qu'on soit.
    for (const ancre of [depart, fin]) {
      const et = el('text', {
        x: ancre === depart ? depart + 4 : fin - 4,
        y: y(ancre === depart ? courbe.points[0].nombre : precedent) - 2,
        'text-anchor': ancre === depart ? 'start' : 'end',
        fill: 'var(--outillage)', 'font-size': '9', opacity: '.95',
      });
      et.textContent = (ancre === depart ? courbe.points[0].nombre : precedent) + ' fich.';
      g.append(et);
    }
  }

  g.append(el('line', {
    x1: axe.x(agent.debut), y1: base, x2: axe.x(agent.fin ?? deroule.fin), y2: base,
    stroke: 'var(--texte-faible)', 'stroke-width': 1, opacity: '.3',
  }));

  for (const o of ops) {
    const x = axe.x(o.debut);
    if (!visible(x - 3, x + 3)) continue;
    const f = o.fichier;
    if (f.genre === 'lu') {
      g.append(el('rect', {
        x: x - 1, y: base - 2.5, width: 2, height: 5, rx: 1,
        fill: 'var(--texte-faible)', opacity: '.8',
      }));
    } else {
      if (f.plus > 0) {
        const h = Math.max(2, Math.sqrt(f.plus / pic) * demi);
        g.append(el('rect', {
          x: x - 1.3, y: base - h, width: 2.6, height: h, rx: 1,
          fill: 'var(--outil)', opacity: '.9',
        }));
      }
      if (f.moins > 0) {
        const h = Math.max(2, Math.sqrt(f.moins / pic) * demi);
        g.append(el('rect', {
          x: x - 1.3, y: base, width: 2.6, height: h, rx: 1,
          fill: 'var(--outil-echec)', opacity: '.9',
        }));
      }
    }
    const prise = el('rect', {
      x: x - 4, y: base - demi - 3, width: 8, height: demi * 2 + 6, fill: 'transparent',
    });
    prise.style.cursor = 'pointer';
    const court = f.chemin.split('/').slice(-2).join('/');
    prise.append(el('title', {}, document.createTextNode(
      f.genre + ' — ' + court
      + '\n' + heure(o.debut)
      + (f.genre === 'lu' ? '' : '\n+' + f.plus + ' / −' + f.moins + ' lignes')
      + (f.remplace ? '\n(un Write : on ignore ce qui a été remplacé)' : '')
      + (f.partout ? '\n(remplacement partout dans le fichier)' : '')
      + '\n\n' + f.chemin)));
    prise.addEventListener('click', (e) => { e.stopPropagation(); carteOutil(o, agent); });
    g.append(prise);
  }
  return g;
}

/**
 * La voie de réflexion. Une barre par appel où le modèle a réfléchi, de hauteur
 * proportionnelle à la racine du nombre de jetons : la médiane est à 248 jetons et le pic
 * à 3 475, donc une échelle linéaire écraserait les quatre cinquièmes des barres contre la
 * ligne de base. L'absence de barre est un signal aussi : ce tour-là, il n'a pas réfléchi.
 */
function dessinerVoieReflexion(agent, centre, axe, visible) {
  const g = el('g', {});
  const avec = agent.requetesModele.filter((r) => r.jetons.reflexion > 0);
  if (!avec.length) return g;
  const pic = Math.max(...avec.map((r) => r.jetons.reflexion));
  const bas = centre + 11;
  const hauteurMax = 22;

  g.append(el('line', {
    x1: axe.x(agent.debut), y1: bas, x2: axe.x(agent.fin ?? deroule.fin), y2: bas,
    stroke: 'var(--reflexion)', 'stroke-width': 1, opacity: '.25',
  }));

  for (const r of avec) {
    const x = axe.x(r.debut);
    if (!visible(x - 2, x + 2)) continue;
    const h = Math.max(2, Math.sqrt(r.jetons.reflexion / pic) * hauteurMax);
    g.append(el('rect', {
      x: x - 1.1, y: bas - h, width: 2.2, height: h, rx: 1,
      fill: 'var(--reflexion)', opacity: '.85',
    }));
    const prise = el('rect', {
      x: x - 3.5, y: bas - hauteurMax - 2, width: 7, height: hauteurMax + 6,
      fill: 'transparent',
    });
    prise.style.cursor = 'pointer';
    prise.append(el('title', {}, document.createTextNode(
      r.jetons.reflexion.toLocaleString('fr-FR') + ' jetons de réflexion'
      + '\n' + heure(r.debut)
      + '\n' + r.jetons.sortie.toLocaleString('fr-FR') + ' jetons de sortie en tout'
      + (r.outils.length ? '\npuis ' + r.outils.join(', ') : '\npuis aucun outil')
      + '\n\nle contenu de la réflexion n’est pas conservé')));
    prise.addEventListener('click', (e) => { e.stopPropagation(); carteModele(agent, r.modele, r); });
    g.append(prise);
  }
  return g;
}

/** Ce qu'un tour contient : les appels d'outils et les requêtes au modèle qui tombent dedans. */
function contenuDuTour(agent, tour) {
  const dedans = (x) => x >= tour.debut && x <= tour.fin;
  const outils = agent.outils.filter((o) => o.debut !== null && dedans(o.debut));
  const requetes = (agent.requetesModele || []).filter((r) => dedans(r.appel));
  const tempsOutils = outils.reduce((n, o) => n + (o.dureeMs || 0), 0);
  const tempsModele = requetes.reduce((n, r) => n + r.latenceMs + r.reponseMs, 0);
  return { outils, requetes, tempsOutils, tempsModele };
}

/**
 * La voie des tours. Un tour est la seule mesure exacte du temps où la machine travaille :
 * Claude Code en écrit la durée à sa fin. Ce qui sépare deux barres n'est pas du travail
 * plus discret — c'est de l'attente.
 *
 * L'intensité de la barre suit le nombre d'appels qu'elle contient : un tour qui enchaîne
 * trente commandes ne doit pas se lire comme un tour qui en passe une.
 */
function dessinerVoieTours(agent, centre, axe, visible) {
  const g = el('g', {});
  const charges = agent.tours.map((tr) => contenuDuTour(agent, tr).outils.length);
  const plafond = Math.max(1, ...charges);
  agent.tours.forEach((tr, i) => {
    const x0 = axe.x(tr.debut);
    const x1 = Math.max(x0 + 1.5, axe.x(tr.fin));
    if (!visible(x0, x1)) return;
    const part = Math.min(1, charges[i] / plafond);
    g.append(el('rect', {
      x: x0, y: centre - 7, width: x1 - x0, height: 14, rx: 2,
      fill: 'var(--en-cours)', opacity: (0.35 + 0.55 * Math.sqrt(part)).toFixed(2),
    }));
    const texte = duree(tr.dureeMs);
    if (x1 - x0 >= texte.length * 5.2 + 8) {
      const et = el('text', {
        x: (x0 + x1) / 2, y: centre + 16, 'text-anchor': 'middle',
        fill: 'var(--en-cours)', 'font-size': '9', opacity: '.95',
      });
      et.textContent = texte;
      g.append(et);
    }
    const prise = el('rect', {
      x: x0 - 2, y: centre - 10, width: (x1 - x0) + 4, height: 26, fill: 'transparent',
    });
    prise.style.cursor = 'pointer';
    const c = contenuDuTour(agent, tr);
    prise.append(el('title', {}, document.createTextNode(
      'tour de ' + duree(tr.dureeMs)
      + '\ndu ' + heure(tr.debut) + '\nau ' + heure(tr.fin)
      + '\n' + c.outils.length + ' appel(s) d’outil, ' + c.requetes.length + ' requête(s) au modèle')));
    prise.addEventListener('click', (e) => { e.stopPropagation(); carteTours(agent, tr); });
    g.append(prise);
  });
  return g;
}

/**
 * La voie des outils. Elle était auparavant posée sur la barre de l'agent, qu'elle
 * recouvrait : un appel long — un appel d'agent, une question à l'utilisateur — masquait
 * l'agent lui-même, et le bord de la barre en devenait illisible.
 */
function dessinerVoieOutils(agent, centre, axe, visible) {
  const g = el('g', {});
  const yDuree = centre + 2;
  const hautPrise = centre - 11;
  const hauteurPrise = 24;

  // Les reprises : un arc qui relie l'échec à l'appel qui le rattrape. Mesuré sur le
  // corpus, l'agent relance presque toujours le même outil avec une entrée corrigée —
  // c'est ce geste de correction qu'on veut voir, pas seulement la marque rouge.
  const parId = new Map(agent.outils.map((o) => [o.id, o]));
  for (const o of agent.outils) {
    if (!o.repriseParId) continue;
    const cible = parId.get(o.repriseParId);
    if (!cible || o.debut === null || cible.debut === null) continue;
    const xa = axe.x(o.debut);
    const xb = axe.x(cible.debut);
    if (!visible(Math.min(xa, xb) - 6, Math.max(xa, xb) + 6)) continue;
    const haut = centre - 15;
    const milieu = (xa + xb) / 2;
    g.append(el('path', {
      d: `M ${xa.toFixed(1)} ${centre - 10} Q ${milieu.toFixed(1)} ${haut - 6} ${xb.toFixed(1)} ${centre - 10}`,
      fill: 'none', stroke: 'var(--outil-echec)', 'stroke-width': 1.2, opacity: '.85',
    }));
    // Une pointe sur l'appel qui reprend.
    g.append(el('path', {
      d: `M ${(xb - 3).toFixed(1)} ${centre - 14} L ${xb.toFixed(1)} ${(centre - 9).toFixed(1)} `
        + `L ${(xb + 3).toFixed(1)} ${centre - 14} Z`,
      fill: 'var(--outil-echec)', opacity: '.9',
    }));
  }
  for (const o of agent.outils) {
    if (o.debut === null) continue;
    const ox = axe.x(o.debut);
    const largeur = o.fin !== null ? Math.max(1.5, axe.x(o.fin) - ox) : 1.5;
    if (!visible(ox, ox + largeur)) continue;
    const estAgent = o.nom === 'Agent' || o.nom === 'Task';
    const couleur = o.ok === false ? 'var(--outil-echec)'
      : estAgent ? 'var(--outil-agent)' : 'var(--outil)';
    if (largeur > 2) {
      g.append(el('rect', {
        x: ox, y: yDuree, width: largeur, height: HAUTEUR_DUREE, rx: 1.5,
        fill: couleur, opacity: '.6',
      }));
    }
    g.append(el('rect', {
      x: ox, y: hautPrise, width: 1.8, height: hauteurPrise, fill: couleur,
    }));
    const prise = el('rect', {
      x: ox - 3, y: hautPrise, width: Math.max(LARGEUR_PRISE_MIN, largeur + 6),
      height: hauteurPrise, fill: 'transparent',
    });
    const suite = o.suite === 'corrigée' ? '\nrepris juste après, avec une entrée corrigée'
      : o.suite === 'identique' ? '\nrelancé juste après, à l’identique'
      : o.suite === 'autre' ? '\npas de reprise : l’agent est passé à autre chose'
      : o.suite === 'rien' ? '\npas de reprise : c’était son dernier appel' : '';
    const reprend = o.reprendId
      ? '\nreprend un ' + o.repriseDe + ' qui a échoué' : '';
    prise.append(el('title', {}, document.createTextNode(
      o.nom + (o.ok === false ? '  — ÉCHEC' : '')
      + '\n' + heure(o.debut) + '\ndurée ' + duree(o.dureeMs)
      + suite + reprend
      + (o.resume ? '\n\n' + o.resume.slice(0, 300) : ''))));
    prise.style.cursor = 'pointer';
    prise.addEventListener('click', (e) => {
      e.stopPropagation();
      vise = agent.id; dessiner();
      const b = o.boucle && (agent.boucles || []).find((x) => x.id === o.boucle);
      if (b) carteBoucle(b, agent, o.rang); else carteOutil(o, agent);
    });
    g.append(prise);
  }
  return g;
}

/**
 * La voie d'attente : les moments où le système ne travaille pas mais patiente. Une
 * attente sans fin — la session tourne encore et personne ne répond — reste ouverte à
 * droite, en pointillés, comme une barre d'agent en cours.
 */
function dessinerVoieAttente(agent, centre, axe, visible) {
  const g = el('g', {});
  for (const at of agent.attentes) {
    const x0 = axe.x(at.debut);
    const x1 = Math.max(x0 + 1.5, axe.x(at.fin ?? deroule.fin));
    if (!visible(x0, x1)) continue;
